<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 480" width="680" height="480" role="img" aria-labelledby="fT fD">
  <title id="fT">Module 4, broken into parts</title>
  <desc id="fD">A tree with four levels. At the top, the whole problem: drive from the start to a destination, on its own. It splits into two parts. The planner, compute_manhattan_path(), built in Lessons 4-3 and 4-4, is small enough to build and test in one go. The driver, drive_path(), built in Lessons 4-5 and 4-6, splits into two steps at each intersection: 1, turn to face the next intersection; 2, drive to the next intersection, with the LINE TRACKING functions built in Module 2. Turning splits once more: which way to face, get_desired_heading(), Lesson 4-5, and turn until facing the next intersection, turn_to(), Lesson 4-6. An arrow from planner to driver is labeled "list of (x, y) coordinates, the one thing they share".</desc>
  <style>
    .h   { font-family: Montserrat, Helvetica, Arial, sans-serif; font-size: 14px; font-weight: 700; fill: #22527B; }
    .n   { font-family: Montserrat, Helvetica, Arial, sans-serif; font-size: 12.5px; fill: #343A40; }
    .nb  { font-family: Montserrat, Helvetica, Arial, sans-serif; font-size: 12.5px; font-weight: 700; fill: #142D50; }
    .sm  { font-family: Montserrat, Helvetica, Arial, sans-serif; font-size: 11.5px; fill: #6C757D; }
    .ax  { font-family: Montserrat, Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 700; fill: #6C757D; }
    .m   { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12.5px; font-weight: 700; fill: #142D50; }
    .ms  { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11.5px; font-weight: 600; fill: #343A40; }
  </style>
  <defs>
    <marker id="aB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#22527B"/></marker>
    <marker id="aW" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#FFFFFF"/></marker>
    <marker id="aG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6C757D"/></marker>
    <marker id="aR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D1182C"/></marker>
    <marker id="aGr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E7D32"/></marker>
    <marker id="pcArr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6C757D"/>
    </marker>
    <marker id="pcDim" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,1 L5,5 L0,9" fill="none" stroke="#142D50" stroke-width="1.6"/>
    </marker>

    <!-- The XRP from above, traced from SparkFun's top-view photo. Front is UP.
         Origin = center of rotation (the pen hole between the drive wheels).
         Units: 1 unit = 4 photo px; the sensors are 60 units (8.75 cm) ahead of the origin. -->
    <g id="pcXRP" stroke-linejoin="round">
      <!-- rails out to the front casters -->
      <rect x="-59" y="-80" width="8" height="40" fill="#C3C8CD" stroke="#5F666D" stroke-width="1.3"/>
      <rect x="51"  y="-80" width="8" height="40" fill="#C3C8CD" stroke="#5F666D" stroke-width="1.3"/>
      <!-- main chassis plate -->
      <rect x="-59" y="-46" width="118" height="75" rx="8" fill="#D3D7DB" fill-opacity="0.92" stroke="#5F666D" stroke-width="1.5"/>
      <rect x="-50" y="-38" width="100" height="58" rx="4" fill="#E9ECEF" fill-opacity="0.85" stroke="#9AA1A8" stroke-width="0.8"/>
      <!-- caster bosses at the front corners -->
      <circle cx="-49" cy="-79" r="10" fill="#C3C8CD" stroke="#5F666D" stroke-width="1.3"/>
      <circle cx="49"  cy="-79" r="10" fill="#C3C8CD" stroke="#5F666D" stroke-width="1.3"/>
      <circle cx="-49" cy="-79" r="4.5" fill="#F1EBDD" stroke="#8A7E62" stroke-width="0.8"/>
      <circle cx="49"  cy="-79" r="4.5" fill="#F1EBDD" stroke="#8A7E62" stroke-width="0.8"/>
      <!-- drive wheels -->
      <rect x="-56" y="-21" width="11" height="42" rx="3.5" fill="#2B2B2B"/>
      <rect x="45"  y="-21" width="11" height="42" rx="3.5" fill="#2B2B2B"/>
      <line x1="-50.5" y1="-17" x2="-50.5" y2="17" stroke="#6C757D" stroke-width="1"/>
      <line x1="50.5"  y1="-17" x2="50.5"  y2="17" stroke="#6C757D" stroke-width="1"/>
      <!-- battery latches -->
      <rect x="-40" y="-30" width="6" height="12" rx="2" fill="#F05A28"/>
      <rect x="34"  y="-30" width="6" height="12" rx="2" fill="#F05A28"/>
      <!-- controller board -->
      <rect x="-24" y="-42" width="48" height="37" rx="2" fill="#D1182C"/>
      <rect x="-6" y="-41" width="12" height="35" rx="1" fill="#2B2B2B"/>
      <!-- servo + arm at the back -->
      <rect x="-26" y="22" width="15" height="13" rx="1.5" fill="#2B2B2B"/>
      <rect x="-34" y="24" width="8" height="26" rx="2" fill="#AEB4BA" stroke="#5F666D" stroke-width="1"/>
      <!-- rangefinder bracket, board and the two cylinders -->
      <rect x="-16" y="-58" width="32" height="13" rx="2" fill="#AEB4BA" stroke="#5F666D" stroke-width="1"/>
      <rect x="-18" y="-65" width="36" height="8" rx="1.5" fill="#B5172A"/>
      <circle cx="-8" cy="-68" r="5.5" fill="#E4E7EA" stroke="#868E96" stroke-width="1"/>
      <circle cx="8"  cy="-68" r="5.5" fill="#E4E7EA" stroke="#868E96" stroke-width="1"/>
      <!-- the two line sensors, under the rangefinder (drawn as if seen through it) -->
      <circle cx="-6.5" cy="-60" r="4" fill="#FFD43B" stroke="#142D50" stroke-width="1.4"/>
      <circle cx="6.5"  cy="-60" r="4" fill="#FFD43B" stroke="#142D50" stroke-width="1.4"/>
      <!-- center of rotation: the pen hole -->
      <circle cx="0" cy="0" r="5" fill="#FFFFFF" stroke="#142D50" stroke-width="1.8"/>
      <circle cx="0" cy="0" r="1.8" fill="#142D50"/>
    </g>

    <!-- the same robot after a right turn, as a dashed ghost -->
    <g id="pcGhost" fill="none" stroke="#343A40" stroke-width="1.4" stroke-dasharray="4 3">
      <path d="M -51 -46 V -72 M 51 -46 V -72 M -59 -36 V -79 M 59 -36 V -79 M -59 -46 H 59"/>
      <circle cx="-49" cy="-79" r="10"/>
      <circle cx="49"  cy="-79" r="10"/>
      <rect x="-18" y="-65" width="36" height="8" rx="1.5"/>
      <circle cx="-6.5" cy="-60" r="4.5" fill="#FFFFFF" stroke="#D1182C" stroke-width="2.4" stroke-dasharray="none"/>
      <circle cx="6.5"  cy="-60" r="4.5" fill="#FFFFFF" stroke="#D1182C" stroke-width="2.4" stroke-dasharray="none"/>
    </g>
  </defs>
  <rect width="680" height="480" fill="#FFFFFF"/>
  <style>
    [data-parent] { transition: opacity .3s ease; }
    .hid { opacity: 0; visibility: hidden; }
    [data-expand] { cursor: pointer; }
    [data-expand]:hover rect.bx, [data-expand]:focus rect.bx { stroke-width: 3.5; }
    [data-expand]:focus { outline: none; }
    .ind-minus { display: none; }
    .open .ind-minus { display: inline; }
    .open .ind-plus { display: none; }
  </style>
  <g data-node="whole" data-expand="1" class="open" aria-label="The whole problem: show its parts"><rect class="bx" x="160" y="12" width="360" height="52" rx="10" fill="#F8F9FA" stroke="#495057" stroke-width="2"/><text class="h" x="340.0" y="34.0" text-anchor="middle">The whole problem</text><text class="sm" x="340.0" y="54.0" text-anchor="middle">drive from the start to a destination, on its own</text><circle cx="505" cy="27" r="9.5" fill="#495057"/><text class="ind-plus" x="505" y="32.5" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#FFFFFF">+</text><text class="ind-minus" x="505" y="32.5" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#FFFFFF">&#8722;</text></g>
  <g data-parent="whole"><line x1="340" y1="64" x2="340" y2="88" stroke="#ADB5BD" stroke-width="2"/><line x1="134.0" y1="88" x2="546.0" y2="88" stroke="#ADB5BD" stroke-width="2"/><line x1="134.0" y1="88" x2="134.0" y2="110" stroke="#ADB5BD" stroke-width="2" marker-end="url(#aG)"/><line x1="546.0" y1="88" x2="546.0" y2="110" stroke="#ADB5BD" stroke-width="2" marker-end="url(#aG)"/></g>
  <g data-parent="whole"><rect class="bx" x="16" y="112" width="236" height="76" rx="10" fill="#F1F6FB" stroke="#22527B" stroke-width="2"/><text class="h" x="134.0" y="134.0" text-anchor="middle">The planner</text><text class="ms" x="134.0" y="154.0" text-anchor="middle">compute_manhattan_path()</text><text class="sm" x="134.0" y="172.0" text-anchor="middle">Lessons 4-3 and 4-4</text></g>
  <g data-parent="whole" data-node="driver" data-expand="1" class="open" aria-label="The driver: show its parts"><rect class="bx" x="428" y="112" width="236" height="76" rx="10" fill="#FDF2F3" stroke="#D1182C" stroke-width="2"/><text class="h" x="546.0" y="134.0" text-anchor="middle">The driver</text><text class="ms" x="546.0" y="154.0" text-anchor="middle">drive_path()</text><text class="sm" x="546.0" y="172.0" text-anchor="middle">Lessons 4-5 and 4-6</text><circle cx="649" cy="127" r="9.5" fill="#D1182C"/><text class="ind-plus" x="649" y="132.5" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#FFFFFF">+</text><text class="ind-minus" x="649" y="132.5" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#FFFFFF">&#8722;</text></g>
  <g data-parent="whole"><line x1="254" y1="162" x2="424" y2="162" stroke="#495057" stroke-width="2.2" marker-end="url(#aG)"/><rect x="254.0" y="131" width="172" height="20" rx="5" fill="#FFFFFF" stroke="#ADB5BD" stroke-width="1.4"/><text class="nb" x="340" y="145.5" text-anchor="middle">list of (x, y) coordinates</text><text class="sm" x="340" y="182" text-anchor="middle">the one thing they share</text><text class="sm" x="134.0" y="228" text-anchor="middle">small enough to build</text><text class="sm" x="134.0" y="244" text-anchor="middle">and test in one go</text></g>
  <g data-parent="driver"><line x1="546.0" y1="188" x2="546.0" y2="212" stroke="#ADB5BD" stroke-width="2"/><line x1="343.0" y1="212" x2="565.0" y2="212" stroke="#ADB5BD" stroke-width="2"/><line x1="343.0" y1="212" x2="343.0" y2="238" stroke="#ADB5BD" stroke-width="2" marker-end="url(#aG)"/><line x1="565.0" y1="212" x2="565.0" y2="238" stroke="#ADB5BD" stroke-width="2" marker-end="url(#aG)"/></g>
  <g data-parent="driver" data-node="turn" data-expand="1" aria-label="1 · Turn to face the next intersection: show its parts"><rect class="bx" x="238" y="240" width="210" height="92" rx="10" fill="#FFFFFF" stroke="#D1182C" stroke-width="2"/><text class="nb" x="343.0" y="268.0" text-anchor="middle">1 · Turn to face</text><text class="nb" x="343.0" y="287.0" text-anchor="middle">the next intersection</text><text class="sm" x="343.0" y="308.0" text-anchor="middle">Lessons 4-5 and 4-6</text><circle cx="433" cy="255" r="9.5" fill="#D1182C"/><text class="ind-plus" x="433" y="260.5" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#FFFFFF">+</text><text class="ind-minus" x="433" y="260.5" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#FFFFFF">&#8722;</text></g>
  <g data-parent="driver"><rect class="bx" x="460" y="240" width="210" height="92" rx="10" fill="#FFFFFF" stroke="#D1182C" stroke-width="2"/><text class="nb" x="565.0" y="260.0" text-anchor="middle">2 · Drive to</text><text class="nb" x="565.0" y="279.0" text-anchor="middle">the next intersection</text><text class="ms" x="565.0" y="299.0" text-anchor="middle">LINE TRACKING</text><text class="sm" x="565.0" y="317.0" text-anchor="middle">built in Module 2</text></g>
</svg>
