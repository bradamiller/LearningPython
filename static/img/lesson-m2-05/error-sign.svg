<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 276" width="680" height="276" role="img" aria-labelledby="esT esD" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="esT">The sign of the error says which way to steer</title>
  <desc id="esD">Three close-ups of the XRP's front following the left edge of a black line with its left sensor. Drifted onto white: the left sensor reads 0.2, error = 0.5 − 0.2 = +0.3, steer right, toward the line. On the edge: it reads 0.5, error 0.0, drive straight. Drifted onto black: it reads 0.8, error = 0.5 − 0.8 = −0.3, steer left, back off the line.</desc>
  <style>
    .h  { font-family: Montserrat, Helvetica, Arial, sans-serif; font-size: 13.5px; font-weight: 700; fill: #22527B; }
    .m  { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12.5px; font-weight: 600; fill: #343A40; }
    .me { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12.5px; font-weight: 700; fill: #D1182C; }
    .st { font-family: Montserrat, Helvetica, Arial, sans-serif; font-size: 12.5px; font-weight: 700; fill: #2E7D32; }
    .sm { font-family: Montserrat, Helvetica, Arial, sans-serif; font-size: 11.5px; fill: #6C757D; }
  </style>
  <defs>
    <marker id="esA" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2E7D32"/></marker>
    <clipPath id="es0"><rect x="12" y="34" width="190" height="150" rx="6"/></clipPath>
    <clipPath id="es1"><rect x="225" y="34" width="190" height="150" rx="6"/></clipPath>
    <clipPath id="es2"><rect x="438" y="34" width="190" height="150" rx="6"/></clipPath>
    <marker id="pcArr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6C757D"/>
    </marker>
    <marker id="pcDim" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,1 L5,5 L0,9" fill="none" stroke="#142D50" stroke-width="1.6"/>
    </marker>

    <!-- The XRP from above, traced from SparkFun's top-view photo. Front is UP.
         Origin = center of rotation (the pen hole between the drive wheels).
         Units: 1 unit = 4 photo px; the sensors are 60 units (8.75 cm) ahead of the origin. -->
    <g id="pcXRP" stroke-linejoin="round">
      <!-- rails out to the front casters -->
      <rect x="-59" y="-80" width="8" height="40" fill="#C3C8CD" stroke="#5F666D" stroke-width="1.3"/>
      <rect x="51"  y="-80" width="8" height="40" fill="#C3C8CD" stroke="#5F666D" stroke-width="1.3"/>
      <!-- main chassis plate -->
      <rect x="-59" y="-46" width="118" height="75" rx="8" fill="#D3D7DB" fill-opacity="0.92" stroke="#5F666D" stroke-width="1.5"/>
      <rect x="-50" y="-38" width="100" height="58" rx="4" fill="#E9ECEF" fill-opacity="0.85" stroke="#9AA1A8" stroke-width="0.8"/>
      <!-- caster bosses at the front corners -->
      <circle cx="-49" cy="-79" r="10" fill="#C3C8CD" stroke="#5F666D" stroke-width="1.3"/>
      <circle cx="49"  cy="-79" r="10" fill="#C3C8CD" stroke="#5F666D" stroke-width="1.3"/>
      <circle cx="-49" cy="-79" r="4.5" fill="#F1EBDD" stroke="#8A7E62" stroke-width="0.8"/>
      <circle cx="49"  cy="-79" r="4.5" fill="#F1EBDD" stroke="#8A7E62" stroke-width="0.8"/>
      <!-- drive wheels -->
      <rect x="-56" y="-21" width="11" height="42" rx="3.5" fill="#2B2B2B"/>
      <rect x="45"  y="-21" width="11" height="42" rx="3.5" fill="#2B2B2B"/>
      <line x1="-50.5" y1="-17" x2="-50.5" y2="17" stroke="#6C757D" stroke-width="1"/>
      <line x1="50.5"  y1="-17" x2="50.5"  y2="17" stroke="#6C757D" stroke-width="1"/>
      <!-- battery latches -->
      <rect x="-40" y="-30" width="6" height="12" rx="2" fill="#F05A28"/>
      <rect x="34"  y="-30" width="6" height="12" rx="2" fill="#F05A28"/>
      <!-- controller board -->
      <rect x="-24" y="-42" width="48" height="37" rx="2" fill="#D1182C"/>
      <rect x="-6" y="-41" width="12" height="35" rx="1" fill="#2B2B2B"/>
      <!-- servo + arm at the back -->
      <rect x="-26" y="22" width="15" height="13" rx="1.5" fill="#2B2B2B"/>
      <rect x="-34" y="24" width="8" height="26" rx="2" fill="#AEB4BA" stroke="#5F666D" stroke-width="1"/>
      <!-- rangefinder bracket, board and the two cylinders -->
      <rect x="-16" y="-58" width="32" height="13" rx="2" fill="#AEB4BA" stroke="#5F666D" stroke-width="1"/>
      <rect x="-18" y="-65" width="36" height="8" rx="1.5" fill="#B5172A"/>
      <circle cx="-8" cy="-68" r="5.5" fill="#E4E7EA" stroke="#868E96" stroke-width="1"/>
      <circle cx="8"  cy="-68" r="5.5" fill="#E4E7EA" stroke="#868E96" stroke-width="1"/>
      <!-- the two line sensors, under the rangefinder (drawn as if seen through it) -->
      <circle cx="-6.5" cy="-60" r="4" fill="#FFD43B" stroke="#142D50" stroke-width="1.4"/>
      <circle cx="6.5"  cy="-60" r="4" fill="#FFD43B" stroke="#142D50" stroke-width="1.4"/>
      <!-- center of rotation: the pen hole -->
      <circle cx="0" cy="0" r="5" fill="#FFFFFF" stroke="#142D50" stroke-width="1.8"/>
      <circle cx="0" cy="0" r="1.8" fill="#142D50"/>
    </g>

    <!-- the same robot after a right turn, as a dashed ghost -->
    <g id="pcGhost" fill="none" stroke="#343A40" stroke-width="1.4" stroke-dasharray="4 3">
      <path d="M -51 -46 V -72 M 51 -46 V -72 M -59 -36 V -79 M 59 -36 V -79 M -59 -46 H 59"/>
      <circle cx="-49" cy="-79" r="10"/>
      <circle cx="49"  cy="-79" r="10"/>
      <rect x="-18" y="-65" width="36" height="8" rx="1.5"/>
      <circle cx="-6.5" cy="-60" r="4.5" fill="#FFFFFF" stroke="#D1182C" stroke-width="2.4" stroke-dasharray="none"/>
      <circle cx="6.5"  cy="-60" r="4.5" fill="#FFFFFF" stroke="#D1182C" stroke-width="2.4" stroke-dasharray="none"/>
    </g>
  </defs>
  <rect width="680" height="276" fill="#FFFFFF"/>
  <text class="h" x="12" y="22">Drifted onto white</text>
  <g clip-path="url(#es0)"><rect x="12" y="34" width="190" height="150" fill="#FFFFFF"/>
  <rect x="108.525" y="34" width="35.2" height="150" fill="#2B2B2B"/>
  <use href="#pcXRP" transform="translate(107.0 173.0) scale(1.15)" opacity="0.8"/>
  <circle cx="114.475" cy="104" r="4.6" fill="#ADB5BD" stroke="#868E96"/>
  <circle cx="99.525" cy="104" r="8" fill="none" stroke="#D1182C" stroke-width="2.6"/>
  <path d="M 107.0 82 Q 107.0 48 155.0 46" fill="none" stroke="#2E7D32" stroke-width="3.4" marker-end="url(#esA)"/>
  </g>
  <rect x="12" y="34" width="190" height="150" rx="6" fill="none" stroke="#ADB5BD"/>
  <text class="m" x="12" y="204">left reads 0.2</text>
  <text class="me" x="12" y="222">error = 0.5 − 0.2 = +0.3</text>
  <text class="st" x="12" y="241">steer right, toward the line</text>
  <text class="h" x="225" y="22">On the edge</text>
  <g clip-path="url(#es1)"><rect x="225" y="34" width="190" height="150" fill="#FFFFFF"/>
  <rect x="312.525" y="34" width="35.2" height="150" fill="#2B2B2B"/>
  <use href="#pcXRP" transform="translate(320.0 173.0) scale(1.15)" opacity="0.8"/>
  <circle cx="327.475" cy="104" r="4.6" fill="#ADB5BD" stroke="#868E96"/>
  <circle cx="312.525" cy="104" r="8" fill="none" stroke="#D1182C" stroke-width="2.6"/>
  <line x1="320.0" y1="82" x2="320.0" y2="44" stroke="#2E7D32" stroke-width="3.4" marker-end="url(#esA)"/>
  </g>
  <rect x="225" y="34" width="190" height="150" rx="6" fill="none" stroke="#ADB5BD"/>
  <text class="m" x="225" y="204">left reads 0.5</text>
  <text class="me" x="225" y="222">error = 0.5 − 0.5 = 0.0</text>
  <text class="st" x="225" y="241">drive straight</text>
  <text class="h" x="438" y="22">Drifted onto black</text>
  <g clip-path="url(#es2)"><rect x="438" y="34" width="190" height="150" fill="#FFFFFF"/>
  <rect x="517.525" y="34" width="35.2" height="150" fill="#2B2B2B"/>
  <use href="#pcXRP" transform="translate(533.0 173.0) scale(1.15)" opacity="0.8"/>
  <circle cx="540.475" cy="104" r="4.6" fill="#ADB5BD" stroke="#868E96"/>
  <circle cx="525.525" cy="104" r="8" fill="none" stroke="#D1182C" stroke-width="2.6"/>
  <path d="M 533.0 82 Q 533.0 48 485.0 46" fill="none" stroke="#2E7D32" stroke-width="3.4" marker-end="url(#esA)"/>
  </g>
  <rect x="438" y="34" width="190" height="150" rx="6" fill="none" stroke="#ADB5BD"/>
  <text class="m" x="438" y="204">left reads 0.8</text>
  <text class="me" x="438" y="222">error = 0.5 − 0.8 = −0.3</text>
  <text class="st" x="438" y="241">steer left, back off the line</text>
  <text class="sm" x="12" y="266">Red ring: the left sensor, the one this follower reads. The robot rides the line's left edge.</text>
</svg>
