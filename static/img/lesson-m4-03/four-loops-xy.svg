<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 390" width="680" height="390" role="img" aria-labelledby="fT fD">
  <title id="fT">The four while loops of the Manhattan planner</title>
  <desc id="fD">Left: one intersection with four arrows. North: y plus 1, while y &lt; dest. South: y minus 1, while y &gt; dest. East: x plus 1, while x &lt; dest. West: x minus 1, while x &gt; dest. Right: the trip from (1, 3) to (3, 0) on a 4 by 4 grid with (0, 0) at the bottom-left: the path goes two steps right, then three steps down. East runs twice, west is skipped, north is skipped, south runs three times. A loop whose condition starts False never runs, so no if/else is needed. The path is [(2,3), (3,3), (3,2), (3,1), (3,0)].</desc>
  <style>
    .h   { font-family: Montserrat, Helvetica, Arial, sans-serif; font-size: 14px; font-weight: 700; fill: #22527B; }
    .n   { font-family: Montserrat, Helvetica, Arial, sans-serif; font-size: 12.5px; fill: #343A40; }
    .nb  { font-family: Montserrat, Helvetica, Arial, sans-serif; font-size: 12.5px; font-weight: 700; fill: #142D50; }
    .sm  { font-family: Montserrat, Helvetica, Arial, sans-serif; font-size: 11.5px; fill: #6C757D; }
    .ax  { font-family: Montserrat, Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 700; fill: #6C757D; }
    .m   { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12.5px; font-weight: 700; fill: #142D50; }
    .ms  { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11.5px; font-weight: 600; fill: #343A40; }
  </style>
  <defs>
    <marker id="aB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#22527B"/></marker>
    <marker id="aW" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#FFFFFF"/></marker>
    <marker id="aG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6C757D"/></marker>
    <marker id="aR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D1182C"/></marker>
    <marker id="aGr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E7D32"/></marker>
    <marker id="pcArr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6C757D"/>
    </marker>
    <marker id="pcDim" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,1 L5,5 L0,9" fill="none" stroke="#142D50" stroke-width="1.6"/>
    </marker>

    <!-- The XRP from above, traced from SparkFun's top-view photo. Front is UP.
         Origin = center of rotation (the pen hole between the drive wheels).
         Units: 1 unit = 4 photo px; the sensors are 60 units (8.75 cm) ahead of the origin. -->
    <g id="pcXRP" stroke-linejoin="round">
      <!-- rails out to the front casters -->
      <rect x="-59" y="-80" width="8" height="40" fill="#C3C8CD" stroke="#5F666D" stroke-width="1.3"/>
      <rect x="51"  y="-80" width="8" height="40" fill="#C3C8CD" stroke="#5F666D" stroke-width="1.3"/>
      <!-- main chassis plate -->
      <rect x="-59" y="-46" width="118" height="75" rx="8" fill="#D3D7DB" fill-opacity="0.92" stroke="#5F666D" stroke-width="1.5"/>
      <rect x="-50" y="-38" width="100" height="58" rx="4" fill="#E9ECEF" fill-opacity="0.85" stroke="#9AA1A8" stroke-width="0.8"/>
      <!-- caster bosses at the front corners -->
      <circle cx="-49" cy="-79" r="10" fill="#C3C8CD" stroke="#5F666D" stroke-width="1.3"/>
      <circle cx="49"  cy="-79" r="10" fill="#C3C8CD" stroke="#5F666D" stroke-width="1.3"/>
      <circle cx="-49" cy="-79" r="4.5" fill="#F1EBDD" stroke="#8A7E62" stroke-width="0.8"/>
      <circle cx="49"  cy="-79" r="4.5" fill="#F1EBDD" stroke="#8A7E62" stroke-width="0.8"/>
      <!-- drive wheels -->
      <rect x="-56" y="-21" width="11" height="42" rx="3.5" fill="#2B2B2B"/>
      <rect x="45"  y="-21" width="11" height="42" rx="3.5" fill="#2B2B2B"/>
      <line x1="-50.5" y1="-17" x2="-50.5" y2="17" stroke="#6C757D" stroke-width="1"/>
      <line x1="50.5"  y1="-17" x2="50.5"  y2="17" stroke="#6C757D" stroke-width="1"/>
      <!-- battery latches -->
      <rect x="-40" y="-30" width="6" height="12" rx="2" fill="#F05A28"/>
      <rect x="34"  y="-30" width="6" height="12" rx="2" fill="#F05A28"/>
      <!-- controller board -->
      <rect x="-24" y="-42" width="48" height="37" rx="2" fill="#D1182C"/>
      <rect x="-6" y="-41" width="12" height="35" rx="1" fill="#2B2B2B"/>
      <!-- servo + arm at the back -->
      <rect x="-26" y="22" width="15" height="13" rx="1.5" fill="#2B2B2B"/>
      <rect x="-34" y="24" width="8" height="26" rx="2" fill="#AEB4BA" stroke="#5F666D" stroke-width="1"/>
      <!-- rangefinder bracket, board and the two cylinders -->
      <rect x="-16" y="-58" width="32" height="13" rx="2" fill="#AEB4BA" stroke="#5F666D" stroke-width="1"/>
      <rect x="-18" y="-65" width="36" height="8" rx="1.5" fill="#B5172A"/>
      <circle cx="-8" cy="-68" r="5.5" fill="#E4E7EA" stroke="#868E96" stroke-width="1"/>
      <circle cx="8"  cy="-68" r="5.5" fill="#E4E7EA" stroke="#868E96" stroke-width="1"/>
      <!-- the two line sensors, under the rangefinder (drawn as if seen through it) -->
      <circle cx="-6.5" cy="-60" r="4" fill="#FFD43B" stroke="#142D50" stroke-width="1.4"/>
      <circle cx="6.5"  cy="-60" r="4" fill="#FFD43B" stroke="#142D50" stroke-width="1.4"/>
      <!-- center of rotation: the pen hole -->
      <circle cx="0" cy="0" r="5" fill="#FFFFFF" stroke="#142D50" stroke-width="1.8"/>
      <circle cx="0" cy="0" r="1.8" fill="#142D50"/>
    </g>

    <!-- the same robot after a right turn, as a dashed ghost -->
    <g id="pcGhost" fill="none" stroke="#343A40" stroke-width="1.4" stroke-dasharray="4 3">
      <path d="M -51 -46 V -72 M 51 -46 V -72 M -59 -36 V -79 M 59 -36 V -79 M -59 -46 H 59"/>
      <circle cx="-49" cy="-79" r="10"/>
      <circle cx="49"  cy="-79" r="10"/>
      <rect x="-18" y="-65" width="36" height="8" rx="1.5"/>
      <circle cx="-6.5" cy="-60" r="4.5" fill="#FFFFFF" stroke="#D1182C" stroke-width="2.4" stroke-dasharray="none"/>
      <circle cx="6.5"  cy="-60" r="4.5" fill="#FFFFFF" stroke="#D1182C" stroke-width="2.4" stroke-dasharray="none"/>
    </g>
  </defs>
  <rect width="680" height="390" fill="#FFFFFF"/>
  <text class="h" x="20" y="28">Four loops, one per direction</text>
  <rect x="20" y="44" width="300" height="300" rx="8" fill="#F8F9FA" stroke="#DEE2E6"/>
  <rect x="165.5" y="136" width="9" height="88" fill="#2B2B2B"/><rect x="126" y="175.5" width="88" height="9" fill="#2B2B2B"/>
  <circle cx="170" cy="180" r="8" fill="#FFFFFF" stroke="#22527B" stroke-width="2.4"/>
  <line x1="170" y1="168" x2="170" y2="140" stroke="#4C8BF5" stroke-width="4"/>
  <path d="M 170 130 L 177 142 L 163 142 z" fill="#4C8BF5"/>
  <rect x="108.0" y="58.0" width="124" height="44" rx="7" fill="#FFFFFF" stroke="#22527B" stroke-width="1.4"/>
  <text class="nb" x="170" y="76" text-anchor="middle">north: y + 1</text>
  <text class="ms" x="170" y="93" text-anchor="middle">while y &lt; dest</text>
  <line x1="170" y1="192" x2="170" y2="220" stroke="#4C8BF5" stroke-width="4"/>
  <path d="M 170 230 L 163 218 L 177 218 z" fill="#4C8BF5"/>
  <rect x="108.0" y="276.0" width="124" height="44" rx="7" fill="#FFFFFF" stroke="#22527B" stroke-width="1.4"/>
  <text class="nb" x="170" y="294" text-anchor="middle">south: y − 1</text>
  <text class="ms" x="170" y="311" text-anchor="middle">while y &gt; dest</text>
  <line x1="182" y1="180" x2="210" y2="180" stroke="#4C8BF5" stroke-width="4"/>
  <path d="M 220 180 L 208 173 L 208 187 z" fill="#4C8BF5"/>
  <rect x="178.0" y="214.0" width="124" height="44" rx="7" fill="#FFFFFF" stroke="#22527B" stroke-width="1.4"/>
  <text class="nb" x="240" y="232" text-anchor="middle">east: x + 1</text>
  <text class="ms" x="240" y="249" text-anchor="middle">while x &lt; dest</text>
  <line x1="158" y1="180" x2="130" y2="180" stroke="#4C8BF5" stroke-width="4"/>
  <path d="M 120 180 L 132 187 L 132 173 z" fill="#4C8BF5"/>
  <rect x="38.0" y="214.0" width="124" height="44" rx="7" fill="#FFFFFF" stroke="#22527B" stroke-width="1.4"/>
  <text class="nb" x="100" y="232" text-anchor="middle">west: x − 1</text>
  <text class="ms" x="100" y="249" text-anchor="middle">while x &gt; dest</text>
  <text class="h" x="342" y="28">One trip: (1, 3) → (3, 0)</text>
  <rect x="352" y="80" width="204" height="204" rx="8" fill="#F3F4F6" stroke="#DEE2E6"/>
  <rect x="371.5" y="80" width="9" height="204" fill="#2B2B2B"/>
  <rect x="352" y="99.5" width="204" height="9" fill="#2B2B2B"/>
  <rect x="423.5" y="80" width="9" height="204" fill="#2B2B2B"/>
  <rect x="352" y="151.5" width="204" height="9" fill="#2B2B2B"/>
  <rect x="475.5" y="80" width="9" height="204" fill="#2B2B2B"/>
  <rect x="352" y="203.5" width="204" height="9" fill="#2B2B2B"/>
  <rect x="527.5" y="80" width="9" height="204" fill="#2B2B2B"/>
  <rect x="352" y="255.5" width="204" height="9" fill="#2B2B2B"/>
  <text class="ax" x="376" y="300" text-anchor="middle">0</text>
  <text class="ax" x="342" y="264" text-anchor="end">0</text>
  <text class="ax" x="428" y="300" text-anchor="middle">1</text>
  <text class="ax" x="342" y="212" text-anchor="end">1</text>
  <text class="ax" x="480" y="300" text-anchor="middle">2</text>
  <text class="ax" x="342" y="160" text-anchor="end">2</text>
  <text class="ax" x="532" y="300" text-anchor="middle">3</text>
  <text class="ax" x="342" y="108" text-anchor="end">3</text>
  <text class="ax" x="454.0" y="316" text-anchor="middle" style="fill:#22527B">x →</text>
  <text class="ax" x="328" y="182.0" text-anchor="middle" transform="rotate(-90 328 182.0)" style="fill:#22527B">y →</text>
  <path d="M 428 104 L 532 104 L 532 260" fill="none" stroke="#4C8BF5" stroke-width="9" stroke-linejoin="round" stroke-linecap="round" opacity="0.85"/>
  <circle cx="480" cy="104" r="6" fill="#FFFFFF" stroke="#22527B" stroke-width="2.4"/>
  <circle cx="532" cy="104" r="6" fill="#FFFFFF" stroke="#22527B" stroke-width="2.4"/>
  <circle cx="532" cy="156" r="6" fill="#FFFFFF" stroke="#22527B" stroke-width="2.4"/>
  <circle cx="532" cy="208" r="6" fill="#FFFFFF" stroke="#22527B" stroke-width="2.4"/>
  <circle cx="532" cy="260" r="6" fill="#FFFFFF" stroke="#22527B" stroke-width="2.4"/>
  <circle cx="428" cy="104" r="7" fill="#142D50" stroke="#142D50" stroke-width="2.4"/>
  <rect x="369.0" y="77" width="46" height="20" rx="5" fill="#F1F3F5" stroke="#868E96" stroke-width="1.4"/><text class="nb" x="392" y="91.5" text-anchor="middle">start</text>
  <rect x="566" y="89" width="100" height="25" rx="12" fill="#E1F0E3" stroke="#2E7D32" stroke-width="1.4"/>
  <text class="nb" x="576" y="106" style="fill:#2E7D32">east</text><text class="sm" x="658" y="106" text-anchor="end" style="fill:#2E7D32">runs 2×</text>
  <rect x="566" y="121" width="100" height="25" rx="12" fill="#F8F9FA" stroke="#ADB5BD" stroke-width="1.4"/>
  <text class="nb" x="576" y="138" style="fill:#ADB5BD">west</text><text class="sm" x="658" y="138" text-anchor="end" style="fill:#ADB5BD">skipped</text>
  <rect x="566" y="153" width="100" height="25" rx="12" fill="#F8F9FA" stroke="#ADB5BD" stroke-width="1.4"/>
  <text class="nb" x="576" y="170" style="fill:#ADB5BD">north</text><text class="sm" x="658" y="170" text-anchor="end" style="fill:#ADB5BD">skipped</text>
  <rect x="566" y="185" width="100" height="25" rx="12" fill="#E1F0E3" stroke="#2E7D32" stroke-width="1.4"/>
  <text class="nb" x="576" y="202" style="fill:#2E7D32">south</text><text class="sm" x="658" y="202" text-anchor="end" style="fill:#2E7D32">runs 3×</text>
  <text class="n" x="342" y="336">A loop whose condition starts False</text>
  <text class="n" x="342" y="353">never runs, so no if/else is needed.</text>
  <text class="ms" x="342" y="376">[(2,3), (3,3), (3,2), (3,1), (3,0)]</text>
</svg>
