<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" width="680" height="300" role="img"
     aria-labelledby="shelfTitle shelfDesc">
  <title id="shelfTitle">XRPLib as a shelf of books</title>
  <desc id="shelfDesc">A bookshelf labeled XRPLib where each book is one piece of robot hardware —
    Reflectance, Rangefinder, Servo, IMU, Board, Motor, Encoder, Gamepad. The DifferentialDrive book
    has been taken off the shelf and opened, listing straight(), turn() and set_effort(); an arrow
    runs from the gap it left to the open book, labeled with the import statement.</desc>

  <style>
    .spine { font-family: Montserrat, Helvetica, Arial, sans-serif; font-size: 15px; font-weight: 600; fill: #fff; }
    .shelfWord { font-family: Montserrat, Helvetica, Arial, sans-serif; font-size: 17px; font-weight: 700; fill: #6C757D; letter-spacing: .08em; }
    .bookTitle { font-family: Montserrat, Helvetica, Arial, sans-serif; font-size: 17px; font-weight: 700; fill: #fff; }
    .method { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; fill: #fff; fill-opacity: .92; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; fill: #22527B; }
  </style>

  <rect x="0" y="0" width="680" height="300" fill="#FFFFFF"/>

  <!-- shelf -->
  <rect x="16" y="34" width="360" height="242" rx="6" fill="#F2EADF" stroke="#D9C7AE" stroke-width="2"/>
  <rect x="16" y="150" width="360" height="11" fill="#D9C7AE"/>
  <rect x="16" y="265" width="360" height="11" fill="#D9C7AE"/>
  <text class="shelfWord" x="18" y="24">XRPLib</text>

  <!-- top shelf -->
  <rect x="32" y="52" width="42" height="98" rx="3" fill="#22527B"/>
  <text class="spine" transform="translate(59,144) rotate(-90)">Reflectance</text>

  <rect x="80" y="52" width="42" height="98" rx="3" fill="#2E7D32"/>
  <text class="spine" transform="translate(107,144) rotate(-90)">Rangefinder</text>

  <rect x="128" y="52" width="44" height="98" rx="3" fill="#EDE2D3" stroke="#C9B294" stroke-width="1.5" stroke-dasharray="5 4"/>

  <rect x="178" y="52" width="42" height="98" rx="3" fill="#B8860B"/>
  <text class="spine" transform="translate(205,144) rotate(-90)">Servo</text>

  <rect x="226" y="52" width="42" height="98" rx="3" fill="#546C90"/>
  <text class="spine" transform="translate(253,144) rotate(-90)">IMU</text>

  <rect x="274" y="52" width="42" height="98" rx="3" fill="#8C5B3F"/>
  <text class="spine" transform="translate(301,144) rotate(-90)">Board</text>

  <rect x="322" y="52" width="42" height="98" rx="3" fill="#4F7FA8"/>
  <text class="spine" transform="translate(349,144) rotate(-90)">Encoder</text>

  <!-- bottom shelf -->
  <rect x="32" y="166" width="42" height="99" rx="3" fill="#8C5B3F"/>
  <text class="spine" transform="translate(59,259) rotate(-90)">Motor</text>

  <rect x="80" y="166" width="42" height="99" rx="3" fill="#2E7D32"/>
  <text class="spine" transform="translate(107,259) rotate(-90)">Gamepad</text>

  <rect x="128" y="166" width="42" height="99" rx="3" fill="#B8860B"/>
  <text class="spine" transform="translate(155,259) rotate(-90)">Pid</text>

  <rect x="176" y="166" width="42" height="99" rx="3" fill="#22527B"/>
  <text class="spine" transform="translate(203,259) rotate(-90)">Sound</text>

  <g transform="rotate(9 246 265)">
    <rect x="224" y="166" width="42" height="99" rx="3" fill="#546C90"/>
    <text class="spine" transform="translate(251,259) rotate(-90)">Timeout</text>
  </g>

  <!-- the book taken down -->
  <g transform="translate(470 66)">
    <rect x="0" y="0" width="150" height="150" rx="6" fill="#D1182C"/>
    <rect x="0" y="0" width="15" height="150" rx="6" fill="#A81223"/>
    <rect x="150" y="5" width="8" height="140" rx="3" fill="#F3F1EC"/>
    <text class="bookTitle" x="28" y="36">Differential</text>
    <text class="bookTitle" x="28" y="57">Drive</text>
    <line x1="28" y1="71" x2="120" y2="71" stroke="#fff" stroke-opacity=".5" stroke-width="2"/>
    <text class="method" x="28" y="95">straight()</text>
    <text class="method" x="28" y="115">turn()</text>
    <text class="method" x="28" y="135">set_effort()</text>
  </g>

  <!-- arrow: from the gap, over the shelf, to the book -->
  <path d="M 150 44 C 220 2, 380 6, 452 108" fill="none" stroke="#B8860B" stroke-width="3"
        stroke-linecap="round" stroke-dasharray="9 7"/>
  <path d="M 459 122 l -16 -5 l 7 -11 z" fill="#B8860B"/>

  <text class="code" x="418" y="246">from XRPLib.differential_drive</text>
  <text class="code" x="452" y="264">import DifferentialDrive</text>
</svg>
