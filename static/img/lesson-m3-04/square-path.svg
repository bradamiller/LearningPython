<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 370" width="680" height="370" role="img" aria-labelledby="gT gD" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="gT">A square path on the grid</title>
  <desc id="gD">The 3×3 grid with a square route around its outside. The robot starts parked on the top-left corner facing right. Each side arrives at two intersections, and there is a right turn at each corner; the intersections are numbered 1 to 8, and 8 is the corner it started on, so start and end are the same. Beside it, the loop in plain words: 4 times, drive SIDE intersections, turn right. SIDE is 2; four right turns make 360 degrees, so the robot ends facing the way it started.</desc>
  <style>
    .h   { font-family: Montserrat, Helvetica, Arial, sans-serif; font-size: 14px; font-weight: 700; fill: #22527B; }
    .n   { font-family: Montserrat, Helvetica, Arial, sans-serif; font-size: 12.5px; fill: #343A40; }
    .nb  { font-family: Montserrat, Helvetica, Arial, sans-serif; font-size: 12.5px; font-weight: 700; fill: #142D50; }
    .num { font-family: Montserrat, Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 700; fill: #22527B; }
    .pl  { font-family: "Comic Sans MS", "Chalkboard SE", "Marker Felt", Montserrat, sans-serif; font-size: 14px; fill: #142D50; }
  </style>
  <defs>
    <marker id="gA" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#FFFFFF"/></marker>
    <marker id="gL" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#495057"/></marker>
    <marker id="gR" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#D1182C"/></marker>
    <marker id="pcArr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6C757D"/>
    </marker>
    <marker id="pcDim" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,1 L5,5 L0,9" fill="none" stroke="#142D50" stroke-width="1.6"/>
    </marker>

    <!-- The XRP from above, traced from SparkFun's top-view photo. Front is UP.
         Origin = center of rotation (the pen hole between the drive wheels).
         Units: 1 unit = 4 photo px; the sensors are 60 units (8.75 cm) ahead of the origin. -->
    <g id="pcXRP" stroke-linejoin="round">
      <!-- rails out to the front casters -->
      <rect x="-59" y="-80" width="8" height="40" fill="#C3C8CD" stroke="#5F666D" stroke-width="1.3"/>
      <rect x="51"  y="-80" width="8" height="40" fill="#C3C8CD" stroke="#5F666D" stroke-width="1.3"/>
      <!-- main chassis plate -->
      <rect x="-59" y="-46" width="118" height="75" rx="8" fill="#D3D7DB" fill-opacity="0.92" stroke="#5F666D" stroke-width="1.5"/>
      <rect x="-50" y="-38" width="100" height="58" rx="4" fill="#E9ECEF" fill-opacity="0.85" stroke="#9AA1A8" stroke-width="0.8"/>
      <!-- caster bosses at the front corners -->
      <circle cx="-49" cy="-79" r="10" fill="#C3C8CD" stroke="#5F666D" stroke-width="1.3"/>
      <circle cx="49"  cy="-79" r="10" fill="#C3C8CD" stroke="#5F666D" stroke-width="1.3"/>
      <circle cx="-49" cy="-79" r="4.5" fill="#F1EBDD" stroke="#8A7E62" stroke-width="0.8"/>
      <circle cx="49"  cy="-79" r="4.5" fill="#F1EBDD" stroke="#8A7E62" stroke-width="0.8"/>
      <!-- drive wheels -->
      <rect x="-56" y="-21" width="11" height="42" rx="3.5" fill="#2B2B2B"/>
      <rect x="45"  y="-21" width="11" height="42" rx="3.5" fill="#2B2B2B"/>
      <line x1="-50.5" y1="-17" x2="-50.5" y2="17" stroke="#6C757D" stroke-width="1"/>
      <line x1="50.5"  y1="-17" x2="50.5"  y2="17" stroke="#6C757D" stroke-width="1"/>
      <!-- battery latches -->
      <rect x="-40" y="-30" width="6" height="12" rx="2" fill="#F05A28"/>
      <rect x="34"  y="-30" width="6" height="12" rx="2" fill="#F05A28"/>
      <!-- controller board -->
      <rect x="-24" y="-42" width="48" height="37" rx="2" fill="#D1182C"/>
      <rect x="-6" y="-41" width="12" height="35" rx="1" fill="#2B2B2B"/>
      <!-- servo + arm at the back -->
      <rect x="-26" y="22" width="15" height="13" rx="1.5" fill="#2B2B2B"/>
      <rect x="-34" y="24" width="8" height="26" rx="2" fill="#AEB4BA" stroke="#5F666D" stroke-width="1"/>
      <!-- rangefinder bracket, board and the two cylinders -->
      <rect x="-16" y="-58" width="32" height="13" rx="2" fill="#AEB4BA" stroke="#5F666D" stroke-width="1"/>
      <rect x="-18" y="-65" width="36" height="8" rx="1.5" fill="#B5172A"/>
      <circle cx="-8" cy="-68" r="5.5" fill="#E4E7EA" stroke="#868E96" stroke-width="1"/>
      <circle cx="8"  cy="-68" r="5.5" fill="#E4E7EA" stroke="#868E96" stroke-width="1"/>
      <!-- the two line sensors, under the rangefinder (drawn as if seen through it) -->
      <circle cx="-6.5" cy="-60" r="4" fill="#FFD43B" stroke="#142D50" stroke-width="1.4"/>
      <circle cx="6.5"  cy="-60" r="4" fill="#FFD43B" stroke="#142D50" stroke-width="1.4"/>
      <!-- center of rotation: the pen hole -->
      <circle cx="0" cy="0" r="5" fill="#FFFFFF" stroke="#142D50" stroke-width="1.8"/>
      <circle cx="0" cy="0" r="1.8" fill="#142D50"/>
    </g>

    <!-- the same robot after a right turn, as a dashed ghost -->
    <g id="pcGhost" fill="none" stroke="#343A40" stroke-width="1.4" stroke-dasharray="4 3">
      <path d="M -51 -46 V -72 M 51 -46 V -72 M -59 -36 V -79 M 59 -36 V -79 M -59 -46 H 59"/>
      <circle cx="-49" cy="-79" r="10"/>
      <circle cx="49"  cy="-79" r="10"/>
      <rect x="-18" y="-65" width="36" height="8" rx="1.5"/>
      <circle cx="-6.5" cy="-60" r="4.5" fill="#FFFFFF" stroke="#D1182C" stroke-width="2.4" stroke-dasharray="none"/>
      <circle cx="6.5"  cy="-60" r="4.5" fill="#FFFFFF" stroke="#D1182C" stroke-width="2.4" stroke-dasharray="none"/>
    </g>
  </defs>
  <rect width="680" height="370" fill="#FFFFFF"/>
  <rect x="20" y="20" width="330" height="330" rx="8" fill="#F3F4F6" stroke="#DEE2E6"/>
  <rect x="69.5" y="20" width="11" height="330" fill="#2B2B2B"/>
  <rect x="179.5" y="20" width="11" height="330" fill="#2B2B2B"/>
  <rect x="289.5" y="20" width="11" height="330" fill="#2B2B2B"/>
  <rect x="20" y="69.5" width="330" height="11" fill="#2B2B2B"/>
  <rect x="20" y="179.5" width="330" height="11" fill="#2B2B2B"/>
  <rect x="20" y="289.5" width="330" height="11" fill="#2B2B2B"/>
  <path d="M 75 75 L 295 75 L 295 295 L 75 295 L 75 75" fill="none" stroke="#4C8BF5" stroke-width="10" stroke-linejoin="round" stroke-linecap="round" opacity="0.85"/>
  <line x1="122.0" y1="75.0" x2="136.0" y2="75.0" stroke="#FFFFFF" stroke-width="3" marker-end="url(#gA)"/>
  <line x1="232.0" y1="75.0" x2="246.0" y2="75.0" stroke="#FFFFFF" stroke-width="3" marker-end="url(#gA)"/>
  <line x1="295.0" y1="122.0" x2="295.0" y2="136.0" stroke="#FFFFFF" stroke-width="3" marker-end="url(#gA)"/>
  <line x1="295.0" y1="232.0" x2="295.0" y2="246.0" stroke="#FFFFFF" stroke-width="3" marker-end="url(#gA)"/>
  <line x1="248.0" y1="295.0" x2="234.0" y2="295.0" stroke="#FFFFFF" stroke-width="3" marker-end="url(#gA)"/>
  <line x1="138.0" y1="295.0" x2="124.0" y2="295.0" stroke="#FFFFFF" stroke-width="3" marker-end="url(#gA)"/>
  <line x1="75.0" y1="248.0" x2="75.0" y2="234.0" stroke="#FFFFFF" stroke-width="3" marker-end="url(#gA)"/>
  <line x1="75.0" y1="138.0" x2="75.0" y2="124.0" stroke="#FFFFFF" stroke-width="3" marker-end="url(#gA)"/>
  <circle cx="185" cy="58" r="9" fill="#FFFFFF" stroke="#22527B" stroke-width="1.6"/><text class="num" x="185" y="62" text-anchor="middle">1</text>
  <circle cx="312" cy="58" r="9" fill="#FFFFFF" stroke="#22527B" stroke-width="1.6"/><text class="num" x="312" y="62" text-anchor="middle">2</text>
  <circle cx="313" cy="185" r="9" fill="#FFFFFF" stroke="#22527B" stroke-width="1.6"/><text class="num" x="313" y="189" text-anchor="middle">3</text>
  <circle cx="312" cy="312" r="9" fill="#FFFFFF" stroke="#22527B" stroke-width="1.6"/><text class="num" x="312" y="316" text-anchor="middle">4</text>
  <circle cx="185" cy="313" r="9" fill="#FFFFFF" stroke="#22527B" stroke-width="1.6"/><text class="num" x="185" y="317" text-anchor="middle">5</text>
  <circle cx="58" cy="312" r="9" fill="#FFFFFF" stroke="#22527B" stroke-width="1.6"/><text class="num" x="58" y="316" text-anchor="middle">6</text>
  <circle cx="57" cy="185" r="9" fill="#FFFFFF" stroke="#22527B" stroke-width="1.6"/><text class="num" x="57" y="189" text-anchor="middle">7</text>
  <circle cx="75" cy="30" r="9" fill="#FFFFFF" stroke="#22527B" stroke-width="1.6"/><text class="num" x="75" y="34" text-anchor="middle">8</text>
  <path d="M 259 89 A 11 11 0 1 1 258 106" fill="none" stroke="#D1182C" stroke-width="2.2" marker-end="url(#gR)"/>
  <path d="M 259 257 A 11 11 0 1 1 258 274" fill="none" stroke="#D1182C" stroke-width="2.2" marker-end="url(#gR)"/>
  <path d="M 91 257 A 11 11 0 1 1 90 274" fill="none" stroke="#D1182C" stroke-width="2.2" marker-end="url(#gR)"/>
  <path d="M 101 103 A 11 11 0 1 1 100 120" fill="none" stroke="#D1182C" stroke-width="2.2" marker-end="url(#gR)"/>
  <use href="#pcXRP" transform="translate(75 75) rotate(90) scale(0.5)" opacity="0.95"/>
  <text class="nb" x="26" y="150">start = end</text>
  <text class="h" x="390" y="70">One side per pass</text>
  <rect x="390" y="84" width="260" height="104" rx="6" fill="#FFFCEB" stroke="#E9D9A6"/>
  <text class="pl" x="404" y="112">4 times:</text>
  <text class="pl" x="420" y="142">drive SIDE intersections</text>
  <text class="pl" x="420" y="172">turn right</text>
  <text class="n" x="390" y="222">SIDE = 2. Four sides, four right</text>
  <text class="n" x="390" y="239">turns (360°): the robot is back on</text>
  <text class="n" x="390" y="256">the corner it started on, facing</text>
  <text class="n" x="390" y="273">the way it started.</text>
  <text class="n" x="390" y="305" style="fill:#6C757D">Numbers are the intersections it</text>
  <text class="n" x="390" y="322" style="fill:#6C757D">arrives at; 8 is the start corner.</text>
</svg>
