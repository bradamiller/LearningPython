<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 370" width="680" height="370" role="img" aria-labelledby="fT fD">
  <title id="fT">Run 1 and Run 2</title>
  <desc id="fD">Two runs from S at (0, 0), the bottom-left, to D at (3, 3), the far top-right, with boxes at (2, 0), (2, 2) and (3, 1). Run 1 starts with an empty list and finds each box only when it faces it: it reroutes at (1, 0) on seeing (2, 0), then twice at (2, 1) on seeing (3, 1) and (2, 2), backs up to (1, 1), and goes up the column at x = 1 and right along the top row: 8 steps and 3 reroutes. Run 2 starts with the three boxes typed in and plans around them from the start, up the column at x = 1 and right along the top row: 6 steps and 0 reroutes. Same planner, same driving code; only the blocked list it started with changed.</desc>
  <style>
    .h   { font-family: Montserrat, Helvetica, Arial, sans-serif; font-size: 14px; font-weight: 700; fill: #22527B; }
    .n   { font-family: Montserrat, Helvetica, Arial, sans-serif; font-size: 12.5px; fill: #343A40; }
    .nb  { font-family: Montserrat, Helvetica, Arial, sans-serif; font-size: 12.5px; font-weight: 700; fill: #142D50; }
    .sm  { font-family: Montserrat, Helvetica, Arial, sans-serif; font-size: 11.5px; fill: #6C757D; }
    .ax  { font-family: Montserrat, Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 700; fill: #6C757D; }
    .m   { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12.5px; font-weight: 700; fill: #142D50; }
    .ms  { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11.5px; font-weight: 600; fill: #343A40; }
  </style>
