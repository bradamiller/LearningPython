<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 352" width="680" height="352" role="img" aria-labelledby="tkT tkD" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="tkT">The LINE SENSOR toolkit in layers</title>
  <desc id="tkD">A layered diagram. At the bottom is reflectance, the sensor object created once at the top of
    robot.py. Only get_left() and get_right() read it. Above them, get_error(), is_either_on_line() and
    is_at_cross() call get_left() and get_right() instead of the hardware. THRESHOLD, a setting also created at
    the top of the file, feeds the two is_ functions. At the top, faded, the driving functions of Lessons 2-8 and
    2-9 ask the toolkit and never touch the sensor.</desc>
  <defs>
    <filter id="tkSketch" x="-5%" y="-10%" width="110%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="5"/>
      <feDisplacementMap in="SourceGraphic" scale="3"/>
    </filter>
    <marker id="tkA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#495057"/>
    </marker>
    <marker id="tkAm" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#C77C02"/>
    </marker>
  </defs>
  <style>
    .t    { font-family: Montserrat, Helvetica, Arial, sans-serif; }
    .m    { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .lab  { font-size: 12px; font-weight: 700; fill: #22527B; }
    .labs { font-size: 11.5px; fill: #6C757D; }
    .fn   { font-size: 13px; font-weight: 700; fill: #142D50; }
  </style>
  <rect width="680" height="352" fill="#FFFFFF"/>

  <!-- row labels -->
  <text class="t lab" x="12" y="44">drives on it</text>
  <text class="t labs" x="12" y="60">Lessons 2-8, 2-9</text>
  <text class="t lab" x="12" y="128">asks questions</text>
  <text class="t labs" x="12" y="144">calls the two below</text>
  <text class="t lab" x="12" y="211">reads the sensor</text>
  <text class="t labs" x="12" y="227">the only two that do</text>
  <text class="t lab" x="12" y="300">the hardware</text>
  <text class="t labs" x="12" y="316">a global</text>

  <!-- top: driving functions (faded) -->
  <g filter="url(#tkSketch)">
    <rect x="160" y="22" width="508" height="48" rx="8" fill="#FFFFFF" stroke="#ADB5BD" stroke-width="1.6" stroke-dasharray="6 4"/>
  </g>
  <text class="m" x="414" y="51" text-anchor="middle" font-size="12.5" fill="#868E96">track_to_intersection() · turn_clockwise() · …</text>
  <line x1="414" y1="72" x2="414" y2="100" stroke="#ADB5BD" stroke-width="1.8" stroke-dasharray="4 3" marker-end="url(#tkA)"/>

  <!-- row 2: questions -->
  <g filter="url(#tkSketch)">
    <rect x="160" y="106" width="130" height="40" rx="7" fill="#DCE8F3" stroke="#22527B" stroke-width="1.6"/>
    <rect x="302" y="106" width="182" height="40" rx="7" fill="#DCE8F3" stroke="#22527B" stroke-width="1.6"/>
    <rect x="496" y="106" width="150" height="40" rx="7" fill="#DCE8F3" stroke="#22527B" stroke-width="1.6"/>
  </g>
  <text class="m fn" x="225" y="131" text-anchor="middle">get_error()</text>
  <text class="m fn" x="393" y="131" text-anchor="middle">is_either_on_line()</text>
  <text class="m fn" x="571" y="131" text-anchor="middle">is_at_cross()</text>

  <!-- bus from row 2 down to row 3 -->
  <g stroke="#495057" stroke-width="1.8" fill="none">
    <path d="M 225 146 V 164 M 393 146 V 164 M 571 146 V 164 M 225 164 H 571"/>
    <path d="M 300 164 V 186" marker-end="url(#tkA)"/>
    <path d="M 486 164 V 186" marker-end="url(#tkA)"/>
  </g>

  <!-- row 3: raw readings -->
  <g filter="url(#tkSketch)">
    <rect x="236" y="190" width="128" height="40" rx="7" fill="#FBE3E6" stroke="#D1182C" stroke-width="1.8"/>
    <rect x="422" y="190" width="128" height="40" rx="7" fill="#FBE3E6" stroke="#D1182C" stroke-width="1.8"/>
  </g>
  <text class="m fn" x="300" y="215" text-anchor="middle">get_left()</text>
  <text class="m fn" x="486" y="215" text-anchor="middle">get_right()</text>
  <g stroke="#D1182C" stroke-width="2" fill="none">
    <path d="M 300 230 V 268" marker-end="url(#tkA)"/>
    <path d="M 486 230 V 268" marker-end="url(#tkA)"/>
  </g>

  <!-- THRESHOLD setting -->
  <g filter="url(#tkSketch)">
    <rect x="566" y="190" width="102" height="52" rx="7" fill="#FCEFD6" stroke="#C77C02" stroke-width="1.6"/>
  </g>
  <text class="m fn" x="617" y="212" text-anchor="middle" font-size="12.5">THRESHOLD</text>
  <text class="t labs" x="617" y="230" text-anchor="middle">a global setting</text>
  <path d="M 600 190 C 560 176, 420 178, 410 150" fill="none" stroke="#C77C02" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#tkAm)"/>
  <path d="M 630 190 C 630 172, 610 164, 600 150" fill="none" stroke="#C77C02" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#tkAm)"/>

  <!-- bottom: the sensor -->
  <g filter="url(#tkSketch)">
    <rect x="160" y="272" width="508" height="56" rx="8" fill="#343A40"/>
  </g>
  <text class="m" x="190" y="305" font-size="14" font-weight="700" fill="#FFFFFF">reflectance</text>
  <text class="t" x="300" y="305" font-size="12" fill="#DEE2E6">the sensor object, made once at the top of robot.py</text>
  <!-- little sensor board -->
  <rect x="604" y="284" width="48" height="30" rx="3" fill="#111" stroke="#6C757D"/>
  <circle cx="620" cy="299" r="5" fill="#FFD43B"/>
  <circle cx="636" cy="299" r="5" fill="#FFD43B"/>
</svg>
