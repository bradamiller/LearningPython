<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 252" width="680" height="252" role="img" aria-labelledby="fpT fpD" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="fpT">What the two is_ functions return in four positions</title>
  <desc id="fpD">Four close-ups of the front of the XRP, where the two line sensors sit under the rangefinder, with what each sensor function returns. Both sensors on white: is_either_on_line() False, is_at_cross() False. Left sensor on the tape: True, False. Right sensor on the tape: True, False. On the cross, where a second taped line runs under both sensors: True, True.</desc>
  <style>
    .h  { font-family: Montserrat, Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 700; fill: #22527B; }
    .fn { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12.5px; font-weight: 700; fill: #142D50; }
    .sm { font-family: Montserrat, Helvetica, Arial, sans-serif; font-size: 11.5px; fill: #6C757D; }
    .vt { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12.5px; font-weight: 700; fill: #2E7D32; }
    .vf { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12.5px; font-weight: 600; fill: #868E96; }
  </style>
  <defs>
    <clipPath id="fp0"><rect x="170" y="30" width="117" height="140" rx="6"/></clipPath>
    <clipPath id="fp1"><rect x="297" y="30" width="117" height="140" rx="6"/></clipPath>
    <clipPath id="fp2"><rect x="424" y="30" width="117" height="140" rx="6"/></clipPath>
    <clipPath id="fp3"><rect x="551" y="30" width="117" height="140" rx="6"/></clipPath>
    <marker id="pcArr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6C757D"/>
    </marker>
    <marker id="pcDim" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,1 L5,5 L0,9" fill="none" stroke="#142D50" stroke-width="1.6"/>
    </marker>

    <!-- The XRP from above, traced from SparkFun's top-view photo. Front is UP.
         Origin = center of rotation (the pen hole between the drive wheels).
         Units: 1 unit = 4 photo px; the sensors are 60 units (8.75 cm) ahead of the origin. -->
    <g id="pcXRP" stroke-linejoin="round">
      <!-- rails out to the front casters -->
      <rect x="-59" y="-80" width="8" height="40" fill="#C3C8CD" stroke="#5F666D" stroke-width="1.3"/>
      <rect x="51"  y="-80" width="8" height="40" fill="#C3C8CD" stroke="#5F666D" stroke-width="1.3"/>
      <!-- main chassis plate -->
      <rect x="-59" y="-46" width="118" height="75" rx="8" fill="#D3D7DB" fill-opacity="0.92" stroke="#5F666D" stroke-width="1.5"/>
      <rect x="-50" y="-38" width="100" height="58" rx="4" fill="#E9ECEF" fill-opacity="0.85" stroke="#9AA1A8" stroke-width="0.8"/>
      <!-- caster bosses at the front corners -->
      <circle cx="-49" cy="-79" r="10" fill="#C3C8CD" stroke="#5F666D" stroke-width="1.3"/>
      <circle cx="49"  cy="-79" r="10" fill="#C3C8CD" stroke="#5F666D" stroke-width="1.3"/>
      <circle cx="-49" cy="-79" r="4.5" fill="#F1EBDD" stroke="#8A7E62" stroke-width="0.8"/>
      <circle cx="49"  cy="-79" r="4.5" fill="#F1EBDD" stroke="#8A7E62" stroke-width="0.8"/>
      <!-- drive wheels -->
      <rect x="-56" y="-21" width="11" height="42" rx="3.5" fill="#2B2B2B"/>
      <rect x="45"  y="-21" width="11" height="42" rx="3.5" fill="#2B2B2B"/>
      <line x1="-50.5" y1="-17" x2="-50.5" y2="17" stroke="#6C757D" stroke-width="1"/>
      <line x1="50.5"  y1="-17" x2="50.5"  y2="17" stroke="#6C757D" stroke-width="1"/>
      <!-- battery latches -->
      <rect x="-40" y="-30" width="6" height="12" rx="2" fill="#F05A28"/>
      <rect x="34"  y="-30" width="6" height="12" rx="2" fill="#F05A28"/>
      <!-- controller board -->
      <rect x="-24" y="-42" width="48" height="37" rx="2" fill="#D1182C"/>
      <rect x="-6" y="-41" width="12" height="35" rx="1" fill="#2B2B2B"/>
      <!-- servo + arm at the back -->
      <rect x="-26" y="22" width="15" height="13" rx="1.5" fill="#2B2B2B"/>
      <rect x="-34" y="24" width="8" height="26" rx="2" fill="#AEB4BA" stroke="#5F666D" stroke-width="1"/>
      <!-- rangefinder bracket, board and the two cylinders -->
      <rect x="-16" y="-58" width="32" height="13" rx="2" fill="#AEB4BA" stroke="#5F666D" stroke-width="1"/>
      <rect x="-18" y="-65" width="36" height="8" rx="1.5" fill="#B5172A"/>
      <circle cx="-8" cy="-68" r="5.5" fill="#E4E7EA" stroke="#868E96" stroke-width="1"/>
      <circle cx="8"  cy="-68" r="5.5" fill="#E4E7EA" stroke="#868E96" stroke-width="1"/>
      <!-- the two line sensors, under the rangefinder (drawn as if seen through it) -->
      <circle cx="-6.5" cy="-60" r="4" fill="#FFD43B" stroke="#142D50" stroke-width="1.4"/>
      <circle cx="6.5"  cy="-60" r="4" fill="#FFD43B" stroke="#142D50" stroke-width="1.4"/>
      <!-- center of rotation: the pen hole -->
      <circle cx="0" cy="0" r="5" fill="#FFFFFF" stroke="#142D50" stroke-width="1.8"/>
      <circle cx="0" cy="0" r="1.8" fill="#142D50"/>
    </g>

    <!-- the same robot after a right turn, as a dashed ghost -->
    <g id="pcGhost" fill="none" stroke="#343A40" stroke-width="1.4" stroke-dasharray="4 3">
      <path d="M -51 -46 V -72 M 51 -46 V -72 M -59 -36 V -79 M 59 -36 V -79 M -59 -46 H 59"/>
      <circle cx="-49" cy="-79" r="10"/>
      <circle cx="49"  cy="-79" r="10"/>
      <rect x="-18" y="-65" width="36" height="8" rx="1.5"/>
      <circle cx="-6.5" cy="-60" r="4.5" fill="#FFFFFF" stroke="#D1182C" stroke-width="2.4" stroke-dasharray="none"/>
      <circle cx="6.5"  cy="-60" r="4.5" fill="#FFFFFF" stroke="#D1182C" stroke-width="2.4" stroke-dasharray="none"/>
    </g>
  </defs>
  <rect width="680" height="252" fill="#FFFFFF"/>
  <text class="h" x="228.5" y="20" text-anchor="middle">Both on white</text>
  <g clip-path="url(#fp0)"><rect x="170" y="30" width="117" height="140" fill="#F3F4F6"/>
  <rect x="182.5" y="30" width="16" height="140" fill="#2B2B2B"/>
  <use href="#pcXRP" transform="translate(228.5 155.0) scale(1.15)" opacity="0.8"/>
  </g>
  <rect x="170" y="30" width="117" height="140" rx="6" fill="none" stroke="#DEE2E6"/>
  <rect x="194.5" y="184" width="68" height="24" rx="12" fill="#F1F3F5" stroke="#ADB5BD" stroke-width="1.4"/>
  <text class="vf" x="228.5" y="200.5" text-anchor="middle">False</text>
  <rect x="194.5" y="218" width="68" height="24" rx="12" fill="#F1F3F5" stroke="#ADB5BD" stroke-width="1.4"/>
  <text class="vf" x="228.5" y="234.5" text-anchor="middle">False</text>
  <text class="h" x="355.5" y="20" text-anchor="middle">Left sensor on tape</text>
  <g clip-path="url(#fp1)"><rect x="297" y="30" width="117" height="140" fill="#F3F4F6"/>
  <rect x="340.0" y="30" width="16" height="140" fill="#2B2B2B"/>
  <use href="#pcXRP" transform="translate(355.5 155.0) scale(1.15)" opacity="0.8"/>
  <circle cx="348.025" cy="86" r="7.5" fill="none" stroke="#2E7D32" stroke-width="3"/>
  </g>
  <rect x="297" y="30" width="117" height="140" rx="6" fill="none" stroke="#DEE2E6"/>
  <rect x="321.5" y="184" width="68" height="24" rx="12" fill="#E1F0E3" stroke="#2E7D32" stroke-width="1.4"/>
  <text class="vt" x="355.5" y="200.5" text-anchor="middle">True</text>
  <rect x="321.5" y="218" width="68" height="24" rx="12" fill="#F1F3F5" stroke="#ADB5BD" stroke-width="1.4"/>
  <text class="vf" x="355.5" y="234.5" text-anchor="middle">False</text>
  <text class="h" x="482.5" y="20" text-anchor="middle">Right sensor on tape</text>
  <g clip-path="url(#fp2)"><rect x="424" y="30" width="117" height="140" fill="#F3F4F6"/>
  <rect x="482.0" y="30" width="16" height="140" fill="#2B2B2B"/>
  <use href="#pcXRP" transform="translate(482.5 155.0) scale(1.15)" opacity="0.8"/>
  <circle cx="489.975" cy="86" r="7.5" fill="none" stroke="#2E7D32" stroke-width="3"/>
  </g>
  <rect x="424" y="30" width="117" height="140" rx="6" fill="none" stroke="#DEE2E6"/>
  <rect x="448.5" y="184" width="68" height="24" rx="12" fill="#E1F0E3" stroke="#2E7D32" stroke-width="1.4"/>
  <text class="vt" x="482.5" y="200.5" text-anchor="middle">True</text>
  <rect x="448.5" y="218" width="68" height="24" rx="12" fill="#F1F3F5" stroke="#ADB5BD" stroke-width="1.4"/>
  <text class="vf" x="482.5" y="234.5" text-anchor="middle">False</text>
  <text class="h" x="609.5" y="20" text-anchor="middle">On the cross</text>
  <g clip-path="url(#fp3)"><rect x="551" y="30" width="117" height="140" fill="#F3F4F6"/>
  <rect x="594.0" y="30" width="16" height="140" fill="#2B2B2B"/>
  <rect x="551" y="78.0" width="117" height="16" fill="#2B2B2B"/>
  <use href="#pcXRP" transform="translate(609.5 155.0) scale(1.15)" opacity="0.8"/>
  <circle cx="602.025" cy="86" r="7.5" fill="none" stroke="#2E7D32" stroke-width="3"/>
  <circle cx="616.975" cy="86" r="7.5" fill="none" stroke="#2E7D32" stroke-width="3"/>
  </g>
  <rect x="551" y="30" width="117" height="140" rx="6" fill="none" stroke="#DEE2E6"/>
  <rect x="575.5" y="184" width="68" height="24" rx="12" fill="#E1F0E3" stroke="#2E7D32" stroke-width="1.4"/>
  <text class="vt" x="609.5" y="200.5" text-anchor="middle">True</text>
  <rect x="575.5" y="218" width="68" height="24" rx="12" fill="#E1F0E3" stroke="#2E7D32" stroke-width="1.4"/>
  <text class="vt" x="609.5" y="234.5" text-anchor="middle">True</text>
  <text class="fn" x="12" y="196">is_either_on_line()</text>
  <text class="sm" x="12" y="210">at least one dark (or)</text>
  <text class="fn" x="12" y="230">is_at_cross()</text>
  <text class="sm" x="12" y="244">both dark (and)</text>
  <text class="sm" x="12" y="70">green ring = sensor</text>
  <text class="sm" x="12" y="85">over black tape</text>
  <circle cx="140" cy="76" r="5.8" fill="#FFD43B" stroke="#2E7D32" stroke-width="2.4"/>
</svg>
