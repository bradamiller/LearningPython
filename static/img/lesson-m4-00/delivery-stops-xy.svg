<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 370" width="680" height="370" role="img" aria-labelledby="fT fD">
  <title id="fT">Module 4: visit five destinations in order</title>
  <desc id="fD">A 4 by 4 grid with (0, 0) at the bottom-left. The robot starts at home, (0, 0), facing north. Each leg goes across first, then up or down. Leg 1 goes to (2, 3), leg 2 to (1, 0), leg 3 to (3, 1), leg 4 to (2, 2), and leg 5 back home to (0, 0). For each destination the robot plans a path from where it is, drives it, and remembers where it ended up.</desc>
  <style>
    .h   { font-family: Montserrat, Helvetica, Arial, sans-serif; font-size: 14px; font-weight: 700; fill: #22527B; }
    .n   { font-family: Montserrat, Helvetica, Arial, sans-serif; font-size: 12.5px; fill: #343A40; }
    .nb  { font-family: Montserrat, Helvetica, Arial, sans-serif; font-size: 12.5px; font-weight: 700; fill: #142D50; }
    .sm  { font-family: Montserrat, Helvetica, Arial, sans-serif; font-size: 11.5px; fill: #6C757D; }
    .ax  { font-family: Montserrat, Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 700; fill: #6C757D; }
    .m   { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12.5px; font-weight: 700; fill: #142D50; }
    .ms  { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11.5px; font-weight: 600; fill: #343A40; }
  </style>
  <defs>
    <marker id="aB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#22527B"/></marker>
    <marker id="aW" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#FFFFFF"/></marker>
    <marker id="aG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6C757D"/></marker>
    <marker id="aR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D1182C"/></marker>
    <marker id="aGr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E7D32"/></marker>
    <marker id="pcArr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6C757D"/>
    </marker>
    <marker id="pcDim" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,1 L5,5 L0,9" fill="none" stroke="#142D50" stroke-width="1.6"/>
    </marker>

    <!-- The XRP from above, traced from SparkFun's top-view photo. Front is UP.
         Origin = center of rotation (the pen hole between the drive wheels).
         Units: 1 unit = 4 photo px; the sensors are 60 units (8.75 cm) ahead of the origin. -->
    <g id="pcXRP" stroke-linejoin="round">
      <!-- rails out to the front casters -->
      <rect x="-59" y="-80" width="8" height="40" fill="#C3C8CD" stroke="#5F666D" stroke-width="1.3"/>
      <rect x="51"  y="-80" width="8" height="40" fill="#C3C8CD" stroke="#5F666D" stroke-width="1.3"/>
      <!-- main chassis plate -->
      <rect x="-59" y="-46" width="118" height="75" rx="8" fill="#D3D7DB" fill-opacity="0.92" stroke="#5F666D" stroke-width="1.5"/>
      <rect x="-50" y="-38" width="100" height="58" rx="4" fill="#E9ECEF" fill-opacity="0.85" stroke="#9AA1A8" stroke-width="0.8"/>
      <!-- caster bosses at the front corners -->
      <circle cx="-49" cy="-79" r="10" fill="#C3C8CD" stroke="#5F666D" stroke-width="1.3"/>
      <circle cx="49"  cy="-79" r="10" fill="#C3C8CD" stroke="#5F666D" stroke-width="1.3"/>
      <circle cx="-49" cy="-79" r="4.5" fill="#F1EBDD" stroke="#8A7E62" stroke-width="0.8"/>
      <circle cx="49"  cy="-79" r="4.5" fill="#F1EBDD" stroke="#8A7E62" stroke-width="0.8"/>
      <!-- drive wheels -->
      <rect x="-56" y="-21" width="11" height="42" rx="3.5" fill="#2B2B2B"/>
      <rect x="45"  y="-21" width="11" height="42" rx="3.5" fill="#2B2B2B"/>
      <line x1="-50.5" y1="-17" x2="-50.5" y2="17" stroke="#6C757D" stroke-width="1"/>
      <line x1="50.5"  y1="-17" x2="50.5"  y2="17" stroke="#6C757D" stroke-width="1"/>
      <!-- battery latches -->
      <rect x="-40" y="-30" width="6" height="12" rx="2" fill="#F05A28"/>
      <rect x="34"  y="-30" width="6" height="12" rx="2" fill="#F05A28"/>
      <!-- controller board -->
      <rect x="-24" y="-42" width="48" height="37" rx="2" fill="#D1182C"/>
      <rect x="-6" y="-41" width="12" height="35" rx="1" fill="#2B2B2B"/>
      <!-- servo + arm at the back -->
      <rect x="-26" y="22" width="15" height="13" rx="1.5" fill="#2B2B2B"/>
      <rect x="-34" y="24" width="8" height="26" rx="2" fill="#AEB4BA" stroke="#5F666D" stroke-width="1"/>
      <!-- rangefinder bracket, board and the two cylinders -->
      <rect x="-16" y="-58" width="32" height="13" rx="2" fill="#AEB4BA" stroke="#5F666D" stroke-width="1"/>
      <rect x="-18" y="-65" width="36" height="8" rx="1.5" fill="#B5172A"/>
      <circle cx="-8" cy="-68" r="5.5" fill="#E4E7EA" stroke="#868E96" stroke-width="1"/>
      <circle cx="8"  cy="-68" r="5.5" fill="#E4E7EA" stroke="#868E96" stroke-width="1"/>
      <!-- the two line sensors, under the rangefinder (drawn as if seen through it) -->
      <circle cx="-6.5" cy="-60" r="4" fill="#FFD43B" stroke="#142D50" stroke-width="1.4"/>
      <circle cx="6.5"  cy="-60" r="4" fill="#FFD43B" stroke="#142D50" stroke-width="1.4"/>
      <!-- center of rotation: the pen hole -->
      <circle cx="0" cy="0" r="5" fill="#FFFFFF" stroke="#142D50" stroke-width="1.8"/>
      <circle cx="0" cy="0" r="1.8" fill="#142D50"/>
    </g>

    <!-- the same robot after a right turn, as a dashed ghost -->
    <g id="pcGhost" fill="none" stroke="#343A40" stroke-width="1.4" stroke-dasharray="4 3">
      <path d="M -51 -46 V -72 M 51 -46 V -72 M -59 -36 V -79 M 59 -36 V -79 M -59 -46 H 59"/>
      <circle cx="-49" cy="-79" r="10"/>
      <circle cx="49"  cy="-79" r="10"/>
      <rect x="-18" y="-65" width="36" height="8" rx="1.5"/>
      <circle cx="-6.5" cy="-60" r="4.5" fill="#FFFFFF" stroke="#D1182C" stroke-width="2.4" stroke-dasharray="none"/>
      <circle cx="6.5"  cy="-60" r="4.5" fill="#FFFFFF" stroke="#D1182C" stroke-width="2.4" stroke-dasharray="none"/>
    </g>
  </defs>
  <rect width="680" height="370" fill="#FFFFFF"/>
  <rect x="80" y="66" width="270" height="270" rx="8" fill="#F3F4F6" stroke="#DEE2E6"/>
  <rect x="105.5" y="66" width="9" height="270" fill="#2B2B2B"/>
  <rect x="80" y="91.5" width="270" height="9" fill="#2B2B2B"/>
  <rect x="175.5" y="66" width="9" height="270" fill="#2B2B2B"/>
  <rect x="80" y="161.5" width="270" height="9" fill="#2B2B2B"/>
  <rect x="245.5" y="66" width="9" height="270" fill="#2B2B2B"/>
  <rect x="80" y="231.5" width="270" height="9" fill="#2B2B2B"/>
  <rect x="315.5" y="66" width="9" height="270" fill="#2B2B2B"/>
  <rect x="80" y="301.5" width="270" height="9" fill="#2B2B2B"/>
  <text class="ax" x="110" y="352" text-anchor="middle">0</text>
  <text class="ax" x="70" y="310" text-anchor="end">0</text>
  <text class="ax" x="180" y="352" text-anchor="middle">1</text>
  <text class="ax" x="70" y="240" text-anchor="end">1</text>
  <text class="ax" x="250" y="352" text-anchor="middle">2</text>
  <text class="ax" x="70" y="170" text-anchor="end">2</text>
  <text class="ax" x="320" y="352" text-anchor="middle">3</text>
  <text class="ax" x="70" y="100" text-anchor="end">3</text>
  <text class="ax" x="215.0" y="368" text-anchor="middle" style="fill:#22527B">x →</text>
  <text class="ax" x="56" y="201.0" text-anchor="middle" transform="rotate(-90 56 201.0)" style="fill:#22527B">y →</text>
  <line x1="372" y1="100" x2="372" y2="74" stroke="#495057" stroke-width="2" marker-end="url(#aG)"/>
  <text class="ax" x="372" y="114" text-anchor="middle">N</text>
  <path d="M 102 298 L 242 298 L 242 88" fill="none" stroke="#4C8BF5" stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round" opacity="0.9"/>
  <path d="M 246 92 L 176 92 L 176 302" fill="none" stroke="#2E7D32" stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round" opacity="0.9"/>
  <path d="M 180 306 L 320 306 L 320 236" fill="none" stroke="#C77C02" stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round" opacity="0.9"/>
  <path d="M 324 240 L 254 240 L 254 170" fill="none" stroke="#8E44AD" stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round" opacity="0.9"/>
  <path d="M 258 174 L 118 174 L 118 314" fill="none" stroke="#D1182C" stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round" opacity="0.9"/>
  <use href="#pcXRP" transform="translate(110 306) rotate(0) scale(0.36)"/>
  <circle cx="250" cy="96" r="12" fill="#4C8BF5" stroke="#FFFFFF" stroke-width="2"/><text class="nb" x="250" y="100.5" text-anchor="middle" style="fill:#FFFFFF">1</text>
  <circle cx="180" cy="306" r="12" fill="#2E7D32" stroke="#FFFFFF" stroke-width="2"/><text class="nb" x="180" y="310.5" text-anchor="middle" style="fill:#FFFFFF">2</text>
  <circle cx="320" cy="236" r="12" fill="#C77C02" stroke="#FFFFFF" stroke-width="2"/><text class="nb" x="320" y="240.5" text-anchor="middle" style="fill:#FFFFFF">3</text>
  <circle cx="250" cy="166" r="12" fill="#8E44AD" stroke="#FFFFFF" stroke-width="2"/><text class="nb" x="250" y="170.5" text-anchor="middle" style="fill:#FFFFFF">4</text>
  <circle cx="134" cy="282" r="12" fill="#D1182C" stroke="#FFFFFF" stroke-width="2"/><text class="nb" x="134" y="286.5" text-anchor="middle" style="fill:#FFFFFF">5</text>
  <text class="h" x="400" y="60">Where Module 4 is headed</text>
  <text class="nb" x="400" y="88">Five deliveries, in order:</text>
  <rect x="400" y="112" width="16" height="16" rx="4" fill="#4C8BF5"/>
  <text class="n" x="424" y="125">leg 1: (0, 0) → (2, 3)</text>
  <rect x="400" y="138" width="16" height="16" rx="4" fill="#2E7D32"/>
  <text class="n" x="424" y="151">leg 2: (2, 3) → (1, 0)</text>
  <rect x="400" y="164" width="16" height="16" rx="4" fill="#C77C02"/>
  <text class="n" x="424" y="177">leg 3: (1, 0) → (3, 1)</text>
  <rect x="400" y="190" width="16" height="16" rx="4" fill="#8E44AD"/>
  <text class="n" x="424" y="203">leg 4: (3, 1) → (2, 2)</text>
  <rect x="400" y="216" width="16" height="16" rx="4" fill="#D1182C"/>
  <text class="n" x="424" y="229">leg 5: (2, 2) → (0, 0)</text>
  <text class="nb" x="400" y="264">Start: home, (0, 0), facing North.</text>
  <text class="n" x="400" y="290">For each destination the robot plans</text>
  <text class="n" x="400" y="307">a path from where it is, drives it,</text>
  <text class="n" x="400" y="324">and remembers where it ended up.</text>
</svg>
