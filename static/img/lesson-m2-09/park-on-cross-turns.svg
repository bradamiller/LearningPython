<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 382" width="680" height="382" role="img" aria-labelledby="pcTitle pcDesc" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="pcTitle">Turning at an intersection: in the wrong place and the right place</title>
  <desc id="pcDesc">An animation of two XRP robots seen from above, each stopped by track_to_intersection()
    with its line sensors (under the rangefinder at the front) on a taped cross and its center of rotation
    8.75 cm behind them. Left: the robot turns right straight away; it swings about a point short of the
    intersection and its sensors end up beside the cross street, off the tape. Right: the robot first
    drives forward 8.75 cm with drive_past_intersection(), putting its center of rotation on the cross,
    then turns right; its sensors land on the cross street. The animation repeats.</desc>
  <style>
    .t  { font-family: Montserrat, Helvetica, Arial, sans-serif; font-size: 14px; font-weight: 700; fill: #22527B; }
    .sub{ font-family: Montserrat, Helvetica, Arial, sans-serif; font-size: 12px; fill: #495057; }
    .l  { font-family: Montserrat, Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 600; fill: #343A40; }
    .dim{ font-family: Montserrat, Helvetica, Arial, sans-serif; font-size: 12.5px; font-weight: 700; fill: #142D50; }
    .bad{ font-family: Montserrat, Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 700; fill: #D1182C; }
    .ok { font-family: Montserrat, Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 700; fill: #2E7D32; }
      .still { display: none; }
    @media (prefers-reduced-motion: reduce) { .anim { display: none; } .still { display: inline; } }
  </style>
  <defs>
    <marker id="pcArr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6C757D"/>
    </marker>
    <marker id="pcDim" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,1 L5,5 L0,9" fill="none" stroke="#142D50" stroke-width="1.6"/>
    </marker>

    <!-- The XRP from above, traced from SparkFun's top-view photo. Front is UP.
         Origin = center of rotation (the pen hole between the drive wheels).
         Units: 1 unit = 4 photo px; the sensors are 60 units (8.75 cm) ahead of the origin. -->
    <g id="pcXRP" stroke-linejoin="round">
      <!-- rails out to the front casters -->
      <rect x="-59" y="-80" width="8" height="40" fill="#C3C8CD" stroke="#5F666D" stroke-width="1.3"/>
      <rect x="51"  y="-80" width="8" height="40" fill="#C3C8CD" stroke="#5F666D" stroke-width="1.3"/>
      <!-- main chassis plate -->
      <rect x="-59" y="-46" width="118" height="75" rx="8" fill="#D3D7DB" fill-opacity="0.92" stroke="#5F666D" stroke-width="1.5"/>
      <rect x="-50" y="-38" width="100" height="58" rx="4" fill="#E9ECEF" fill-opacity="0.85" stroke="#9AA1A8" stroke-width="0.8"/>
      <!-- caster bosses at the front corners -->
      <circle cx="-49" cy="-79" r="10" fill="#C3C8CD" stroke="#5F666D" stroke-width="1.3"/>
      <circle cx="49"  cy="-79" r="10" fill="#C3C8CD" stroke="#5F666D" stroke-width="1.3"/>
      <circle cx="-49" cy="-79" r="4.5" fill="#F1EBDD" stroke="#8A7E62" stroke-width="0.8"/>
      <circle cx="49"  cy="-79" r="4.5" fill="#F1EBDD" stroke="#8A7E62" stroke-width="0.8"/>
      <!-- drive wheels -->
      <rect x="-56" y="-21" width="11" height="42" rx="3.5" fill="#2B2B2B"/>
      <rect x="45"  y="-21" width="11" height="42" rx="3.5" fill="#2B2B2B"/>
      <line x1="-50.5" y1="-17" x2="-50.5" y2="17" stroke="#6C757D" stroke-width="1"/>
      <line x1="50.5"  y1="-17" x2="50.5"  y2="17" stroke="#6C757D" stroke-width="1"/>
      <!-- battery latches -->
      <rect x="-40" y="-30" width="6" height="12" rx="2" fill="#F05A28"/>
      <rect x="34"  y="-30" width="6" height="12" rx="2" fill="#F05A28"/>
      <!-- controller board -->
      <rect x="-24" y="-42" width="48" height="37" rx="2" fill="#D1182C"/>
      <rect x="-6" y="-41" width="12" height="35" rx="1" fill="#2B2B2B"/>
      <!-- servo + arm at the back -->
      <rect x="-26" y="22" width="15" height="13" rx="1.5" fill="#2B2B2B"/>
      <rect x="-34" y="24" width="8" height="26" rx="2" fill="#AEB4BA" stroke="#5F666D" stroke-width="1"/>
      <!-- rangefinder bracket, board and the two cylinders -->
      <rect x="-16" y="-58" width="32" height="13" rx="2" fill="#AEB4BA" stroke="#5F666D" stroke-width="1"/>
      <rect x="-18" y="-65" width="36" height="8" rx="1.5" fill="#B5172A"/>
      <circle cx="-8" cy="-68" r="5.5" fill="#E4E7EA" stroke="#868E96" stroke-width="1"/>
      <circle cx="8"  cy="-68" r="5.5" fill="#E4E7EA" stroke="#868E96" stroke-width="1"/>
      <!-- the two line sensors, under the rangefinder (drawn as if seen through it) -->
      <circle cx="-6.5" cy="-60" r="4" fill="#FFD43B" stroke="#142D50" stroke-width="1.4"/>
      <circle cx="6.5"  cy="-60" r="4" fill="#FFD43B" stroke="#142D50" stroke-width="1.4"/>
      <!-- center of rotation: the pen hole -->
      <circle cx="0" cy="0" r="5" fill="#FFFFFF" stroke="#142D50" stroke-width="1.8"/>
      <circle cx="0" cy="0" r="1.8" fill="#142D50"/>
    </g>

    <!-- the same robot after a right turn, as a dashed ghost -->
    <g id="pcGhost" fill="none" stroke="#343A40" stroke-width="1.4" stroke-dasharray="4 3">
      <path d="M -51 -46 V -72 M 51 -46 V -72 M -59 -36 V -79 M 59 -36 V -79 M -59 -46 H 59"/>
      <circle cx="-49" cy="-79" r="10"/>
      <circle cx="49"  cy="-79" r="10"/>
      <rect x="-18" y="-65" width="36" height="8" rx="1.5"/>
      <circle cx="-6.5" cy="-60" r="4.5" fill="#FFFFFF" stroke="#D1182C" stroke-width="2.4" stroke-dasharray="none"/>
      <circle cx="6.5"  cy="-60" r="4.5" fill="#FFFFFF" stroke="#D1182C" stroke-width="2.4" stroke-dasharray="none"/>
    </g>
  </defs>

  <clipPath id="pcClipL"><rect x="20" y="46" width="310" height="284"/></clipPath>
  <clipPath id="pcClipR"><rect x="350" y="46" width="310" height="284"/></clipPath>
  <rect width="680" height="382" fill="#FFFFFF"/>

  <text class="t" x="20" y="20">Turn where the track stops</text>
  <text class="sub" x="20" y="37">center of rotation 8.75 cm short of the cross</text>
  <text class="t" x="350" y="20">Drive 8.75 cm first, then turn</text>
  <text class="sub" x="350" y="37">drive_past_intersection() puts it on the cross</text>

  <rect x="20" y="46" width="310" height="284" fill="#F3F4F6" stroke="#E9ECEF"/>
  <rect x="166" y="46" width="18" height="284" fill="#2B2B2B"/>
  <rect x="20" y="156" width="310" height="18" fill="#2B2B2B"/>
  <rect x="350" y="46" width="310" height="284" fill="#F3F4F6" stroke="#E9ECEF"/>
  <rect x="496" y="46" width="18" height="284" fill="#2B2B2B"/>
  <rect x="350" y="156" width="310" height="18" fill="#2B2B2B"/>

  <!-- labels shared by both versions -->
  <line x1="70" y1="167" x2="70" y2="241" stroke="#142D50" stroke-width="1.6" marker-start="url(#pcDim)" marker-end="url(#pcDim)"/>
  <line x1="62" y1="165" x2="86" y2="165" stroke="#FFFFFF" stroke-width="2"/>
  <line x1="62" y1="243" x2="86" y2="243" stroke="#142D50" stroke-width="1.4"/>
  <text class="dim" x="62" y="208" text-anchor="end">8.75</text>
  <text class="dim" x="62" y="223" text-anchor="end">cm</text>
  <text class="l" x="28" y="298">center of</text>
  <text class="l" x="28" y="313">rotation</text>
  <line x1="88" y1="300" x2="169" y2="247" stroke="#142D50" stroke-width="1.2"/>

  <!-- ===================== ANIMATED ===================== -->
  <g class="anim">
    <!-- left: turn in place -->
    <path d="M 175 165 A 78 78 0 0 1 253 243" pathLength="100" fill="none" stroke="#D1182C" stroke-width="3" stroke-linecap="round" stroke-dasharray="100" opacity="0.8">
      <animate attributeName="stroke-dashoffset" values="100;100;0;0;100;100" keyTimes="0;.05;.22;.88;.92;1" dur="12s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;1;0;0;1;1" keyTimes="0;.84;.88;.92;.96;1" dur="12s" repeatCount="indefinite"/>
    </path>
    <g clip-path="url(#pcClipL)"><g transform="translate(175 243)">
      <animate attributeName="opacity" values="1;1;0;0;1;1" keyTimes="0;.84;.88;.92;.96;1" dur="12s" repeatCount="indefinite"/>
      <g><animateTransform attributeName="transform" type="rotate" values="0;0;90;90;0;0" keyTimes="0;.05;.22;.88;.92;1" dur="12s" repeatCount="indefinite"/><use href="#pcXRP" transform="scale(1.3)"/></g>
    </g></g>

    <!-- right: drive past, then turn -->
    <circle cx="390" cy="243" r="5" fill="none" stroke="#142D50" stroke-width="1.6"/>
    <line x1="390" y1="237" x2="390" y2="180" stroke="#142D50" stroke-width="1.6" marker-end="url(#pcDim)"/>
    <text class="dim" x="390" y="268" text-anchor="middle">drive</text>
    <text class="dim" x="390" y="284" text-anchor="middle">8.75 cm</text>
    <path d="M 505 87 A 78 78 0 0 1 583 165" pathLength="100" fill="none" stroke="#2E7D32" stroke-width="3" stroke-linecap="round" stroke-dasharray="100" opacity="0.8">
      <animate attributeName="stroke-dashoffset" values="100;100;0;0;100;100" keyTimes="0;.46;.63;.88;.92;1" dur="12s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;1;0;0;1;1" keyTimes="0;.84;.88;.92;.96;1" dur="12s" repeatCount="indefinite"/>
    </path>
    <g clip-path="url(#pcClipR)"><g transform="translate(505 243)">
      <animate attributeName="opacity" values="1;1;0;0;1;1" keyTimes="0;.84;.88;.92;.96;1" dur="12s" repeatCount="indefinite"/>
      <g>
        <animateTransform attributeName="transform" type="translate" values="0 0;0 0;0 -78;0 -78;0 0;0 0" keyTimes="0;.32;.42;.88;.92;1" dur="12s" repeatCount="indefinite"/>
        <g><animateTransform attributeName="transform" type="rotate" values="0;0;90;90;0;0" keyTimes="0;.46;.63;.88;.92;1" dur="12s" repeatCount="indefinite"/><use href="#pcXRP" transform="scale(1.3)"/></g>
      </g>
    </g></g>

    <g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.23;.27;.84;.88;1" dur="12s" repeatCount="indefinite"/>
      <text class="bad" x="175" y="352" text-anchor="middle">The sensors land beside</text>
      <text class="bad" x="175" y="370" text-anchor="middle">the new line ✗</text>
    </g>
    <g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.64;.68;.84;.88;1" dur="12s" repeatCount="indefinite"/>
      <text class="ok" x="505" y="352" text-anchor="middle">The robot spins on the cross;</text>
      <text class="ok" x="505" y="370" text-anchor="middle">the sensors land on the line ✓</text>
    </g>
  </g>

  <!-- ===================== STILL (reduced motion) ===================== -->
  <g class="still">
    <use href="#pcXRP" transform="translate(175 243) scale(1.3)" opacity="0.8"/>
    <use href="#pcGhost" transform="translate(175 243) rotate(90) scale(1.3)"/>
    <path d="M 175 165 A 78 78 0 0 1 249 219" fill="none" stroke="#6C757D" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#pcArr)"/>
    <use href="#pcXRP" transform="translate(505 165) scale(1.3)" opacity="0.8"/>
    <use href="#pcGhost" transform="translate(505 165) rotate(90) scale(1.3)"/>
    <path d="M 505 87 A 78 78 0 0 1 579 141" fill="none" stroke="#6C757D" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#pcArr)"/>
    <circle cx="390" cy="243" r="5" fill="none" stroke="#142D50" stroke-width="1.6"/>
    <line x1="390" y1="237" x2="390" y2="180" stroke="#142D50" stroke-width="1.6" marker-end="url(#pcDim)"/>
    <text class="dim" x="390" y="268" text-anchor="middle">moved</text>
    <text class="dim" x="390" y="284" text-anchor="middle">8.75 cm</text>
    <text class="bad" x="175" y="352" text-anchor="middle">The sensors land beside</text>
    <text class="bad" x="175" y="370" text-anchor="middle">the new line ✗</text>
    <text class="ok" x="505" y="352" text-anchor="middle">The robot spins on the cross;</text>
    <text class="ok" x="505" y="370" text-anchor="middle">the sensors land on the line ✓</text>
  </g>
</svg>
