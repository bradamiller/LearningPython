<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 590" width="680" height="590" role="img" aria-labelledby="ttTitle ttDesc" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="ttTitle">A sensor-ended turn in four steps</title>
  <desc id="ttDesc">Four top-down drawings of the XRP parked on an intersection, turning right onto the cross street.
    1, blind turn of about 60 degrees: both line sensors are now off the line it was following. 2, keep spinning in
    place: the motors stay on while the program goes on. 3, wait until a sensor sees the line: the leading sensor reaches
    the cross street and is_either_on_line() becomes True. 4, stop, facing the new line, ready to follow it. Below, two mistakes: a
    blind turn that is too small (10 degrees) leaves a sensor on the old line, so the wait ends at once; one that is too
    big (120 degrees) swings the sensors past the cross street, so the robot keeps spinning.</desc>
  <style>
    .h    { font-family: Montserrat, Helvetica, Arial, sans-serif; font-size: 14px; font-weight: 700; fill: #22527B; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; font-weight: 600; fill: #142D50; }
    .note { font-family: Montserrat, Helvetica, Arial, sans-serif; font-size: 12.5px; fill: #495057; }
    .bad  { font-family: Montserrat, Helvetica, Arial, sans-serif; font-size: 12.5px; font-weight: 600; fill: #D1182C; }
    .nx   { font-family: Montserrat, Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 700; fill: #2E7D32; }
  </style>
  <defs>
    <marker id="ttArr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#495057"/></marker>
    <marker id="ttArrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#22527B"/></marker>
    <marker id="ttArrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E7D32"/></marker>
    <clipPath id="tt0"><rect x="12" y="40" width="325" height="130" rx="6"/></clipPath>
    <clipPath id="tt1"><rect x="343" y="40" width="325" height="130" rx="6"/></clipPath>
    <clipPath id="tt2"><rect x="12" y="234" width="325" height="130" rx="6"/></clipPath>
    <clipPath id="tt3"><rect x="343" y="234" width="325" height="130" rx="6"/></clipPath>
    <clipPath id="ttf0"><rect x="12" y="418" width="325" height="130" rx="6"/></clipPath>
    <clipPath id="ttf1"><rect x="343" y="418" width="325" height="130" rx="6"/></clipPath>
    <marker id="pcArr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6C757D"/>
    </marker>
    <marker id="pcDim" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,1 L5,5 L0,9" fill="none" stroke="#142D50" stroke-width="1.6"/>
    </marker>

    <!-- The XRP from above, traced from SparkFun's top-view photo. Front is UP.
         Origin = center of rotation (the pen hole between the drive wheels).
         Units: 1 unit = 4 photo px; the sensors are 60 units (8.75 cm) ahead of the origin. -->
    <g id="pcXRP" stroke-linejoin="round">
      <!-- rails out to the front casters -->
      <rect x="-59" y="-80" width="8" height="40" fill="#C3C8CD" stroke="#5F666D" stroke-width="1.3"/>
      <rect x="51"  y="-80" width="8" height="40" fill="#C3C8CD" stroke="#5F666D" stroke-width="1.3"/>
      <!-- main chassis plate -->
      <rect x="-59" y="-46" width="118" height="75" rx="8" fill="#D3D7DB" fill-opacity="0.92" stroke="#5F666D" stroke-width="1.5"/>
      <rect x="-50" y="-38" width="100" height="58" rx="4" fill="#E9ECEF" fill-opacity="0.85" stroke="#9AA1A8" stroke-width="0.8"/>
      <!-- caster bosses at the front corners -->
      <circle cx="-49" cy="-79" r="10" fill="#C3C8CD" stroke="#5F666D" stroke-width="1.3"/>
      <circle cx="49"  cy="-79" r="10" fill="#C3C8CD" stroke="#5F666D" stroke-width="1.3"/>
      <circle cx="-49" cy="-79" r="4.5" fill="#F1EBDD" stroke="#8A7E62" stroke-width="0.8"/>
      <circle cx="49"  cy="-79" r="4.5" fill="#F1EBDD" stroke="#8A7E62" stroke-width="0.8"/>
      <!-- drive wheels -->
      <rect x="-56" y="-21" width="11" height="42" rx="3.5" fill="#2B2B2B"/>
      <rect x="45"  y="-21" width="11" height="42" rx="3.5" fill="#2B2B2B"/>
      <line x1="-50.5" y1="-17" x2="-50.5" y2="17" stroke="#6C757D" stroke-width="1"/>
      <line x1="50.5"  y1="-17" x2="50.5"  y2="17" stroke="#6C757D" stroke-width="1"/>
      <!-- battery latches -->
      <rect x="-40" y="-30" width="6" height="12" rx="2" fill="#F05A28"/>
      <rect x="34"  y="-30" width="6" height="12" rx="2" fill="#F05A28"/>
      <!-- controller board -->
      <rect x="-24" y="-42" width="48" height="37" rx="2" fill="#D1182C"/>
      <rect x="-6" y="-41" width="12" height="35" rx="1" fill="#2B2B2B"/>
      <!-- servo + arm at the back -->
      <rect x="-26" y="22" width="15" height="13" rx="1.5" fill="#2B2B2B"/>
      <rect x="-34" y="24" width="8" height="26" rx="2" fill="#AEB4BA" stroke="#5F666D" stroke-width="1"/>
      <!-- rangefinder bracket, board and the two cylinders -->
      <rect x="-16" y="-58" width="32" height="13" rx="2" fill="#AEB4BA" stroke="#5F666D" stroke-width="1"/>
      <rect x="-18" y="-65" width="36" height="8" rx="1.5" fill="#B5172A"/>
      <circle cx="-8" cy="-68" r="5.5" fill="#E4E7EA" stroke="#868E96" stroke-width="1"/>
      <circle cx="8"  cy="-68" r="5.5" fill="#E4E7EA" stroke="#868E96" stroke-width="1"/>
      <!-- the two line sensors, under the rangefinder (drawn as if seen through it) -->
      <circle cx="-6.5" cy="-60" r="4" fill="#FFD43B" stroke="#142D50" stroke-width="1.4"/>
      <circle cx="6.5"  cy="-60" r="4" fill="#FFD43B" stroke="#142D50" stroke-width="1.4"/>
      <!-- center of rotation: the pen hole -->
      <circle cx="0" cy="0" r="5" fill="#FFFFFF" stroke="#142D50" stroke-width="1.8"/>
      <circle cx="0" cy="0" r="1.8" fill="#142D50"/>
    </g>

    <!-- the same robot after a right turn, as a dashed ghost -->
    <g id="pcGhost" fill="none" stroke="#343A40" stroke-width="1.4" stroke-dasharray="4 3">
      <path d="M -51 -46 V -72 M 51 -46 V -72 M -59 -36 V -79 M 59 -36 V -79 M -59 -46 H 59"/>
      <circle cx="-49" cy="-79" r="10"/>
      <circle cx="49"  cy="-79" r="10"/>
      <rect x="-18" y="-65" width="36" height="8" rx="1.5"/>
      <circle cx="-6.5" cy="-60" r="4.5" fill="#FFFFFF" stroke="#D1182C" stroke-width="2.4" stroke-dasharray="none"/>
      <circle cx="6.5"  cy="-60" r="4.5" fill="#FFFFFF" stroke="#D1182C" stroke-width="2.4" stroke-dasharray="none"/>
    </g>
  </defs>
  <rect width="680" height="590" fill="#FFFFFF"/>
    <text class="h" x="12" y="15">1 · Blind turn</text>
  <text class="code" x="12" y="32"># 1. blind turn, about 60 deg</text>
  <g clip-path="url(#tt0)">
    <rect x="12" y="40" width="325" height="130" fill="#F3F4F6"/>
    <rect x="128.5" y="40" width="12" height="130" fill="#2B2B2B"/>
    <rect x="12" y="99.0" width="325" height="12" fill="#2B2B2B"/>
    <use href="#pcGhost" transform="translate(134.5 105.0) rotate(0) scale(0.6)"/>
    <use href="#pcXRP" transform="translate(134.5 105.0) rotate(60) scale(0.6)" opacity="0.9"/>
    <path d="M 140.4 37.3 A 68 68 0 0 1 191.5 68.0" fill="none" stroke="#495057" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#ttArr)"/>
    </g>
    <rect x="12" y="40" width="325" height="130" rx="6" fill="none" stroke="#DEE2E6"/>
  <text class="note" x="12" y="187">both sensors are now off the old line</text>
  <text class="h" x="343" y="15">2 · Keep spinning</text>
  <text class="code" x="343" y="32"># 2. keep spinning in place</text>
  <g clip-path="url(#tt1)">
    <rect x="343" y="40" width="325" height="130" fill="#F3F4F6"/>
    <rect x="459.5" y="40" width="12" height="130" fill="#2B2B2B"/>
    <rect x="343" y="99.0" width="325" height="12" fill="#2B2B2B"/>
    <use href="#pcXRP" transform="translate(465.5 105.0) rotate(70) scale(0.6)" opacity="0.9"/>
    <g transform="translate(465.5 105.0)" fill="none" stroke="#22527B" stroke-width="2.2" marker-end="url(#ttArrB)"><path d="M 50 -42 A 66 66 0 0 1 66 -6"/><path d="M -50 42 A 66 66 0 0 1 -66 6"/></g>
    </g>
    <rect x="343" y="40" width="325" height="130" rx="6" fill="none" stroke="#DEE2E6"/>
  <text class="note" x="343" y="187">motors stay on while the program goes on</text>
  <text class="h" x="12" y="209">3 · Wait for a sensor</text>
  <text class="code" x="12" y="226"># 3. wait until a sensor sees the line</text>
  <g clip-path="url(#tt2)">
    <rect x="12" y="234" width="325" height="130" fill="#F3F4F6"/>
    <rect x="128.5" y="234" width="12" height="130" fill="#2B2B2B"/>
    <rect x="12" y="293.0" width="325" height="12" fill="#2B2B2B"/>
    <use href="#pcXRP" transform="translate(134.5 299.0) rotate(82) scale(0.6)" opacity="0.9"/>
    <circle cx="170.7" cy="297.9" r="6" fill="none" stroke="#2E7D32" stroke-width="2.6"/>
    </g>
    <rect x="12" y="234" width="325" height="130" rx="6" fill="none" stroke="#DEE2E6"/>
  <text class="note" x="12" y="381">is_either_on_line() becomes True</text>
  <text class="h" x="343" y="209">4 · Stop</text>
  <text class="code" x="343" y="226"># 4. stop</text>
  <g clip-path="url(#tt3)">
    <rect x="343" y="234" width="325" height="130" fill="#F3F4F6"/>
    <rect x="459.5" y="234" width="12" height="130" fill="#2B2B2B"/>
    <rect x="343" y="293.0" width="325" height="12" fill="#2B2B2B"/>
    <use href="#pcXRP" transform="translate(465.5 299.0) rotate(82) scale(0.6)" opacity="0.9"/>
    <circle cx="501.7" cy="297.9" r="6" fill="none" stroke="#2E7D32" stroke-width="2.6"/>
    <line x1="531.5" y1="299.0" x2="615.5" y2="299.0" stroke="#2E7D32" stroke-width="3" stroke-dasharray="7 5" marker-end="url(#ttArrG)"/>
    <text class="nx" x="573.5" y="285.0" text-anchor="middle">next: track</text>
    </g>
    <rect x="343" y="234" width="325" height="130" rx="6" fill="none" stroke="#DEE2E6"/>
  <text class="note" x="343" y="381">facing the new line, ready to follow it</text>
  <text class="h" x="12" y="409" style="fill:#D1182C">If the blind turn is the wrong size</text>
  <g clip-path="url(#ttf0)">
    <rect x="12" y="418" width="325" height="130" fill="#F3F4F6"/>
    <rect x="128.5" y="418" width="12" height="130" fill="#2B2B2B"/>
    <rect x="12" y="477.0" width="325" height="12" fill="#2B2B2B"/>
    <use href="#pcGhost" transform="translate(134.5 483.0) rotate(0) scale(0.6)"/>
    <use href="#pcXRP" transform="translate(134.5 483.0) rotate(10) scale(0.6)" opacity="0.9"/>
    <circle cx="136.9" cy="446.9" r="6" fill="none" stroke="#D1182C" stroke-width="2.6"/>
    <path d="M 140.4 415.3 A 68 68 0 0 1 142.8 415.5" fill="none" stroke="#495057" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#ttArr)"/>
    </g>
    <rect x="12" y="418" width="325" height="130" rx="6" fill="none" stroke="#DEE2E6"/>
  <g clip-path="url(#ttf1)">
    <rect x="343" y="418" width="325" height="130" fill="#F3F4F6"/>
    <rect x="459.5" y="418" width="12" height="130" fill="#2B2B2B"/>
    <rect x="343" y="477.0" width="325" height="12" fill="#2B2B2B"/>
    <use href="#pcGhost" transform="translate(465.5 483.0) rotate(0) scale(0.6)"/>
    <use href="#pcXRP" transform="translate(465.5 483.0) rotate(120) scale(0.6)" opacity="0.9"/>
    <path d="M 471.4 415.3 A 68 68 0 0 1 526.1 513.9" fill="none" stroke="#495057" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#ttArr)"/>
    </g>
    <rect x="343" y="418" width="325" height="130" rx="6" fill="none" stroke="#DEE2E6"/>
  <text class="bad" x="12" y="565">Too small (10°): a sensor is still on the</text>
  <text class="bad" x="12" y="581">old line, so the wait ends at once.</text>
  <text class="bad" x="343" y="565">Too big (120°): the sensors already swung</text>
  <text class="bad" x="343" y="581">past the cross street; it keeps spinning.</text>
</svg>
