<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 410" width="680" height="410" role="img" aria-labelledby="fT fD" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="fT">Reading the intersection ahead</title>
  <desc id="fD">Left: the XRP parked on intersection (1, 0), its position, turned to face south toward (2, 0), next_pos, where a box sits; sound waves go from the rangefinder toward the box. After turn_to(), the robot faces next_pos, so a reading under OBSTACLE_CM means next_pos is blocked. Right: a distance scale from 0 to 60 cm with a dashed cutoff at OBSTACLE_CM = 15: below it is blocked, above it clear. A box on the next intersection reads about 12 cm; nothing there reads about 50 cm. Measure yours and set the cutoff between them.</desc>
  <style>
    .h   { font-family: Montserrat, Helvetica, Arial, sans-serif; font-size: 14px; font-weight: 700; fill: #22527B; }
    .n   { font-family: Montserrat, Helvetica, Arial, sans-serif; font-size: 12.5px; fill: #343A40; }
    .nb  { font-family: Montserrat, Helvetica, Arial, sans-serif; font-size: 12.5px; font-weight: 700; fill: #142D50; }
    .sm  { font-family: Montserrat, Helvetica, Arial, sans-serif; font-size: 11.5px; fill: #6C757D; }
    .ax  { font-family: Montserrat, Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 700; fill: #6C757D; }
    .m   { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12.5px; font-weight: 700; fill: #142D50; }
    .ms  { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11.5px; font-weight: 600; fill: #343A40; }
  </style>
  <defs>
    <marker id="aB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#22527B"/></marker>
    <marker id="aW" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#FFFFFF"/></marker>
    <marker id="aG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6C757D"/></marker>
    <marker id="aR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D1182C"/></marker>
    <marker id="aGr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E7D32"/></marker>
    <marker id="pcArr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6C757D"/>
    </marker>
    <marker id="pcDim" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,1 L5,5 L0,9" fill="none" stroke="#142D50" stroke-width="1.6"/>
    </marker>

    <!-- The XRP from above, traced from SparkFun's top-view photo. Front is UP.
         Origin = center of rotation (the pen hole between the drive wheels).
         Units: 1 unit = 4 photo px; the sensors are 60 units (8.75 cm) ahead of the origin. -->
    <g id="pcXRP" stroke-linejoin="round">
      <!-- rails out to the front casters -->
      <rect x="-59" y="-80" width="8" height="40" fill="#C3C8CD" stroke="#5F666D" stroke-width="1.3"/>
      <rect x="51"  y="-80" width="8" height="40" fill="#C3C8CD" stroke="#5F666D" stroke-width="1.3"/>
      <!-- main chassis plate -->
      <rect x="-59" y="-46" width="118" height="75" rx="8" fill="#D3D7DB" fill-opacity="0.92" stroke="#5F666D" stroke-width="1.5"/>
      <rect x="-50" y="-38" width="100" height="58" rx="4" fill="#E9ECEF" fill-opacity="0.85" stroke="#9AA1A8" stroke-width="0.8"/>
      <!-- caster bosses at the front corners -->
      <circle cx="-49" cy="-79" r="10" fill="#C3C8CD" stroke="#5F666D" stroke-width="1.3"/>
      <circle cx="49"  cy="-79" r="10" fill="#C3C8CD" stroke="#5F666D" stroke-width="1.3"/>
      <circle cx="-49" cy="-79" r="4.5" fill="#F1EBDD" stroke="#8A7E62" stroke-width="0.8"/>
      <circle cx="49"  cy="-79" r="4.5" fill="#F1EBDD" stroke="#8A7E62" stroke-width="0.8"/>
      <!-- drive wheels -->
      <rect x="-56" y="-21" width="11" height="42" rx="3.5" fill="#2B2B2B"/>
      <rect x="45"  y="-21" width="11" height="42" rx="3.5" fill="#2B2B2B"/>
      <line x1="-50.5" y1="-17" x2="-50.5" y2="17" stroke="#6C757D" stroke-width="1"/>
      <line x1="50.5"  y1="-17" x2="50.5"  y2="17" stroke="#6C757D" stroke-width="1"/>
      <!-- battery latches -->
      <rect x="-40" y="-30" width="6" height="12" rx="2" fill="#F05A28"/>
      <rect x="34"  y="-30" width="6" height="12" rx="2" fill="#F05A28"/>
      <!-- controller board -->
      <rect x="-24" y="-42" width="48" height="37" rx="2" fill="#D1182C"/>
      <rect x="-6" y="-41" width="12" height="35" rx="1" fill="#2B2B2B"/>
      <!-- servo + arm at the back -->
      <rect x="-26" y="22" width="15" height="13" rx="1.5" fill="#2B2B2B"/>
      <rect x="-34" y="24" width="8" height="26" rx="2" fill="#AEB4BA" stroke="#5F666D" stroke-width="1"/>
      <!-- rangefinder bracket, board and the two cylinders -->
      <rect x="-16" y="-58" width="32" height="13" rx="2" fill="#AEB4BA" stroke="#5F666D" stroke-width="1"/>
      <rect x="-18" y="-65" width="36" height="8" rx="1.5" fill="#B5172A"/>
      <circle cx="-8" cy="-68" r="5.5" fill="#E4E7EA" stroke="#868E96" stroke-width="1"/>
      <circle cx="8"  cy="-68" r="5.5" fill="#E4E7EA" stroke="#868E96" stroke-width="1"/>
      <!-- the two line sensors, under the rangefinder (drawn as if seen through it) -->
      <circle cx="-6.5" cy="-60" r="4" fill="#FFD43B" stroke="#142D50" stroke-width="1.4"/>
      <circle cx="6.5"  cy="-60" r="4" fill="#FFD43B" stroke="#142D50" stroke-width="1.4"/>
      <!-- center of rotation: the pen hole -->
      <circle cx="0" cy="0" r="5" fill="#FFFFFF" stroke="#142D50" stroke-width="1.8"/>
      <circle cx="0" cy="0" r="1.8" fill="#142D50"/>
    </g>

    <!-- the same robot after a right turn, as a dashed ghost -->
    <g id="pcGhost" fill="none" stroke="#343A40" stroke-width="1.4" stroke-dasharray="4 3">
      <path d="M -51 -46 V -72 M 51 -46 V -72 M -59 -36 V -79 M 59 -36 V -79 M -59 -46 H 59"/>
      <circle cx="-49" cy="-79" r="10"/>
      <circle cx="49"  cy="-79" r="10"/>
      <rect x="-18" y="-65" width="36" height="8" rx="1.5"/>
      <circle cx="-6.5" cy="-60" r="4.5" fill="#FFFFFF" stroke="#D1182C" stroke-width="2.4" stroke-dasharray="none"/>
      <circle cx="6.5"  cy="-60" r="4.5" fill="#FFFFFF" stroke="#D1182C" stroke-width="2.4" stroke-dasharray="none"/>
    </g>
  </defs>
  <rect width="680" height="410" fill="#FFFFFF"/>
  <text class="h" x="12" y="24">Which intersection is blocked?</text>
  <rect x="74" y="64" width="292" height="292" rx="8" fill="#F3F4F6" stroke="#DEE2E6"/>
  <rect x="105.5" y="64" width="9" height="292" fill="#2B2B2B"/>
  <rect x="74" y="95.5" width="292" height="9" fill="#2B2B2B"/>
  <rect x="215.5" y="64" width="9" height="292" fill="#2B2B2B"/>
  <rect x="74" y="205.5" width="292" height="9" fill="#2B2B2B"/>
  <rect x="325.5" y="64" width="9" height="292" fill="#2B2B2B"/>
  <rect x="74" y="315.5" width="292" height="9" fill="#2B2B2B"/>
  <text class="ax" x="110" y="56" text-anchor="middle">0</text>
  <text class="ax" x="64" y="104" text-anchor="end">0</text>
  <text class="ax" x="220" y="56" text-anchor="middle">1</text>
  <text class="ax" x="64" y="214" text-anchor="end">1</text>
  <text class="ax" x="330" y="56" text-anchor="middle">2</text>
  <text class="ax" x="64" y="324" text-anchor="end">2</text>
  <rect x="88" y="298" width="44" height="44" rx="4" fill="#C8A26B" stroke="#7A5C2E" stroke-width="2"/><path d="M 88 314 H 132" stroke="#7A5C2E" stroke-width="1.5"/>
  <use href="#pcXRP" transform="translate(110 210) rotate(180) scale(0.55)"/>
  <path d="M 98.8 255.8 A 14 14 0 0 0 121.2 255.8" fill="none" stroke="#4C8BF5" stroke-width="2.4" opacity="0.9"/>
  <path d="M 89.2 263.0 A 26 26 0 0 0 130.8 263.0" fill="none" stroke="#4C8BF5" stroke-width="2.4" opacity="0.7"/>
  <path d="M 79.6 270.2 A 38 38 0 0 0 140.4 270.2" fill="none" stroke="#4C8BF5" stroke-width="2.4" opacity="0.5"/>
  <rect x="173.0" y="199" width="110" height="20" rx="5" fill="#F1F3F5" stroke="#868E96" stroke-width="1.4"/><text class="ms" x="228" y="213.5" text-anchor="middle">position (1, 0)</text>
  <rect x="171.0" y="309" width="114" height="20" rx="5" fill="#FBE3E6" stroke="#D1182C" stroke-width="1.4"/><text class="ms" x="228" y="323.5" text-anchor="middle">next_pos (2, 0)</text>
  <text class="n" x="12" y="382">After turn_to(), the robot faces next_pos,</text>
  <text class="n" x="12" y="399">so a reading under OBSTACLE_CM means next_pos is blocked.</text>
  <text class="h" x="420" y="60">The reading, in cm</text>
  <line x1="420" y1="170" x2="660" y2="170" stroke="#495057" stroke-width="2"/>
  <line x1="420.0" y1="165" x2="420.0" y2="175" stroke="#495057" stroke-width="1.5"/><text class="sm" x="420.0" y="190" text-anchor="middle">0</text>
  <line x1="540.0" y1="165" x2="540.0" y2="175" stroke="#495057" stroke-width="1.5"/><text class="sm" x="540.0" y="190" text-anchor="middle">30</text>
  <line x1="600.0" y1="165" x2="600.0" y2="175" stroke="#495057" stroke-width="1.5"/><text class="sm" x="600.0" y="190" text-anchor="middle">45</text>
  <line x1="660.0" y1="165" x2="660.0" y2="175" stroke="#495057" stroke-width="1.5"/><text class="sm" x="660.0" y="190" text-anchor="middle">60</text>
  <rect x="420" y="136" width="60.0" height="24" fill="#FBE3E6" stroke="#D1182C" stroke-width="1.2"/><text class="sm" x="450.0" y="152" text-anchor="middle" style="fill:#D1182C;font-weight:700">blocked</text>
  <rect x="480.0" y="136" width="180.0" height="24" fill="#E1F0E3" stroke="#2E7D32" stroke-width="1.2"/><text class="sm" x="570.0" y="152" text-anchor="middle" style="fill:#2E7D32;font-weight:700">clear</text>
  <line x1="480.0" y1="126" x2="480.0" y2="200" stroke="#142D50" stroke-width="2.4" stroke-dasharray="5 3"/><text class="ms" x="480.0" y="216" text-anchor="middle">OBSTACLE_CM = 15</text>
  <circle cx="468.0" cy="170" r="6" fill="#D1182C"/>
  <circle cx="620.0" cy="170" r="6" fill="#2E7D32"/>
  <text class="sm" x="420" y="246" style="fill:#D1182C">● ~12 cm: a box on the next intersection</text>
  <text class="sm" x="420" y="264" style="fill:#2E7D32">● ~50 cm: nothing there</text>
  <text class="sm" x="420" y="290">Measure yours; set the cutoff between them.</text>
</svg>
