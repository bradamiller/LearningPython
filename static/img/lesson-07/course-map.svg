<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 410" width="680" height="410" role="img" aria-labelledby="fT fD">
  <title id="fT">The delivery course</title>
  <desc id="fD">A to-scale map, seen from above, of a route taped on the floor. From the start mark, where an XRP sits facing up the page, the tape runs 150 cm straight ahead, turns right 90 degrees, runs 100 cm, turns left 45 degrees, and runs 50 cm to a red target. A dashed red circle 30 cm around the target marks the stop zone. Each turn is drawn as a red arc from a dashed line that continues the way the robot was facing. Beside the map, a key explains the tape, the start, how turns are measured, and the stop zone.</desc>
  <style>
    .h   { font-family: Montserrat, Helvetica, Arial, sans-serif; font-size: 14px; font-weight: 700; fill: #22527B; }
    .n   { font-family: Montserrat, Helvetica, Arial, sans-serif; font-size: 12.5px; fill: #343A40; }
    .nb  { font-family: Montserrat, Helvetica, Arial, sans-serif; font-size: 12.5px; font-weight: 700; fill: #142D50; }
    .sm  { font-family: Montserrat, Helvetica, Arial, sans-serif; font-size: 11.5px; fill: #6C757D; }
    .ax  { font-family: Montserrat, Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 700; fill: #6C757D; }
    .m   { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12.5px; font-weight: 700; fill: #142D50; }
    .ms  { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11.5px; font-weight: 600; fill: #343A40; }
  </style>
  <defs>
    <marker id="aB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#22527B"/></marker>
    <marker id="aW" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#FFFFFF"/></marker>
    <marker id="aG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6C757D"/></marker>
    <marker id="aR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D1182C"/></marker>
    <marker id="aGr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E7D32"/></marker>
    <marker id="pcArr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6C757D"/>
    </marker>
    <marker id="pcDim" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,1 L5,5 L0,9" fill="none" stroke="#142D50" stroke-width="1.6"/>
    </marker>

    <!-- The XRP from above, traced from SparkFun's top-view photo. Front is UP.
         Origin = center of rotation (the pen hole between the drive wheels).
         Units: 1 unit = 4 photo px; the sensors are 60 units (8.75 cm) ahead of the origin. -->
    <g id="pcXRP" stroke-linejoin="round">
      <!-- rails out to the front casters -->
      <rect x="-59" y="-80" width="8" height="40" fill="#C3C8CD" stroke="#5F666D" stroke-width="1.3"/>
      <rect x="51"  y="-80" width="8" height="40" fill="#C3C8CD" stroke="#5F666D" stroke-width="1.3"/>
      <!-- main chassis plate -->
      <rect x="-59" y="-46" width="118" height="75" rx="8" fill="#D3D7DB" fill-opacity="0.92" stroke="#5F666D" stroke-width="1.5"/>
      <rect x="-50" y="-38" width="100" height="58" rx="4" fill="#E9ECEF" fill-opacity="0.85" stroke="#9AA1A8" stroke-width="0.8"/>
      <!-- caster bosses at the front corners -->
      <circle cx="-49" cy="-79" r="10" fill="#C3C8CD" stroke="#5F666D" stroke-width="1.3"/>
      <circle cx="49"  cy="-79" r="10" fill="#C3C8CD" stroke="#5F666D" stroke-width="1.3"/>
      <circle cx="-49" cy="-79" r="4.5" fill="#F1EBDD" stroke="#8A7E62" stroke-width="0.8"/>
      <circle cx="49"  cy="-79" r="4.5" fill="#F1EBDD" stroke="#8A7E62" stroke-width="0.8"/>
      <!-- drive wheels -->
      <rect x="-56" y="-21" width="11" height="42" rx="3.5" fill="#2B2B2B"/>
      <rect x="45"  y="-21" width="11" height="42" rx="3.5" fill="#2B2B2B"/>
      <line x1="-50.5" y1="-17" x2="-50.5" y2="17" stroke="#6C757D" stroke-width="1"/>
      <line x1="50.5"  y1="-17" x2="50.5"  y2="17" stroke="#6C757D" stroke-width="1"/>
      <!-- battery latches -->
      <rect x="-40" y="-30" width="6" height="12" rx="2" fill="#F05A28"/>
      <rect x="34"  y="-30" width="6" height="12" rx="2" fill="#F05A28"/>
      <!-- controller board -->
      <rect x="-24" y="-42" width="48" height="37" rx="2" fill="#D1182C"/>
      <rect x="-6" y="-41" width="12" height="35" rx="1" fill="#2B2B2B"/>
      <!-- servo + arm at the back -->
      <rect x="-26" y="22" width="15" height="13" rx="1.5" fill="#2B2B2B"/>
      <rect x="-34" y="24" width="8" height="26" rx="2" fill="#AEB4BA" stroke="#5F666D" stroke-width="1"/>
      <!-- rangefinder bracket, board and the two cylinders -->
      <rect x="-16" y="-58" width="32" height="13" rx="2" fill="#AEB4BA" stroke="#5F666D" stroke-width="1"/>
      <rect x="-18" y="-65" width="36" height="8" rx="1.5" fill="#B5172A"/>
      <circle cx="-8" cy="-68" r="5.5" fill="#E4E7EA" stroke="#868E96" stroke-width="1"/>
      <circle cx="8"  cy="-68" r="5.5" fill="#E4E7EA" stroke="#868E96" stroke-width="1"/>
      <!-- the two line sensors, under the rangefinder (drawn as if seen through it) -->
      <circle cx="-6.5" cy="-60" r="4" fill="#FFD43B" stroke="#142D50" stroke-width="1.4"/>
      <circle cx="6.5"  cy="-60" r="4" fill="#FFD43B" stroke="#142D50" stroke-width="1.4"/>
      <!-- center of rotation: the pen hole -->
      <circle cx="0" cy="0" r="5" fill="#FFFFFF" stroke="#142D50" stroke-width="1.8"/>
      <circle cx="0" cy="0" r="1.8" fill="#142D50"/>
    </g>

    <!-- the same robot after a right turn, as a dashed ghost -->
    <g id="pcGhost" fill="none" stroke="#343A40" stroke-width="1.4" stroke-dasharray="4 3">
      <path d="M -51 -46 V -72 M 51 -46 V -72 M -59 -36 V -79 M 59 -36 V -79 M -59 -46 H 59"/>
      <circle cx="-49" cy="-79" r="10"/>
      <circle cx="49"  cy="-79" r="10"/>
      <rect x="-18" y="-65" width="36" height="8" rx="1.5"/>
      <circle cx="-6.5" cy="-60" r="4.5" fill="#FFFFFF" stroke="#D1182C" stroke-width="2.4" stroke-dasharray="none"/>
      <circle cx="6.5"  cy="-60" r="4.5" fill="#FFFFFF" stroke="#D1182C" stroke-width="2.4" stroke-dasharray="none"/>
    </g>
  </defs>
  <rect width="680" height="410" fill="#FFFFFF"/>
  <text class="h" x="20" y="26">The delivery course</text>
  <rect x="20" y="40" width="310" height="358" rx="10" fill="#F3F4F6" stroke="#DEE2E6"/>
  <path d="M 33.5 44 V 394 M 47.0 44 V 394 M 60.5 44 V 394 M 74.0 44 V 394 M 87.5 44 V 394 M 101.0 44 V 394 M 114.5 44 V 394 M 128.0 44 V 394 M 141.5 44 V 394 M 155.0 44 V 394 M 168.5 44 V 394 M 182.0 44 V 394 M 195.5 44 V 394 M 209.0 44 V 394 M 222.5 44 V 394 M 236.0 44 V 394 M 249.5 44 V 394 M 263.0 44 V 394 M 276.5 44 V 394 M 290.0 44 V 394 M 303.5 44 V 394 M 24 392.5 H 326 M 24 379.0 H 326 M 24 365.5 H 326 M 24 352.0 H 326 M 24 338.5 H 326 M 24 325.0 H 326 M 24 311.5 H 326 M 24 298.0 H 326 M 24 284.5 H 326 M 24 271.0 H 326 M 24 257.5 H 326 M 24 244.0 H 326 M 24 230.5 H 326 M 24 217.0 H 326 M 24 203.5 H 326 M 24 190.0 H 326 M 24 176.5 H 326 M 24 163.0 H 326 M 24 149.5 H 326 M 24 136.0 H 326 M 24 122.5 H 326 M 24 109.0 H 326 M 24 95.5 H 326 M 24 82.0 H 326 M 24 68.5 H 326 M 24 55.0 H 326" stroke="#E2E5E9" stroke-width="1"/>
  <circle cx="256.7" cy="101.8" r="40.5" fill="#D1182C" fill-opacity="0.07" stroke="#D1182C" stroke-width="1.8" stroke-dasharray="6 4"/>
  <path d="M 74.0 352.0 L 74.0 149.5 L 209.0 149.5 L 256.7 101.8" fill="none" stroke="#2B2B2B" stroke-width="7" stroke-linejoin="round" stroke-linecap="butt"/>
  <line x1="58.0" y1="352.0" x2="90.0" y2="352.0" stroke="#2B2B2B" stroke-width="5"/>
  <text class="nb" x="74.0" y="376.0" text-anchor="middle">START</text>
  <circle cx="256.7" cy="101.8" r="9" fill="#FFFFFF" stroke="#D1182C" stroke-width="3"/><circle cx="256.7" cy="101.8" r="3.5" fill="#D1182C"/>
  <text class="nb" x="256.7" y="53.3" text-anchor="middle" style="fill:#D1182C">TARGET</text>
  <line x1="56.0" y1="352.0" x2="56.0" y2="149.5" stroke="#6C757D" stroke-width="1.4" marker-start="url(#aG)" marker-end="url(#aG)"/><rect x="29.0" y="239.75" width="54" height="20" rx="5" fill="#FFFFFF" stroke="#6C757D" stroke-width="1.4"/><text class="ms" x="56.0" y="254.25" text-anchor="middle">150 cm</text>
  <line x1="74.0" y1="167.5" x2="209.0" y2="167.5" stroke="#6C757D" stroke-width="1.4" marker-start="url(#aG)" marker-end="url(#aG)"/><rect x="114.5" y="156.5" width="54" height="20" rx="5" fill="#FFFFFF" stroke="#6C757D" stroke-width="1.4"/><text class="ms" x="141.5" y="171.0" text-anchor="middle">100 cm</text>
  <line x1="199.1" y1="139.6" x2="246.8" y2="91.9" stroke="#6C757D" stroke-width="1.4" marker-start="url(#aG)" marker-end="url(#aG)"/><rect x="173.4653589284343" y="90.73565119834235" width="47" height="20" rx="5" fill="#FFFFFF" stroke="#6C757D" stroke-width="1.4"/><text class="ms" x="196.9653589284343" y="105.23565119834235" text-anchor="middle">50 cm</text>
  <line x1="74.0" y1="149.5" x2="74.0" y2="111.7" stroke="#ADB5BD" stroke-width="2" stroke-dasharray="4 4"/><path d="M 74.0 125.2 A 24.3 24.3 0 0 1 98.3 149.5" fill="none" stroke="#D1182C" stroke-width="2.2" marker-end="url(#aR)"/><rect x="28.5" y="92.5" width="75" height="20" rx="5" fill="#FFFFFF" stroke="#D1182C" stroke-width="1.4"/><text class="ms" x="66.0" y="107.0" text-anchor="middle">right 90°</text>
  <line x1="209.0" y1="149.5" x2="246.8" y2="149.5" stroke="#ADB5BD" stroke-width="2" stroke-dasharray="4 4"/><path d="M 229.2 149.5 A 20.2 20.2 0 0 0 223.3 135.2" fill="none" stroke="#D1182C" stroke-width="2.2" marker-end="url(#aR)"/><rect x="237.0" y="166.5" width="68" height="20" rx="5" fill="#FFFFFF" stroke="#D1182C" stroke-width="1.4"/><text class="ms" x="271.0" y="181.0" text-anchor="middle">left 45°</text>
  <use href="#pcXRP" transform="translate(74.0 352.0) scale(0.2)"/>
  <line x1="242.5" y1="382" x2="310" y2="382" stroke="#6C757D" stroke-width="2"/><path d="M 242.5 377 v 10 M 310 377 v 10" stroke="#6C757D" stroke-width="2"/><text class="sm" x="276.2" y="373" text-anchor="middle">50 cm</text>
  <text class="h" x="356" y="60">Reading the map</text>
  <line x1="358" y1="86" x2="382" y2="86" stroke="#2B2B2B" stroke-width="7"/><text class="n" x="394" y="90">Tape on the floor: the route.</text>
  <use href="#pcXRP" transform="translate(370 129) scale(0.16)"/><text class="n" x="394" y="127">Start with the center of rotation</text><text class="n" x="394" y="144">on the mark, facing up the first leg.</text>
  <path d="M 359 181 A 14 14 0 0 1 379 171" fill="none" stroke="#D1182C" stroke-width="2.2" marker-end="url(#aR)"/><text class="n" x="394" y="181">A turn is measured from the way</text><text class="n" x="394" y="198">the robot is already facing</text><text class="n" x="394" y="215">(the dashed line).</text>
  <circle cx="370" cy="248" r="12" fill="#D1182C" fill-opacity="0.07" stroke="#D1182C" stroke-width="1.8" stroke-dasharray="5 3"/><circle cx="370" cy="248" r="3" fill="#D1182C"/><text class="n" x="394" y="252">Stop zone: finish within 30 cm</text><text class="n" x="394" y="269">of the target, then signal.</text>
  <text class="sm" x="356" y="308">Drawn to scale. Each faint square is 10 cm.</text>
</svg>
