" y="225" style="fill:#22527B">Side 2</text><text class="sm" x="444" y="244">Straight 20 cm</text></g><g opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.4550;0.5721" calcMode="discrete" dur="14.80s" repeatCount="indefinite"/><rect x="430" y="202" width="236" height="54" rx="10" fill="#FFFFFF" stroke="#D1182C" stroke-width="2"/><text class="nb" x="444" y="225" style="fill:#D1182C">Corner 2: Turn 120</text><text class="sm" x="444" y="244">turned 240 degrees so far</text></g><g opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.5721;0.7072" calcMode="discrete" dur="14.80s" repeatCount="indefinite"/><rect x="430" y="202" width="236" height="54" rx="10" fill="#FFFFFF" stroke="#22527B" stroke-width="2"/><text class="nb" x="444" y="225" style="fill:#22527B">Side 3</text><text class="sm" x="444" y="244">Straight 20 cm</text></g><g opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.7072;0.8243" calcMode="discrete" dur="14.80s" repeatCount="indefinite"/><rect x="430" y="202" width="236" height="54" rx="10" fill="#FFFFFF" stroke="#D1182C" stroke-width="2"/><text class="nb" x="444" y="225" style="fill:#D1182C">Corner 3: Turn 120</text><text class="sm" x="444" y="244">turned 360 degrees so far</text></g><g opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.8243;0.9999" calcMode="discrete" dur="14.80s" repeatCount="indefinite"/><rect x="430" y="202" width="236" height="54" rx="10" fill="#FFFFFF" stroke="#2E7D32" stroke-width="2"/><text class="nb" x="444" y="225" style="fill:#2E7D32">Closed!</text><text class="sm" x="444" y="244">turned 360 in total: back at the start</text></g></g>
