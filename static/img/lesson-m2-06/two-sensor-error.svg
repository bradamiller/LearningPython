<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" role="img" aria-labelledby="tsTitle tsDesc">
  <title id="tsTitle">Two sensors straddling a line: centered, drifted right, drifted left</title>
  <desc id="tsDesc">Three top-down views of a robot, drawn as a rectangle with two small sensor circles at its front, over a vertical strip of black tape. Centered: each sensor sits on an edge of the tape, left reads 0.5 and right reads 0.5, error 0.0, drive straight. Drifted right: the robot has moved to the right of the tape, so the left sensor is over the tape and the right sensor is on white; left 0.8, right 0.2, error +0.6, steer left. Drifted left: the robot has moved left, the right sensor is over the tape; left 0.2, right 0.8, error -0.6, steer right.</desc>
  <style>
    .t  { font-family: Montserrat, Helvetica, Arial, sans-serif; font-size: 15px; font-weight: 700; fill: #22527B; }
    .l  { font-family: Montserrat, Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 600; fill: #343A40; }
    .n  { font-family: Montserrat, Helvetica, Arial, sans-serif; font-size: 11.5px; fill: #6C757D; }
    .m  { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; font-weight: 700; fill: #343A40; }
    .e  { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; font-weight: 700; fill: #D1182C; }
    .s  { font-family: Montserrat, Helvetica, Arial, sans-serif; font-size: 12.5px; font-weight: 700; fill: #142D50; }
  </style>
  <rect width="760" height="330" fill="#FFFFFF"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#D1182C"/>
    </marker>
  </defs>
  <rect x="20" y="48" width="190" height="202" fill="#F3F4F6" stroke="#E9ECEF"/>
  <line x1="34" y1="92" x2="34" y2="60" stroke="#6C757D" stroke-width="2" marker-end="url(#arr)"/>
  <text class="n" x="40" y="80">forward</text>
  <rect x="93.0" y="48" width="44" height="202" fill="#2B2B2B"/>
  <rect x="60" y="130" width="110" height="90" rx="10" fill="#FFFFFF" fill-opacity="0.72" stroke="#22527B" stroke-width="2.5"/>
  <rect x="54" y="170" width="8" height="34" rx="2" fill="#495057"/>
  <rect x="168" y="170" width="8" height="34" rx="2" fill="#495057"/>
  <circle cx="93.0" cy="144" r="7" fill="#D1182C" stroke="#FFFFFF" stroke-width="1.5"/>
  <circle cx="137.0" cy="144" r="7" fill="#D1182C" stroke="#FFFFFF" stroke-width="1.5"/>
  <text class="l" x="93.0" y="168" text-anchor="middle" fill="#343A40">L</text>
  <text class="l" x="137.0" y="168" text-anchor="middle">R</text>
  <text class="t" x="20" y="30">Centered</text>
  <text class="m" x="20" y="270">left  = 0.5   right = 0.5</text>
  <text class="e" x="20" y="290">error = left - right = 0.0</text>
  <text class="s" x="20" y="312">drive straight</text>
  <rect x="270" y="48" width="190" height="202" fill="#F3F4F6" stroke="#E9ECEF"/>
  <line x1="284" y1="92" x2="284" y2="60" stroke="#6C757D" stroke-width="2" marker-end="url(#arr)"/>
  <text class="n" x="290" y="80">forward</text>
  <rect x="343.0" y="48" width="44" height="202" fill="#2B2B2B"/>
  <rect x="332" y="130" width="110" height="90" rx="10" fill="#FFFFFF" fill-opacity="0.72" stroke="#22527B" stroke-width="2.5"/>
  <rect x="326" y="170" width="8" height="34" rx="2" fill="#495057"/>
  <rect x="440" y="170" width="8" height="34" rx="2" fill="#495057"/>
  <circle cx="365.0" cy="144" r="7" fill="#D1182C" stroke="#FFFFFF" stroke-width="1.5"/>
  <circle cx="409.0" cy="144" r="7" fill="#D1182C" stroke="#FFFFFF" stroke-width="1.5"/>
  <text class="l" x="365.0" y="168" text-anchor="middle" fill="#343A40">L</text>
  <text class="l" x="409.0" y="168" text-anchor="middle">R</text>
  <line x1="409" y1="196" x2="365" y2="196" stroke="#D1182C" stroke-width="2.5" marker-end="url(#arr)"/>
  <text class="t" x="270" y="30">Drifted right</text>
  <text class="m" x="270" y="270">left  = 0.8   right = 0.2</text>
  <text class="e" x="270" y="290">error = left - right = +0.6</text>
  <text class="s" x="270" y="312">steer left</text>
  <rect x="520" y="48" width="190" height="202" fill="#F3F4F6" stroke="#E9ECEF"/>
  <line x1="534" y1="92" x2="534" y2="60" stroke="#6C757D" stroke-width="2" marker-end="url(#arr)"/>
  <text class="n" x="540" y="80">forward</text>
  <rect x="593.0" y="48" width="44" height="202" fill="#2B2B2B"/>
  <rect x="538" y="130" width="110" height="90" rx="10" fill="#FFFFFF" fill-opacity="0.72" stroke="#22527B" stroke-width="2.5"/>
  <rect x="532" y="170" width="8" height="34" rx="2" fill="#495057"/>
  <rect x="646" y="170" width="8" height="34" rx="2" fill="#495057"/>
  <circle cx="571.0" cy="144" r="7" fill="#D1182C" stroke="#FFFFFF" stroke-width="1.5"/>
  <circle cx="615.0" cy="144" r="7" fill="#D1182C" stroke="#FFFFFF" stroke-width="1.5"/>
  <text class="l" x="571.0" y="168" text-anchor="middle" fill="#343A40">L</text>
  <text class="l" x="615.0" y="168" text-anchor="middle">R</text>
  <line x1="571" y1="196" x2="615" y2="196" stroke="#D1182C" stroke-width="2.5" marker-end="url(#arr)"/>
  <text class="t" x="520" y="30">Drifted left</text>
  <text class="m" x="520" y="270">left  = 0.2   right = 0.8</text>
  <text class="e" x="520" y="290">error = left - right = -0.6</text>
  <text class="s" x="520" y="312">steer right</text>
</svg>