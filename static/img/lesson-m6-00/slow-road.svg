<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 392" width="680" height="392" role="img" aria-labelledby="fT fD">
  <title id="fT">One slow segment, two answers</title>
  <desc id="fD">A 4 by 4 grid of tape. The segment between (0, 1) and (0, 2) winds back and forth instead of running straight. From S at (0, 0) to D at (0, 3), BFS takes the straight row through the slow segment: 3 steps, cost 7. Dijkstra goes down to row 1, across, and back up to row 0: 5 steps, cost 5, and arrives first.</desc>
  <style>
    .h   { font-family: Montserrat, Helvetica, Arial, sans-serif; font-size: 14px; font-weight: 700; fill: #22527B; }
    .n   { font-family: Montserrat, Helvetica, Arial, sans-serif; font-size: 12.5px; fill: #343A40; }
    .nb  { font-family: Montserrat, Helvetica, Arial, sans-serif; font-size: 12.5px; font-weight: 700; fill: #142D50; }
    .sm  { font-family: Montserrat, Helvetica, Arial, sans-serif; font-size: 11.5px; fill: #6C757D; }
    .ax  { font-family: Montserrat, Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 700; fill: #6C757D; }
    .m   { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12.5px; font-weight: 700; fill: #142D50; }
    .ms  { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11.5px; font-weight: 600; fill: #343A40; }
  </style>
  <defs>
    <marker id="aB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#22527B"/></marker>
    <marker id="aW" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#FFFFFF"/></marker>
    <marker id="aG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6C757D"/></marker>
    <marker id="aR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D1182C"/></marker>
    <marker id="aGr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E7D32"/></marker>
    <marker id="pcArr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6C757D"/>
    </marker>
    <marker id="pcDim" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,1 L5,5 L0,9" fill="none" stroke="#142D50" stroke-width="1.6"/>
    </marker>

    <!-- The XRP from above, traced from SparkFun's top-view photo. Front is UP.
         Origin = center of rotation (the pen hole between the drive wheels).
         Units: 1 unit = 4 photo px; the sensors are 60 units (8.75 cm) ahead of the origin. -->
    <g id="pcXRP" stroke-linejoin="round">
      <!-- rails out to the front casters -->
      <rect x="-59" y="-80" width="8" height="40" fill="#C3C8CD" stroke="#5F666D" stroke-width="1.3"/>
      <rect x="51"  y="-80" width="8" height="40" fill="#C3C8CD" stroke="#5F666D" stroke-width="1.3"/>
      <!-- main chassis plate -->
      <rect x="-59" y="-46" width="118" height="75" rx="8" fill="#D3D7DB" fill-opacity="0.92" stroke="#5F666D" stroke-width="1.5"/>
      <rect x="-50" y="-38" width="100" height="58" rx="4" fill="#E9ECEF" fill-opacity="0.85" stroke="#9AA1A8" stroke-width="0.8"/>
      <!-- caster bosses at the front corners -->
      <circle cx="-49" cy="-79" r="10" fill="#C3C8CD" stroke="#5F666D" stroke-width="1.3"/>
      <circle cx="49"  cy="-79" r="10" fill="#C3C8CD" stroke="#5F666D" stroke-width="1.3"/>
      <circle cx="-49" cy="-79" r="4.5" fill="#F1EBDD" stroke="#8A7E62" stroke-width="0.8"/>
      <circle cx="49"  cy="-79" r="4.5" fill="#F1EBDD" stroke="#8A7E62" stroke-width="0.8"/>
      <!-- drive wheels -->
      <rect x="-56" y="-21" width="11" height="42" rx="3.5" fill="#2B2B2B"/>
      <rect x="45"  y="-21" width="11" height="42" rx="3.5" fill="#2B2B2B"/>
      <line x1="-50.5" y1="-17" x2="-50.5" y2="17" stroke="#6C757D" stroke-width="1"/>
      <line x1="50.5"  y1="-17" x2="50.5"  y2="17" stroke="#6C757D" stroke-width="1"/>
      <!-- battery latches -->
      <rect x="-40" y="-30" width="6" height="12" rx="2" fill="#F05A28"/>
      <rect x="34"  y="-30" width="6" height="12" rx="2" fill="#F05A28"/>
      <!-- controller board -->
      <rect x="-24" y="-42" width="48" height="37" rx="2" fill="#D1182C"/>
      <rect x="-6" y="-41" width="12" height="35" rx="1" fill="#2B2B2B"/>
      <!-- servo + arm at the back -->
      <rect x="-26" y="22" width="15" height="13" rx="1.5" fill="#2B2B2B"/>
      <rect x="-34" y="24" width="8" height="26" rx="2" fill="#AEB4BA" stroke="#5F666D" stroke-width="1"/>
      <!-- rangefinder bracket, board and the two cylinders -->
      <rect x="-16" y="-58" width="32" height="13" rx="2" fill="#AEB4BA" stroke="#5F666D" stroke-width="1"/>
      <rect x="-18" y="-65" width="36" height="8" rx="1.5" fill="#B5172A"/>
      <circle cx="-8" cy="-68" r="5.5" fill="#E4E7EA" stroke="#868E96" stroke-width="1"/>
      <circle cx="8"  cy="-68" r="5.5" fill="#E4E7EA" stroke="#868E96" stroke-width="1"/>
      <!-- the two line sensors, under the rangefinder (drawn as if seen through it) -->
      <circle cx="-6.5" cy="-60" r="4" fill="#FFD43B" stroke="#142D50" stroke-width="1.4"/>
      <circle cx="6.5"  cy="-60" r="4" fill="#FFD43B" stroke="#142D50" stroke-width="1.4"/>
      <!-- center of rotation: the pen hole -->
      <circle cx="0" cy="0" r="5" fill="#FFFFFF" stroke="#142D50" stroke-width="1.8"/>
      <circle cx="0" cy="0" r="1.8" fill="#142D50"/>
    </g>

    <!-- the same robot after a right turn, as a dashed ghost -->
    <g id="pcGhost" fill="none" stroke="#343A40" stroke-width="1.4" stroke-dasharray="4 3">
      <path d="M -51 -46 V -72 M 51 -46 V -72 M -59 -36 V -79 M 59 -36 V -79 M -59 -46 H 59"/>
      <circle cx="-49" cy="-79" r="10"/>
      <circle cx="49"  cy="-79" r="10"/>
      <rect x="-18" y="-65" width="36" height="8" rx="1.5"/>
      <circle cx="-6.5" cy="-60" r="4.5" fill="#FFFFFF" stroke="#D1182C" stroke-width="2.4" stroke-dasharray="none"/>
      <circle cx="6.5"  cy="-60" r="4.5" fill="#FFFFFF" stroke="#D1182C" stroke-width="2.4" stroke-dasharray="none"/>
    </g>
  </defs>
  <rect width="680" height="392" fill="#FFFFFF"/>
  <text class="h" x="20" y="26">One slow segment, two answers</text>
  <rect x="48" y="80" width="304" height="304" rx="8" fill="#F3F4F6" stroke="#DEE2E6"/>
  <rect x="75.5" y="80" width="9" height="304" fill="#2B2B2B"/>
  <rect x="48" y="107.5" width="304" height="9" fill="#2B2B2B"/>
  <rect x="155.5" y="80" width="9" height="304" fill="#2B2B2B"/>
  <rect x="48" y="187.5" width="304" height="9" fill="#2B2B2B"/>
  <rect x="235.5" y="80" width="9" height="304" fill="#2B2B2B"/>
  <rect x="48" y="267.5" width="304" height="9" fill="#2B2B2B"/>
  <rect x="315.5" y="80" width="9" height="304" fill="#2B2B2B"/>
  <rect x="48" y="347.5" width="304" height="9" fill="#2B2B2B"/>
  <text class="ax" x="80" y="72" text-anchor="middle">0</text>
  <text class="ax" x="38" y="116" text-anchor="end">0</text>
  <text class="ax" x="160" y="72" text-anchor="middle">1</text>
  <text class="ax" x="38" y="196" text-anchor="end">1</text>
  <text class="ax" x="240" y="72" text-anchor="middle">2</text>
  <text class="ax" x="38" y="276" text-anchor="end">2</text>
  <text class="ax" x="320" y="72" text-anchor="middle">3</text>
  <text class="ax" x="38" y="356" text-anchor="end">3</text>
  <text class="ax" x="200.0" y="56" text-anchor="middle" style="fill:#22527B">column →</text>
  <text class="ax" x="24" y="232.0" text-anchor="middle" transform="rotate(-90 24 232.0)" style="fill:#22527B">← row</text>
  <rect x="164.5" y="106.5" width="71" height="11" fill="#F3F4F6"/>
  <path d="M 160.0 112.0 L 160.9 112.3 L 161.8 113.1 L 162.7 114.4 L 163.6 116.0 L 164.4 117.8 L 165.3 119.6 L 166.2 121.3 L 167.1 122.6 L 168.0 123.4 L 168.9 123.5 L 169.8 122.9 L 170.7 121.4 L 171.6 119.1 L 172.4 115.9 L 173.3 112.0 L 174.2 107.8 L 175.1 103.9 L 176.0 100.2 L 176.9 97.1 L 177.8 94.7 L 178.7 93.0 L 179.6 92.1 L 180.4 92.1 L 181.3 93.0 L 182.2 94.7 L 183.1 97.1 L 184.0 100.2 L 184.9 103.9 L 185.8 107.8 L 186.7 112.0 L 187.6 116.2 L 188.4 120.1 L 189.3 123.8 L 190.2 126.9 L 191.1 129.3 L 192.0 131.0 L 192.9 131.9 L 193.8 131.9 L 194.7 131.0 L 195.6 129.3 L 196.4 126.9 L 197.3 123.8 L 198.2 120.1 L 199.1 116.2 L 200.0 112.0 L 200.9 107.8 L 201.8 103.9 L 202.7 100.2 L 203.6 97.1 L 204.4 94.7 L 205.3 93.0 L 206.2 92.1 L 207.1 92.1 L 208.0 93.0 L 208.9 94.7 L 209.8 97.1 L 210.7 100.2 L 211.6 103.9 L 212.4 107.8 L 213.3 112.0 L 214.2 116.2 L 215.1 120.1 L 216.0 123.8 L 216.9 126.9 L 217.8 129.3 L 218.7 131.0 L 219.6 131.9 L 220.4 131.9 L 221.3 131.0 L 222.2 129.3 L 223.1 126.9 L 224.0 123.8 L 224.9 120.1 L 225.8 116.2 L 226.7 112.0 L 227.6 108.1 L 228.4 104.9 L 229.3 102.6 L 230.2 101.1 L 231.1 100.5 L 232.0 100.6 L 232.9 101.4 L 233.8 102.7 L 234.7 104.4 L 235.6 106.2 L 236.4 108.0 L 237.3 109.6 L 238.2 110.9 L 239.1 111.7 L 240.0 112.0" fill="none" stroke="#2B2B2B" stroke-width="9" stroke-linejoin="round"/>
  <path d="M 80 112 L 160 112 L 160.0 112.0 L 160.9 112.3 L 161.8 113.1 L 162.7 114.4 L 163.6 116.0 L 164.4 117.8 L 165.3 119.6 L 166.2 121.3 L 167.1 122.6 L 168.0 123.4 L 168.9 123.5 L 169.8 122.9 L 170.7 121.4 L 171.6 119.1 L 172.4 115.9 L 173.3 112.0 L 174.2 107.8 L 175.1 103.9 L 176.0 100.2 L 176.9 97.1 L 177.8 94.7 L 178.7 93.0 L 179.6 92.1 L 180.4 92.1 L 181.3 93.0 L 182.2 94.7 L 183.1 97.1 L 184.0 100.2 L 184.9 103.9 L 185.8 107.8 L 186.7 112.0 L 187.6 116.2 L 188.4 120.1 L 189.3 123.8 L 190.2 126.9 L 191.1 129.3 L 192.0 131.0 L 192.9 131.9 L 193.8 131.9 L 194.7 131.0 L 195.6 129.3 L 196.4 126.9 L 197.3 123.8 L 198.2 120.1 L 199.1 116.2 L 200.0 112.0 L 200.9 107.8 L 201.8 103.9 L 202.7 100.2 L 203.6 97.1 L 204.4 94.7 L 205.3 93.0 L 206.2 92.1 L 207.1 92.1 L 208.0 93.0 L 208.9 94.7 L 209.8 97.1 L 210.7 100.2 L 211.6 103.9 L 212.4 107.8 L 213.3 112.0 L 214.2 116.2 L 215.1 120.1 L 216.0 123.8 L 216.9 126.9 L 217.8 129.3 L 218.7 131.0 L 219.6 131.9 L 220.4 131.9 L 221.3 131.0 L 222.2 129.3 L 223.1 126.9 L 224.0 123.8 L 224.9 120.1 L 225.8 116.2 L 226.7 112.0 L 227.6 108.1 L 228.4 104.9 L 229.3 102.6 L 230.2 101.1 L 231.1 100.5 L 232.0 100.6 L 232.9 101.4 L 233.8 102.7 L 234.7 104.4 L 235.6 106.2 L 236.4 108.0 L 237.3 109.6 L 238.2 110.9 L 239.1 111.7 L 240.0 112.0 L 320 112" fill="none" stroke="#D1182C" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" opacity="0.85"/>
  <path d="M 80 112 L 80 192 L 160 192 L 240 192 L 240 112 L 320 112" fill="none" stroke="#2E7D32" stroke-width="6" stroke-linejoin="round" stroke-linecap="round" opacity="0.85"/>
  <circle cx="80" cy="112" r="11" fill="#142D50" stroke="#FFFFFF" stroke-width="2"/><text class="sm" x="80" y="116" text-anchor="middle" style="fill:#FFFFFF;font-weight:700">S</text>
  <circle cx="320" cy="112" r="11" fill="#2E7D32" stroke="#FFFFFF" stroke-width="2"/><text class="sm" x="320" y="116" text-anchor="middle" style="fill:#FFFFFF;font-weight:700">D</text>
  <rect x="152.0" y="143" width="96" height="20" rx="5" fill="#FFFFFF" stroke="#D1182C" stroke-width="1.4"/><text class="sm" style="fill:#D1182C;font-weight:700" x="200.0" y="157.5" text-anchor="middle">the slow road</text>
  <rect x="400" y="92" width="262" height="92" rx="10" fill="#FFFFFF" stroke="#D1182C" stroke-width="2"/>
  <text class="nb" x="414" y="116" style="fill:#D1182C">BFS: fewest steps</text>
  <text class="n" x="414" y="136">straight along row 0</text>
  <text class="m" x="414" y="156">3 steps   cost 7</text>
  <rect x="400" y="202" width="262" height="92" rx="10" fill="#FFFFFF" stroke="#2E7D32" stroke-width="2"/>
  <text class="nb" x="414" y="226" style="fill:#2E7D32">Dijkstra: least time</text>
  <text class="n" x="414" y="246">down, across row 1, back up</text>
  <text class="m" x="414" y="266">5 steps   cost 5</text>
  <text class="sm" x="400" y="322">cost = blocks' worth of time; the slow road</text>
  <text class="sm" x="400" y="338">costs 5, every other block costs 1</text>
</svg>
