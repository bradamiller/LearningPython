<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 410" width="680" height="410" role="img" aria-labelledby="fT fD">
  <title id="fT">Drive until the line, from above</title>
  <desc id="fD">An animation, seen from above, of the Lesson 2-2 activity. The robot starts in the middle of a taped circle, pointing at the edge. Beside it, the test outline: read the left sensor; while it says white, drive forward and read it again; stop the motors; print the reading. A highlight steps through the outline as the program runs, and a box shows each reading: about 0.2 on white, so left is less than THRESHOLD and the loop goes round again while the robot creeps forward. When the sensor reaches the tape the reading jumps to 0.84, the comparison is False, the loop ends, the robot stops with its sensor on the line, and it prints the reading. The robot is put back in the middle pointing at a different part of the edge, and the same program stops it at the line there too.</desc>
