  <rect x="430" y="226" width="236" height="50" rx="8" fill="#F8F9FA" stroke="#ADB5BD"/>
  <text class="sm" x="430" y="366">The loop checks before every pass. The</text>
  <text class="sm" x="430" y="381">first False reading ends it, wherever</text>
  <text class="sm" x="430" y="396">the edge happens to be.</text>
