  <text class="sm" x="248" y="66">square #1</text>
  <polygon points="34,146 234,146 234,172 50,172 50,222 154,222 154,234 34,234" fill="#5BA55B" stroke="#3F7D3F" stroke-linejoin="round"/><text class="nb" x="42" y="163" style="fill:#FFFFFF">repeat 4 times</text><rect x="52" y="174" width="170" height="22" rx="4" fill="#4C97FF" stroke="#3373CC"/><text class="nb" x="60" y="189" style="fill:#FFFFFF">Straight  cm:</text><rect x="156" y="177" width="34" height="16" rx="8" fill="#FFFFFF"/><rect x="52" y="198" width="170" height="22" rx="4" fill="#4C97FF" stroke="#3373CC"/><text class="nb" x="60" y="213" style="fill:#FFFFFF">Turn  Deg:</text><rect x="156" y="201" width="34" height="16" rx="8" fill="#FFFFFF"/><text class="ms" x="173" y="213" text-anchor="middle">90</text>
  <text class="sm" x="248" y="164">square #2</text>
  <polygon points="34,244 234,244 234,270 50,270 50,320 154,320 154,332 34,332" fill="#5BA55B" stroke="#3F7D3F" stroke-linejoin="round"/><text class="nb" x="42" y="261" style="fill:#FFFFFF">repeat 4 times</text><rect x="52" y="272" width="170" height="22" rx="4" fill="#4C97FF" stroke="#3373CC"/><text class="nb" x="60" y="287" style="fill:#FFFFFF">Straight  cm:</text><rect x="156" y="275" width="34" height="16" rx="8" fill="#FFFFFF"/><text class="ms" x="173" y="287" text-anchor="middle">30</text><rect x="52" y="296" width="170" height="22" rx="4" fill="#4C97FF" stroke="#3373CC"/><text class="nb" x="60" y="311" style="fill:#FFFFFF">Turn  Deg:</text><rect x="156" y="299" width="34" height="16" rx="8" fill="#FFFFFF"/><text class="ms" x="173" y="311" text-anchor="middle">90</text>
  <text class="sm" x="248" y="262">square #3</text>
  <text class="h" x="350" y="26">A function</text>
  <rect x="350" y="36" width="310" height="306" rx="10" fill="#F8F9FA" stroke="#DEE2E6"/>
  <polygon points="364,48 584,48 584,74 378,74 378,170 494,170 494,182 364,182" fill="#885498" stroke="#6A4377" stroke-linejoin="round"/><text class="nb" x="372" y="65" style="fill:#FFFFFF">to square</text>
  <polygon points="378,78 574,78 574,104 394,104 394,154 496,154 496,166 378,166" fill="#5BA55B" stroke="#3F7D3F" stroke-linejoin="round"/><text class="nb" x="386" y="95" style="fill:#FFFFFF">repeat 4 times</text><rect x="396" y="106" width="170" height="22" rx="4" fill="#4C97FF" stroke="#3373CC"/><text class="nb" x="404" y="121" style="fill:#FFFFFF">Straight  cm:</text><rect x="500" y="109" width="34" height="16" rx="8" fill="#FFFFFF"/><rect x="396" y="130" width="170" height="22" rx="4" fill="#4C97FF" stroke="#3373CC"/><text class="nb" x="404" y="145" style="fill:#FFFFFF">Turn  Deg:</text><rect x="500" y="133" width="34" height="16" rx="8" fill="#FFFFFF"/><text class="ms" x="517" y="145" text-anchor="middle">90</text>
  <text class="sm" x="592" y="65">defined</text><text class="sm" x="592" y="79">once</text>
  <rect x="364" y="196" width="150" height="22" rx="4" fill="#E6A23C" stroke="#B27A20"/><text class="nb" x="372" y="211" style="fill:#FFFFFF">Wait for button press</text>
  <rect x="364" y="222" width="74" height="22" rx="4" fill="#885498" stroke="#6A4377"/><text class="nb" x="374" y="237" style="fill:#FFFFFF">square</text>
  <path d="M 446 233 C 596 233, 634 158, 598 128" fill="none" stroke="#ADB5BD" stroke-width="1.6" stroke-dasharray="4 4" marker-end="url(#aG)"/>
  <rect x="364" y="248" width="74" height="22" rx="4" fill="#885498" stroke="#6A4377"/><text class="nb" x="374" y="263" style="fill:#FFFFFF">square</text>
  <path d="M 446 259 C 588 259, 634 158, 598 128" fill="none" stroke="#ADB5BD" stroke-width="1.6" stroke-dasharray="4 4" marker-end="url(#aG)"/>
  <rect x="364" y="274" width="74" height="22" rx="4" fill="#885498" stroke="#6A4377"/><text class="nb" x="374" y="289" style="fill:#FFFFFF">square</text>
  <path d="M 446 285 C 580 285, 634 158, 598 128" fill="none" stroke="#ADB5BD" stroke-width="1.6" stroke-dasharray="4 4" marker-end="url(#aG)"/>
  <text class="sm" x="446" y="306">called three times</text>
  <g class="anim"><g opacity="0"><animate attributeName="opacity" values="1;0" keyTimes="0;0.2286" calcMode="discrete" dur="14.00s" repeatCount="indefinite"/><text class="ms" x="173" y="91" text-anchor="middle">30</text></g><g opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.2286;0.9999" calcMode="discrete" dur="14.00s" repeatCount="indefinite"/><text class="ms" x="173" y="91" text-anchor="middle" style="fill:#D1182C;font-weight:700">40</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.2286;0.2393;0.3000;1" dur="14.00s" repeatCount="indefinite"/><rect x="152" y="75" width="42" height="24" rx="10" fill="none" stroke="#F2B705" stroke-width="3"/></g><g opacity="0"><animate attributeName="opacity" values="1;0" keyTimes="0;0.3143" calcMode="discrete" dur="14.00s" repeatCount="indefinite"/><text class="ms" x="173" y="189" text-anchor="middle">30</text></g><g opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.3143;0.9999" calcMode="discrete" dur="14.00s" repeatCount="indefinite"/><text class="ms" x="173" y="189" text-anchor="middle" style="fill:#D1182C;font-weight:700">40</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.3143;0.3250;0.3857;1" dur="14.00s" repeatCount="indefinite"/><rect x="152" y="173" width="42" height="24" rx="10" fill="none" stroke="#F2B705" stroke-width="3"/></g><g opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.4000;0.9999" calcMode="discrete" dur="14.00s" repeatCount="indefinite"/><circle cx="173" cy="283" r="20" fill="none" stroke="#D1182C" stroke-width="3"/><text class="nb" x="248" y="288" style="fill:#D1182C">missed</text><text class="nb" x="248" y="304" style="fill:#D1182C">this one</text></g><g opacity="0"><animate attributeName="opacity" values="1;0" keyTimes="0;0.2286" calcMode="discrete" dur="14.00s" repeatCount="indefinite"/><text class="ms" x="517" y="121" text-anchor="middle">30</text></g><g opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.2286;0.9999" calcMode="discrete" dur="14.00s" repeatCount="indefinite"/><text class="ms" x="517" y="121" text-anchor="middle" style="fill:#D1182C;font-weight:700">40</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.2286;0.2393;0.3000;1" dur="14.00s" repeatCount="indefinite"/><rect x="496" y="105" width="42" height="24" rx="10" fill="none" stroke="#F2B705" stroke-width="3"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.2571;0.2679;0.3286;1" dur="14.00s" repeatCount="indefinite"/><path d="M 446 233 C 596 233, 634 158, 598 128" fill="none" stroke="#D1182C" stroke-width="2.4" marker-end="url(#aR)"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.2750;0.2857;0.3464;1" dur="14.00s" repeatCount="indefinite"/><path d="M 446 259 C 588 259, 634 158, 598 128" fill="none" stroke="#D1182C" stroke-width="2.4" marker-end="url(#aR)"/></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.2929;0.3036;0.3643;1" dur="14.00s" repeatCount="indefinite"/><path d="M 446 285 C 580 285, 634 158, 598 128" fill="none" stroke="#D1182C" stroke-width="2.4" marker-end="url(#aR)"/></g><g opacity="0"><animate attributeName="opacity" values="1;0" keyTimes="0;0.1857" calcMode="discrete" dur="14.00s" repeatCount="indefinite"/><text class="nb" x="340" y="364" text-anchor="middle">Both programs draw three 30 cm squares.</text></g><g opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.1857;0.5000" calcMode="discrete" dur="14.00s" repeatCount="indefinite"/><text class="nb" x="340" y="364" text-anchor="middle" style="fill:#D1182C">Change of plan: make the squares 40 cm.</text></g><g opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.5000;0.9999" calcMode="discrete" dur="14.00s" repeatCount="indefinite"/><text class="nb" x="340" y="364" text-anchor="middle">What the robot draws now</text></g><g opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.5429;0.9999" calcMode="discrete" dur="14.00s" repeatCount="indefinite"/><rect x="150" y="360" width="50" height="50" fill="none" stroke="#1F6FEB" stroke-width="3"/><rect x="162" y="372" width="38" height="38" fill="none" stroke="#1F6FEB" stroke-width="3"/><text class="sm" x="210" y="384">two 40 cm squares</text><text class="sm" x="210" y="399" style="fill:#D1182C;font-weight:700">and one 30 cm square</text></g><g opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.5429;0.9999" calcMode="discrete" dur="14.00s" repeatCount="indefinite"/><rect x="470" y="360" width="50" height="50" fill="none" stroke="#1F6FEB" stroke-width="3"/><text class="sm" x="530" y="384">three 40 cm squares,</text><text class="sm" x="530" y="399">drawn on top of each other</text></g><g opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.2286;0.5000" calcMode="discrete" dur="14.00s" repeatCount="indefinite"/><text class="sm" x="175" y="364" text-anchor="middle"> </text></g></g>
  <g class="still"><text class="nb" x="340" y="364" text-anchor="middle">Change 30 to 40: three edits on the left, one on the right.</text></g>
