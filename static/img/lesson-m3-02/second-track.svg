  <text class="code" x="154" y="86">track_to_intersection()</text>
  <rect x="148" y="95" width="180" height="21" rx="4" fill="#FBE3E6" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.18;0.190;0.84;0.850;1" dur="12s" repeatCount="indefinite"/></rect>
