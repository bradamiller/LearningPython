<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 326" width="680" height="326" role="img" aria-labelledby="fT fD">
  <title id="fT">The blocked list across the capstone</title>
  <desc id="fD">Left: the 4 by 4 grid with the robot at home, (0, 0), the bottom-left corner, the four capstone destinations numbered in order, (1, 3), (3, 3), (3, 0) and (0, 0), and three pretend boxes at (1, 0), (2, 2) and (3, 1). Right: Run 1 starts with an empty blocked list. Leg 1 to (1, 3) takes 4 steps and 1 reroute and adds (1, 0). Leg 2 to (3, 3) takes 2 steps. Leg 3 to (3, 0) takes 9 steps and 2 reroutes and adds (3, 1) and (2, 2). Leg 4 home takes 5 steps. Run 1 totals 20 steps and 3 reroutes and prints the list, which you type into KNOWN_OBSTACLES; Run 2 starts with [(1, 0), (3, 1), (2, 2)] and takes 18 steps with 0 reroutes.</desc>
  <style>
    .h   { font-family: Montserrat, Helvetica, Arial, sans-serif; font-size: 14px; font-weight: 700; fill: #22527B; }
    .n   { font-family: Montserrat, Helvetica, Arial, sans-serif; font-size: 12.5px; fill: #343A40; }
    .nb  { font-family: Montserrat, Helvetica, Arial, sans-serif; font-size: 12.5px; font-weight: 700; fill: #142D50; }
    .sm  { font-family: Montserrat, Helvetica, Arial, sans-serif; font-size: 11.5px; fill: #6C757D; }
    .ax  { font-family: Montserrat, Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 700; fill: #6C757D; }
    .m   { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12.5px; font-weight: 700; fill: #142D50; }
    .ms  { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11.5px; font-weight: 600; fill: #343A40; }
  </style>
  <defs>
    <marker id="aB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#22527B"/></marker>
    <marker id="aW" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#FFFFFF"/></marker>
    <marker id="aG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6C757D"/></marker>
    <marker id="aR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D1182C"/></marker>
    <marker id="aGr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E7D32"/></marker>
    <marker id="pcArr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6C757D"/>
    </marker>
    <marker id="pcDim" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,1 L5,5 L0,9" fill="none" stroke="#142D50" stroke-width="1.6"/>
    </marker>

    <!-- The XRP from above, traced from SparkFun's top-view photo. Front is UP.
         Origin = center of rotation (the pen hole between the drive wheels).
         Units: 1 unit = 4 photo px; the sensors are 60 units (8.75 cm) ahead of the origin. -->
    <g id="pcXRP" stroke-linejoin="round">
      <!-- rails out to the front casters -->
      <rect x="-59" y="-80" width="8" height="40" fill="#C3C8CD" stroke="#5F666D" stroke-width="1.3"/>
      <rect x="51"  y="-80" width="8" height="40" fill="#C3C8CD" stroke="#5F666D" stroke-width="1.3"/>
      <!-- main chassis plate -->
      <rect x="-59" y="-46" width="118" height="75" rx="8" fill="#D3D7DB" fill-opacity="0.92" stroke="#5F666D" stroke-width="1.5"/>
      <rect x="-50" y="-38" width="100" height="58" rx="4" fill="#E9ECEF" fill-opacity="0.85" stroke="#9AA1A8" stroke-width="0.8"/>
      <!-- caster bosses at the front corners -->
      <circle cx="-49" cy="-79" r="10" fill="#C3C8CD" stroke="#5F666D" stroke-width="1.3"/>
      <circle cx="49"  cy="-79" r="10" fill="#C3C8CD" stroke="#5F666D" stroke-width="1.3"/>
      <circle cx="-49" cy="-79" r="4.5" fill="#F1EBDD" stroke="#8A7E62" stroke-width="0.8"/>
      <circle cx="49"  cy="-79" r="4.5" fill="#F1EBDD" stroke="#8A7E62" stroke-width="0.8"/>
      <!-- drive wheels -->
      <rect x="-56" y="-21" width="11" height="42" rx="3.5" fill="#2B2B2B"/>
      <rect x="45"  y="-21" width="11" height="42" rx="3.5" fill="#2B2B2B"/>
      <line x1="-50.5" y1="-17" x2="-50.5" y2="17" stroke="#6C757D" stroke-width="1"/>
      <line x1="50.5"  y1="-17" x2="50.5"  y2="17" stroke="#6C757D" stroke-width="1"/>
      <!-- battery latches -->
      <rect x="-40" y="-30" width="6" height="12" rx="2" fill="#F05A28"/>
      <rect x="34"  y="-30" width="6" height="12" rx="2" fill="#F05A28"/>
      <!-- controller board -->
      <rect x="-24" y="-42" width="48" height="37" rx="2" fill="#D1182C"/>
      <rect x="-6" y="-41" width="12" height="35" rx="1" fill="#2B2B2B"/>
      <!-- servo + arm at the back -->
      <rect x="-26" y="22" width="15" height="13" rx="1.5" fill="#2B2B2B"/>
      <rect x="-34" y="24" width="8" height="26" rx="2" fill="#AEB4BA" stroke="#5F666D" stroke-width="1"/>
      <!-- rangefinder bracket, board and the two cylinders -->
      <rect x="-16" y="-58" width="32" height="13" rx="2" fill="#AEB4BA" stroke="#5F666D" stroke-width="1"/>
      <rect x="-18" y="-65" width="36" height="8" rx="1.5" fill="#B5172A"/>
      <circle cx="-8" cy="-68" r="5.5" fill="#E4E7EA" stroke="#868E96" stroke-width="1"/>
      <circle cx="8"  cy="-68" r="5.5" fill="#E4E7EA" stroke="#868E96" stroke-width="1"/>
      <!-- the two line sensors, under the rangefinder (drawn as if seen through it) -->
      <circle cx="-6.5" cy="-60" r="4" fill="#FFD43B" stroke="#142D50" stroke-width="1.4"/>
      <circle cx="6.5"  cy="-60" r="4" fill="#FFD43B" stroke="#142D50" stroke-width="1.4"/>
      <!-- center of rotation: the pen hole -->
      <circle cx="0" cy="0" r="5" fill="#FFFFFF" stroke="#142D50" stroke-width="1.8"/>
      <circle cx="0" cy="0" r="1.8" fill="#142D50"/>
    </g>

    <!-- the same robot after a right turn, as a dashed ghost -->
    <g id="pcGhost" fill="none" stroke="#343A40" stroke-width="1.4" stroke-dasharray="4 3">
      <path d="M -51 -46 V -72 M 51 -46 V -72 M -59 -36 V -79 M 59 -36 V -79 M -59 -46 H 59"/>
      <circle cx="-49" cy="-79" r="10"/>
      <circle cx="49"  cy="-79" r="10"/>
      <rect x="-18" y="-65" width="36" height="8" rx="1.5"/>
      <circle cx="-6.5" cy="-60" r="4.5" fill="#FFFFFF" stroke="#D1182C" stroke-width="2.4" stroke-dasharray="none"/>
      <circle cx="6.5"  cy="-60" r="4.5" fill="#FFFFFF" stroke="#D1182C" stroke-width="2.4" stroke-dasharray="none"/>
    </g>
  </defs>
  <rect width="680" height="326" fill="#FFFFFF"/>
  <text class="h" x="12" y="24">The capstone run</text>
  <rect x="28" y="42" width="210" height="210" rx="8" fill="#F3F4F6" stroke="#DEE2E6"/>
  <rect x="47.5" y="42" width="9" height="210" fill="#2B2B2B"/>
  <rect x="28" y="61.5" width="210" height="9" fill="#2B2B2B"/>
  <rect x="101.5" y="42" width="9" height="210" fill="#2B2B2B"/>
  <rect x="28" y="115.5" width="210" height="9" fill="#2B2B2B"/>
  <rect x="155.5" y="42" width="9" height="210" fill="#2B2B2B"/>
  <rect x="28" y="169.5" width="210" height="9" fill="#2B2B2B"/>
  <rect x="209.5" y="42" width="9" height="210" fill="#2B2B2B"/>
  <rect x="28" y="223.5" width="210" height="9" fill="#2B2B2B"/>
  <rect x="94" y="216" width="24" height="24" rx="3" fill="#C8A26B" stroke="#7A5C2E" stroke-width="1.5"/>
  <rect x="148" y="108" width="24" height="24" rx="3" fill="#C8A26B" stroke="#7A5C2E" stroke-width="1.5"/>
  <rect x="202" y="162" width="24" height="24" rx="3" fill="#C8A26B" stroke="#7A5C2E" stroke-width="1.5"/>
  <use href="#pcXRP" transform="translate(52 228) scale(0.3)"/>
  <circle cx="120" cy="52" r="11" fill="#22527B" stroke="#FFFFFF" stroke-width="2"/><text class="sm" x="120" y="56" text-anchor="middle" style="fill:#FFFFFF;font-weight:700">1</text>
  <circle cx="228" cy="52" r="11" fill="#22527B" stroke="#FFFFFF" stroke-width="2"/><text class="sm" x="228" y="56" text-anchor="middle" style="fill:#FFFFFF;font-weight:700">2</text>
  <circle cx="228" cy="214" r="11" fill="#22527B" stroke="#FFFFFF" stroke-width="2"/><text class="sm" x="228" y="218" text-anchor="middle" style="fill:#FFFFFF;font-weight:700">3</text>
  <circle cx="74" cy="250" r="11" fill="#22527B" stroke="#FFFFFF" stroke-width="2"/><text class="sm" x="74" y="254" text-anchor="middle" style="fill:#FFFFFF;font-weight:700">4</text>
  <text class="sm" x="12" y="290">CAPSTONE_DESTINATIONS, in order;</text><text class="sm" x="12" y="306">boxes = SIMULATED_OBSTACLES</text>
  <text class="h" x="250" y="24">The blocked list is the thread</text>
  <text class="nb" x="250" y="52">Run 1, starting from []</text>
  <rect x="250" y="66" width="130" height="36" rx="6" fill="#F1F6FB" stroke="#22527B" stroke-width="1.4"/><text class="nb" x="258" y="81">leg 1 <tspan class="ms" style="font-size:11px">→ (1, 3)</tspan></text><text class="sm" x="258" y="96">4 steps, 1 reroute</text>
  <line x1="382" y1="84" x2="400" y2="84" stroke="#C77C02" stroke-width="1.6" marker-end="url(#aG)"/>
  <rect x="404" y="72" width="54" height="24" rx="5" fill="#FFE3A8" stroke="#C77C02" stroke-width="2"/><text class="ms" x="431" y="88" text-anchor="middle" style="font-size:11px">(1,0)</text>
  <rect x="250" y="110" width="130" height="36" rx="6" fill="#F1F6FB" stroke="#22527B" stroke-width="1.4"/><text class="nb" x="258" y="125">leg 2 <tspan class="ms" style="font-size:11px">→ (3, 3)</tspan></text><text class="sm" x="258" y="140">2 steps</text>
  <line x1="382" y1="128" x2="400" y2="128" stroke="#C77C02" stroke-width="1.6" marker-end="url(#aG)"/>
  <rect x="404" y="116" width="54" height="24" rx="5" fill="#FFF8E8" stroke="#C77C02" stroke-width="1.2"/><text class="ms" x="431" y="132" text-anchor="middle" style="font-size:11px">(1,0)</text>
  <rect x="250" y="154" width="130" height="36" rx="6" fill="#F1F6FB" stroke="#22527B" stroke-width="1.4"/><text class="nb" x="258" y="169">leg 3 <tspan class="ms" style="font-size:11px">→ (3, 0)</tspan></text><text class="sm" x="258" y="184">9 steps, 2 reroutes</text>
  <line x1="382" y1="172" x2="400" y2="172" stroke="#C77C02" stroke-width="1.6" marker-end="url(#aG)"/>
  <rect x="404" y="160" width="54" height="24" rx="5" fill="#FFF8E8" stroke="#C77C02" stroke-width="1.2"/><text class="ms" x="431" y="176" text-anchor="middle" style="font-size:11px">(1,0)</text>
  <rect x="462" y="160" width="54" height="24" rx="5" fill="#FFE3A8" stroke="#C77C02" stroke-width="2"/><text class="ms" x="489" y="176" text-anchor="middle" style="font-size:11px">(3,1)</text>
  <rect x="520" y="160" width="54" height="24" rx="5" fill="#FFE3A8" stroke="#C77C02" stroke-width="2"/><text class="ms" x="547" y="176" text-anchor="middle" style="font-size:11px">(2,2)</text>
  <rect x="250" y="198" width="130" height="36" rx="6" fill="#F1F6FB" stroke="#22527B" stroke-width="1.4"/><text class="nb" x="258" y="213">leg 4 <tspan class="ms" style="font-size:11px">→ (0, 0)</tspan></text><text class="sm" x="258" y="228">5 steps</text>
  <line x1="382" y1="216" x2="400" y2="216" stroke="#C77C02" stroke-width="1.6" marker-end="url(#aG)"/>
  <rect x="404" y="204" width="54" height="24" rx="5" fill="#FFF8E8" stroke="#C77C02" stroke-width="1.2"/><text class="ms" x="431" y="220" text-anchor="middle" style="font-size:11px">(1,0)</text>
  <rect x="462" y="204" width="54" height="24" rx="5" fill="#FFF8E8" stroke="#C77C02" stroke-width="1.2"/><text class="ms" x="489" y="220" text-anchor="middle" style="font-size:11px">(3,1)</text>
  <rect x="520" y="204" width="54" height="24" rx="5" fill="#FFF8E8" stroke="#C77C02" stroke-width="1.2"/><text class="ms" x="547" y="220" text-anchor="middle" style="font-size:11px">(2,2)</text>
  <text class="sm" x="250" y="252">Run 1: 20 steps, 3 reroutes. It prints the list at the end;</text>
  <text class="sm" x="250" y="268">you type it into KNOWN_OBSTACLES.</text>
  <rect x="250" y="280" width="418" height="34" rx="6" fill="#F2F8F2" stroke="#2E7D32" stroke-width="1.6"/><text class="nb" x="260" y="302">Run 2 starts with <tspan class="ms" style="font-size:11.5px">[(1,0), (3,1), (2,2)]</tspan>: 18 steps, 0 reroutes</text>
</svg>
