  <g><circle cx="338.4" cy="240.0" r="9" fill="#FFFFFF" stroke="#7B4FA0" stroke-width="3"/><path d="M 324.4 240.0 h 28 M 338.4 226.0 v 28" stroke="#7B4FA0" stroke-width="2.4"/><circle cx="338.4" cy="240.0" r="3" fill="#7B4FA0"/></g>
  <text class="nb halo" x="338.4" y="312.0" text-anchor="middle" style="fill:#7B4FA0">turning center, off the robot</text>
  <text class="nb" x="40" y="70">Left side: forward, fast</text><text class="nb" x="640" y="70" text-anchor="end">Right side: forward, slow</text>
  <text class="sm" x="340" y="330" text-anchor="middle">Blue: the path of the point midway between the wheels. Purple: the point it turns around.</text>
</svg>
