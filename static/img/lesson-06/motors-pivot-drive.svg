  <g opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.1362;0.9985" calcMode="discrete" dur="6.61s" repeatCount="indefinite"/><circle cx="342.1" cy="230.0" r="37.9" fill="none" stroke="#1F6FEB" stroke-width="1.5" stroke-dasharray="3 6" opacity="0.6"/><g><circle cx="342.1" cy="230.0" r="9" fill="#FFFFFF" stroke="#7B4FA0" stroke-width="3"/><path d="M 328.1 230.0 h 28 M 342.1 216.0 v 28" stroke="#7B4FA0" stroke-width="2.4"/><circle cx="342.1" cy="230.0" r="3" fill="#7B4FA0"/></g><text class="nb halo" x="342.1" y="312.0" text-anchor="middle" style="fill:#7B4FA0">turning center: the stopped wheel</text><text class="sm" x="340" y="330" text-anchor="middle">Blue: the path of the point midway between the wheels. Purple: the point it turns around.</text></g>
  <text class="nb" x="40" y="70">Left side: stopped</text><text class="nb" x="640" y="70" text-anchor="end">Right side: forward</text>
</svg>
