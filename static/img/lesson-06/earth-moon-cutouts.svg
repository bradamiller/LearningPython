<svg xmlns="http://www.w3.org/2000/svg" width="8.5in" height="11in" viewBox="0 0 816 1056"
     role="img" aria-labelledby="em-title em-desc"
     font-family="Montserrat, Helvetica, Arial, sans-serif">
  <title id="em-title">Printable Earth and Moon markers for the Earth–Moon–Earth activity</title>
  <desc id="em-desc">A US Letter sheet holding an Earth disc and a Moon disc, both the same size,
  about three inches across, each with a cut line and a centre cross, for taping to a whiteboard
  panel as the two bodies the robot orbits in Lesson 1-6.</desc>

  <style>
    .cut  { fill: none; stroke: #ADB5BD; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .name { font-size: 20px; font-weight: 800; letter-spacing: 1.5px; }
    .hdr  { font-size: 19px; font-weight: 800; fill: #22527B; letter-spacing: .5px; }
    .note { font-size: 13.5px; fill: #495057; }
  </style>

  <defs>
    <!-- Keeps the invented landmasses inside the disc, so nothing crosses the cut line. -->
    <clipPath id="earthClip"><circle cx="0" cy="0" r="144"/></clipPath>
  </defs>

  <rect width="816" height="1056" fill="#fff"/>

  <text class="hdr" x="64" y="80">EARTH – MOON – EARTH · LESSON 1-6</text>
  <text class="note" x="64" y="110">Cut both discs out along the dashed line and tape them to your
    whiteboard panel, about 18–24 inches</text>
  <text class="note" x="64" y="132">(45–60 cm) apart. The little cross marks the centre — that's the
    point your robot orbits around.</text>

  <!-- ===== EARTH — 3 inches across ===== -->
  <g transform="translate(232,560)">
    <circle class="cut" r="156"/>
    <circle r="144" fill="#1B6CA8"/>
    <g clip-path="url(#earthClip)">
      <!-- stylised and invented: not a map of anywhere -->
      <path d="M-112 -52 q30 -41 71 -30 q41 11 30 45 q-9 28 -45 25 q-39 -3 -56 -40z" fill="#3E8E5A"/>
      <path d="M-30 19 q38 -22 71 4 q30 22 8 52 q-24 32 -60 15 q-34 -16 -19 -71z" fill="#3E8E5A"/>
      <path d="M45 -90 q45 -15 67 19 q17 25 -13 39 q-36 16 -62 -14 q-18 -22 8 -44z" fill="#3E8E5A"/>
      <path d="M-131 90 q45 15 60 45 q9 20 -17 25 q-37 9 -58 -25 q-14 -24 15 -45z" fill="#3E8E5A"/>
      <ellipse cx="-52" cy="-118" rx="52" ry="20" fill="#EAF2F8" opacity=".55"/>
      <ellipse cx="72" cy="96" rx="62" ry="22" fill="#EAF2F8" opacity=".45"/>
    </g>
    <circle r="144" fill="none" stroke="#12496F" stroke-width="4"/>
    <line x1="-16" y1="0" x2="16" y2="0" stroke="#fff" stroke-width="2.5"/>
    <line x1="0" y1="-16" x2="0" y2="16" stroke="#fff" stroke-width="2.5"/>
    <text class="name" x="0" y="-36" text-anchor="middle" fill="#fff">EARTH</text>
  </g>

  <!-- ===== MOON — the same 3 inches across ===== -->
  <g transform="translate(584,560)">
    <circle class="cut" r="156"/>
    <circle r="144" fill="#B9BEC4"/>
    <circle cx="-50" cy="-44" r="34" fill="#9BA1A8"/>
    <circle cx="40" cy="-76" r="19" fill="#9BA1A8"/>
    <circle cx="66" cy="28" r="28" fill="#9BA1A8"/>
    <circle cx="-20" cy="78" r="16" fill="#9BA1A8"/>
    <circle cx="-86" cy="46" r="12" fill="#9BA1A8"/>
    <circle cx="14" cy="-8" r="9" fill="#9BA1A8"/>
    <circle r="144" fill="none" stroke="#8B9197" stroke-width="4"/>
    <line x1="-16" y1="0" x2="16" y2="0" stroke="#5B6166" stroke-width="2.5"/>
    <line x1="0" y1="-16" x2="0" y2="16" stroke="#5B6166" stroke-width="2.5"/>
    <text class="name" x="0" y="-36" text-anchor="middle" fill="#495057">MOON</text>
  </g>

  <text class="note" x="64" y="980">Both the same size on purpose, so your two orbits are the same
    size too. Nothing here is to scale: the real</text>
  <text class="note" x="64" y="1002">Moon is about a quarter of Earth's width, and thirty Earths
    would fit in the gap between them.</text>
</svg>
