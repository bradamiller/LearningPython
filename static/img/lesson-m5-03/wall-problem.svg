<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340" width="680" height="340" role="img" aria-labelledby="fT fD" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="fT">A wall between S and D</title>
  <desc id="fD">A 4 by 4 grid graph. S is the top-left intersection, (0, 0); D is (3, 0), straight down column 0. Intersections (1, 0) and (1, 1) are blocked and crossed out, with their edges removed. Your reader sees one intersection and its open neighbors at a time, never the whole grid.</desc>
  <style>
    .h   { font-family: Montserrat, Helvetica, Arial, sans-serif; font-size: 14px; font-weight: 700; fill: #22527B; }
    .n   { font-family: Montserrat, Helvetica, Arial, sans-serif; font-size: 12.5px; fill: #343A40; }
    .nb  { font-family: Montserrat, Helvetica, Arial, sans-serif; font-size: 12.5px; font-weight: 700; fill: #142D50; }
    .sm  { font-family: Montserrat, Helvetica, Arial, sans-serif; font-size: 11.5px; fill: #6C757D; }
    .ax  { font-family: Montserrat, Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 700; fill: #6C757D; }
    .m   { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12.5px; font-weight: 700; fill: #142D50; }
    .ms  { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11.5px; font-weight: 600; fill: #343A40; }
  </style>
  <defs>
    <marker id="aB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#22527B"/></marker>
    <marker id="aW" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#FFFFFF"/></marker>
    <marker id="aG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6C757D"/></marker>
    <marker id="aR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D1182C"/></marker>
    <marker id="aGr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E7D32"/></marker>
    <marker id="pcArr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6C757D"/>
    </marker>
    <marker id="pcDim" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,1 L5,5 L0,9" fill="none" stroke="#142D50" stroke-width="1.6"/>
    </marker>

    <!-- The XRP from above, traced from SparkFun's top-view photo. Front is UP.
         Origin = center of rotation (the pen hole between the drive wheels).
         Units: 1 unit = 4 photo px; the sensors are 60 units (8.75 cm) ahead of the origin. -->
    <g id="pcXRP" stroke-linejoin="round">
      <!-- rails out to the front casters -->
      <rect x="-59" y="-80" width="8" height="40" fill="#C3C8CD" stroke="#5F666D" stroke-width="1.3"/>
      <rect x="51"  y="-80" width="8" height="40" fill="#C3C8CD" stroke="#5F666D" stroke-width="1.3"/>
      <!-- main chassis plate -->
      <rect x="-59" y="-46" width="118" height="75" rx="8" fill="#D3D7DB" fill-opacity="0.92" stroke="#5F666D" stroke-width="1.5"/>
      <rect x="-50" y="-38" width="100" height="58" rx="4" fill="#E9ECEF" fill-opacity="0.85" stroke="#9AA1A8" stroke-width="0.8"/>
      <!-- caster bosses at the front corners -->
      <circle cx="-49" cy="-79" r="10" fill="#C3C8CD" stroke="#5F666D" stroke-width="1.3"/>
      <circle cx="49"  cy="-79" r="10" fill="#C3C8CD" stroke="#5F666D" stroke-width="1.3"/>
      <circle cx="-49" cy="-79" r="4.5" fill="#F1EBDD" stroke="#8A7E62" stroke-width="0.8"/>
      <circle cx="49"  cy="-79" r="4.5" fill="#F1EBDD" stroke="#8A7E62" stroke-width="0.8"/>
      <!-- drive wheels -->
      <rect x="-56" y="-21" width="11" height="42" rx="3.5" fill="#2B2B2B"/>
      <rect x="45"  y="-21" width="11" height="42" rx="3.5" fill="#2B2B2B"/>
      <line x1="-50.5" y1="-17" x2="-50.5" y2="17" stroke="#6C757D" stroke-width="1"/>
      <line x1="50.5"  y1="-17" x2="50.5"  y2="17" stroke="#6C757D" stroke-width="1"/>
      <!-- battery latches -->
      <rect x="-40" y="-30" width="6" height="12" rx="2" fill="#F05A28"/>
      <rect x="34"  y="-30" width="6" height="12" rx="2" fill="#F05A28"/>
      <!-- controller board -->
      <rect x="-24" y="-42" width="48" height="37" rx="2" fill="#D1182C"/>
      <rect x="-6" y="-41" width="12" height="35" rx="1" fill="#2B2B2B"/>
      <!-- servo + arm at the back -->
      <rect x="-26" y="22" width="15" height="13" rx="1.5" fill="#2B2B2B"/>
      <rect x="-34" y="24" width="8" height="26" rx="2" fill="#AEB4BA" stroke="#5F666D" stroke-width="1"/>
      <!-- rangefinder bracket, board and the two cylinders -->
      <rect x="-16" y="-58" width="32" height="13" rx="2" fill="#AEB4BA" stroke="#5F666D" stroke-width="1"/>
      <rect x="-18" y="-65" width="36" height="8" rx="1.5" fill="#B5172A"/>
      <circle cx="-8" cy="-68" r="5.5" fill="#E4E7EA" stroke="#868E96" stroke-width="1"/>
      <circle cx="8"  cy="-68" r="5.5" fill="#E4E7EA" stroke="#868E96" stroke-width="1"/>
      <!-- the two line sensors, under the rangefinder (drawn as if seen through it) -->
      <circle cx="-6.5" cy="-60" r="4" fill="#FFD43B" stroke="#142D50" stroke-width="1.4"/>
      <circle cx="6.5"  cy="-60" r="4" fill="#FFD43B" stroke="#142D50" stroke-width="1.4"/>
      <!-- center of rotation: the pen hole -->
      <circle cx="0" cy="0" r="5" fill="#FFFFFF" stroke="#142D50" stroke-width="1.8"/>
      <circle cx="0" cy="0" r="1.8" fill="#142D50"/>
    </g>

    <!-- the same robot after a right turn, as a dashed ghost -->
    <g id="pcGhost" fill="none" stroke="#343A40" stroke-width="1.4" stroke-dasharray="4 3">
      <path d="M -51 -46 V -72 M 51 -46 V -72 M -59 -36 V -79 M 59 -36 V -79 M -59 -46 H 59"/>
      <circle cx="-49" cy="-79" r="10"/>
      <circle cx="49"  cy="-79" r="10"/>
      <rect x="-18" y="-65" width="36" height="8" rx="1.5"/>
      <circle cx="-6.5" cy="-60" r="4.5" fill="#FFFFFF" stroke="#D1182C" stroke-width="2.4" stroke-dasharray="none"/>
      <circle cx="6.5"  cy="-60" r="4.5" fill="#FFFFFF" stroke="#D1182C" stroke-width="2.4" stroke-dasharray="none"/>
    </g>
  </defs>
  <rect width="680" height="340" fill="#FFFFFF"/>
  <text class="h" x="20" y="28">Write a rule that gets from S to D</text>
  <line x1="80" y1="80" x2="156" y2="80" stroke="#495057" stroke-width="4"/>
  <line x1="156" y1="80" x2="232" y2="80" stroke="#495057" stroke-width="4"/>
  <line x1="232" y1="80" x2="308" y2="80" stroke="#495057" stroke-width="4"/>
  <line x1="232" y1="80" x2="232" y2="156" stroke="#495057" stroke-width="4"/>
  <line x1="308" y1="80" x2="308" y2="156" stroke="#495057" stroke-width="4"/>
  <line x1="232" y1="156" x2="308" y2="156" stroke="#495057" stroke-width="4"/>
  <line x1="232" y1="156" x2="232" y2="232" stroke="#495057" stroke-width="4"/>
  <line x1="308" y1="156" x2="308" y2="232" stroke="#495057" stroke-width="4"/>
  <line x1="80" y1="232" x2="156" y2="232" stroke="#495057" stroke-width="4"/>
  <line x1="80" y1="232" x2="80" y2="308" stroke="#495057" stroke-width="4"/>
  <line x1="156" y1="232" x2="232" y2="232" stroke="#495057" stroke-width="4"/>
  <line x1="156" y1="232" x2="156" y2="308" stroke="#495057" stroke-width="4"/>
  <line x1="232" y1="232" x2="308" y2="232" stroke="#495057" stroke-width="4"/>
  <line x1="232" y1="232" x2="232" y2="308" stroke="#495057" stroke-width="4"/>
  <line x1="308" y1="232" x2="308" y2="308" stroke="#495057" stroke-width="4"/>
  <line x1="80" y1="308" x2="156" y2="308" stroke="#495057" stroke-width="4"/>
  <line x1="156" y1="308" x2="232" y2="308" stroke="#495057" stroke-width="4"/>
  <line x1="232" y1="308" x2="308" y2="308" stroke="#495057" stroke-width="4"/>
  <circle cx="80" cy="80" r="18" fill="#142D50" stroke="#142D50" stroke-width="2.4"/>
  <text class="ms" x="80" y="84" text-anchor="middle" style="font-size:13px;font-weight:800;fill:#FFFFFF">S</text>
  <circle cx="156" cy="80" r="18" fill="#FFFFFF" stroke="#22527B" stroke-width="2.4"/>
  <text class="ms" x="156" y="84" text-anchor="middle" style="font-size:10.5px">0,1</text>
  <circle cx="232" cy="80" r="18" fill="#FFFFFF" stroke="#22527B" stroke-width="2.4"/>
  <text class="ms" x="232" y="84" text-anchor="middle" style="font-size:10.5px">0,2</text>
  <circle cx="308" cy="80" r="18" fill="#FFFFFF" stroke="#22527B" stroke-width="2.4"/>
  <text class="ms" x="308" y="84" text-anchor="middle" style="font-size:10.5px">0,3</text>
  <circle cx="80" cy="156" r="18" fill="#F8F9FA" stroke="#ADB5BD" stroke-width="1.6" stroke-dasharray="3 3"/>
  <path d="M 70 146 L 90 166 M 90 146 L 70 166" stroke="#D1182C" stroke-width="3.2" stroke-linecap="round"/>
  <circle cx="156" cy="156" r="18" fill="#F8F9FA" stroke="#ADB5BD" stroke-width="1.6" stroke-dasharray="3 3"/>
  <path d="M 146 146 L 166 166 M 166 146 L 146 166" stroke="#D1182C" stroke-width="3.2" stroke-linecap="round"/>
  <circle cx="232" cy="156" r="18" fill="#FFFFFF" stroke="#22527B" stroke-width="2.4"/>
  <text class="ms" x="232" y="160" text-anchor="middle" style="font-size:10.5px">1,2</text>
  <circle cx="308" cy="156" r="18" fill="#FFFFFF" stroke="#22527B" stroke-width="2.4"/>
  <text class="ms" x="308" y="160" text-anchor="middle" style="font-size:10.5px">1,3</text>
  <circle cx="80" cy="232" r="18" fill="#FFFFFF" stroke="#22527B" stroke-width="2.4"/>
  <text class="ms" x="80" y="236" text-anchor="middle" style="font-size:10.5px">2,0</text>
  <circle cx="156" cy="232" r="18" fill="#FFFFFF" stroke="#22527B" stroke-width="2.4"/>
  <text class="ms" x="156" y="236" text-anchor="middle" style="font-size:10.5px">2,1</text>
  <circle cx="232" cy="232" r="18" fill="#FFFFFF" stroke="#22527B" stroke-width="2.4"/>
  <text class="ms" x="232" y="236" text-anchor="middle" style="font-size:10.5px">2,2</text>
  <circle cx="308" cy="232" r="18" fill="#FFFFFF" stroke="#22527B" stroke-width="2.4"/>
  <text class="ms" x="308" y="236" text-anchor="middle" style="font-size:10.5px">2,3</text>
  <circle cx="80" cy="308" r="18" fill="#2E7D32" stroke="#2E7D32" stroke-width="2.4"/>
  <text class="ms" x="80" y="312" text-anchor="middle" style="font-size:13px;font-weight:800;fill:#FFFFFF">D</text>
  <circle cx="156" cy="308" r="18" fill="#FFFFFF" stroke="#22527B" stroke-width="2.4"/>
  <text class="ms" x="156" y="312" text-anchor="middle" style="font-size:10.5px">3,1</text>
  <circle cx="232" cy="308" r="18" fill="#FFFFFF" stroke="#22527B" stroke-width="2.4"/>
  <text class="ms" x="232" y="312" text-anchor="middle" style="font-size:10.5px">3,2</text>
  <circle cx="308" cy="308" r="18" fill="#FFFFFF" stroke="#22527B" stroke-width="2.4"/>
  <text class="ms" x="308" y="312" text-anchor="middle" style="font-size:10.5px">3,3</text>
  <text class="n" x="410" y="110">Start at S, (0, 0). The destination</text>
  <text class="n" x="410" y="127">D, (3, 0), is straight down column 0,</text>
  <text class="n" x="410" y="144">and (1, 0) and (1, 1) are blocked.</text>
  <text class="nb" x="410" y="184">The catch:</text>
  <text class="n" x="410" y="204">your reader sees one intersection</text>
  <text class="n" x="410" y="221">and its open neighbors at a time,</text>
  <text class="n" x="410" y="238">never the whole grid.</text>
</svg>
