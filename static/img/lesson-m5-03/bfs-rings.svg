<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" role="img"
     aria-labelledby="bfsTitle bfsDesc">
  <title id="bfsTitle">Breadth-first search as ripples: ring numbers on a 3 by 3 grid with the center blocked</title>
  <desc id="bfsDesc">Left: a 3 by 3 grid of intersections. The start at the top-left is numbered 0. Its two
    neighbors are numbered 1, the two corners beyond them 2, the next two 3, and the bottom-right
    destination 4. The center intersection is crossed out and has no number. Right: the same grid
    with a small arrow on each numbered intersection pointing back to the one it was reached from,
    and the walk-back from the destination to the start highlighted: 4 to 3 to 2 to 1 to 0 down the
    left side and along the bottom.</desc>

  <style>
    .lbl   { font-family: Montserrat, Helvetica, Arial, sans-serif; font-size: 14px; font-weight: 700; fill: #22527B; }
    .note  { font-family: Montserrat, Helvetica, Arial, sans-serif; font-size: 12px; fill: #6C757D; }
    .coord { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 10.5px; fill: #6C757D; }
    .ring  { font-family: Montserrat, Helvetica, Arial, sans-serif; font-size: 18px; font-weight: 700; fill: #FFFFFF; text-anchor: middle; }
    .grid  { stroke: #ADB5BD; stroke-width: 2; }
    .path  { stroke: #D1182C; stroke-width: 5; fill: none; stroke-linecap: round; stroke-linejoin: round; opacity: 0.9; }
  </style>

  <rect x="0" y="0" width="720" height="300" fill="#FFFFFF"/>

  <defs>
    <marker id="back" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#343A40"/>
    </marker>
  </defs>

  <!-- ============ LEFT: ring numbers ============ -->
  <text class="lbl" x="150" y="18" text-anchor="middle">Ripples: how far from the start</text>
  <g transform="translate(60,62)">
    <!-- grid lines between intersections: centers at 0,90,180 -->
    <path class="grid" d="M 0 0 H 180 M 0 90 H 180 M 0 180 H 180 M 0 0 V 180 M 90 0 V 180 M 180 0 V 180"/>
    <!-- column / row coordinates -->
    <text class="coord" x="0" y="-28" text-anchor="middle">col 0</text>
    <text class="coord" x="90" y="-28" text-anchor="middle">col 1</text>
    <text class="coord" x="180" y="-28" text-anchor="middle">col 2</text>
    <text class="coord" x="-26" y="4" text-anchor="end">row 0</text>
    <text class="coord" x="-26" y="94" text-anchor="end">row 1</text>
    <text class="coord" x="-26" y="184" text-anchor="end">row 2</text>
    <!-- intersections: ring colors -->
    <g>
      <circle cx="0"   cy="0"   r="17" fill="#22527B"/><text class="ring" x="0"   y="6">0</text>
      <circle cx="90"  cy="0"   r="17" fill="#2E6FA3"/><text class="ring" x="90"  y="6">1</text>
      <circle cx="0"   cy="90"  r="17" fill="#2E6FA3"/><text class="ring" x="0"   y="96">1</text>
      <circle cx="180" cy="0"   r="17" fill="#4A90D9"/><text class="ring" x="180" y="6">2</text>
      <circle cx="0"   cy="180" r="17" fill="#4A90D9"/><text class="ring" x="0"   y="186">2</text>
      <circle cx="180" cy="90"  r="17" fill="#6FA8E0"/><text class="ring" x="180" y="96">3</text>
      <circle cx="90"  cy="180" r="17" fill="#6FA8E0"/><text class="ring" x="90"  y="186">3</text>
      <circle cx="180" cy="180" r="17" fill="#D1182C"/><text class="ring" x="180" y="186">4</text>
      <!-- blocked center -->
      <circle cx="90" cy="90" r="17" fill="#F8F9FA" stroke="#ADB5BD" stroke-width="2"/>
      <path d="M 80 80 L 100 100 M 100 80 L 80 100" stroke="#343A40" stroke-width="3" stroke-linecap="round"/>
    </g>
  </g>
  <text class="note" x="150" y="276" text-anchor="middle">Every ring is one step further out.</text>
  <text class="note" x="150" y="292" text-anchor="middle">The X never gets a number.</text>

  <!-- ============ RIGHT: came-from arrows + walk-back ============ -->
  <text class="lbl" x="530" y="18" text-anchor="middle">Came from: walking back to the start</text>
  <g transform="translate(440,62)">
    <path class="grid" d="M 0 0 H 180 M 0 90 H 180 M 0 180 H 180 M 0 0 V 180 M 90 0 V 180 M 180 0 V 180"/>
    <!-- the walk-back path, drawn under the circles -->
    <path class="path" d="M 180 180 L 90 180 L 0 180 L 0 90 L 0 0"/>
    <!-- came-from arrows (short, from each intersection toward its previous) -->
    <g stroke="#343A40" stroke-width="2" fill="none" marker-end="url(#back)">
      <path d="M 70 0 L 38 0"/>        <!-- (0,1) <- (0,0) -->
      <path d="M 0 70 L 0 38"/>        <!-- (1,0) <- (0,0) -->
      <path d="M 160 0 L 128 0"/>      <!-- (0,2) <- (0,1) -->
      <path d="M 0 160 L 0 128"/>      <!-- (2,0) <- (1,0) -->
      <path d="M 180 70 L 180 38"/>    <!-- (1,2) <- (0,2) -->
      <path d="M 70 180 L 38 180"/>    <!-- (2,1) <- (2,0) -->
      <path d="M 160 180 L 128 180"/>  <!-- (2,2) <- (2,1) -->
    </g>
    <g>
      <circle cx="0"   cy="0"   r="17" fill="#22527B"/><text class="ring" x="0"   y="6">0</text>
      <circle cx="90"  cy="0"   r="17" fill="#2E6FA3"/><text class="ring" x="90"  y="6">1</text>
      <circle cx="0"   cy="90"  r="17" fill="#2E6FA3"/><text class="ring" x="0"   y="96">1</text>
      <circle cx="180" cy="0"   r="17" fill="#4A90D9"/><text class="ring" x="180" y="6">2</text>
      <circle cx="0"   cy="180" r="17" fill="#4A90D9"/><text class="ring" x="0"   y="186">2</text>
      <circle cx="180" cy="90"  r="17" fill="#6FA8E0"/><text class="ring" x="180" y="96">3</text>
      <circle cx="90"  cy="180" r="17" fill="#6FA8E0"/><text class="ring" x="90"  y="186">3</text>
      <circle cx="180" cy="180" r="17" fill="#D1182C"/><text class="ring" x="180" y="186">4</text>
      <circle cx="90" cy="90" r="17" fill="#F8F9FA" stroke="#ADB5BD" stroke-width="2"/>
      <path d="M 80 80 L 100 100 M 100 80 L 80 100" stroke="#343A40" stroke-width="3" stroke-linecap="round"/>
    </g>
  </g>
  <text class="note" x="530" y="276" text-anchor="middle">4 came from 3, which came from 2, 1, 0.</text>
  <text class="note" x="530" y="292" text-anchor="middle">Read forward: (1,0), (2,0), (2,1), (2,2).</text>
</svg>
