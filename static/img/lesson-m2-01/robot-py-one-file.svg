<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 470" width="680" height="470" role="img"
     aria-labelledby="ofTitle ofDesc" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="ofTitle">robot.py: one file for the whole course</title>
  <desc id="ofDesc">On the left, robot.py is drawn as one long sheet of paper divided into
    stacked sections. At the top is setup (imports and the sensor, drivetrain and board
    objects). Below it, one band per module: Module 2 line tracking, holding the LINE SENSOR
    and LINE TRACKING sections; Module 3 grid driving; Module 4 Manhattan planning and the
    navigator; Module 5 pathfinding around obstacles with BFS; and an optional, dashed Module 6
    for Dijkstra. The RUN block is always last, at the bottom of the file. On the right, a
    zoomed-in view of the LINE SENSOR section shows its banner and comment, then its functions
    (get_left, get_right, get_error, is_either_on_line, is_at_cross), then its tests
    (test_sensors, test_drive_to_line, test_bounce). get_left, get_right and test_sensors are
    marked as the ones written today in Lesson 2-1.</desc>

  <defs>
    <!-- a gentle wobble so the shapes look sketched, not ruled -->
    <filter id="sketch" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="3.2"/>
    </filter>
    <filter id="sketchSoft" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
  </defs>

  <style>
    .t     { font-family: Montserrat, Helvetica, Arial, sans-serif; }
    .mono  { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .band  { font-size: 13px; font-weight: 700; fill: #142D50; }
    .desc  { font-size: 12px; fill: #495057; }
    .chip  { font-size: 12px; font-weight: 700; fill: #142D50; }
    .chipD { font-size: 12px; fill: #495057; }
    .head  { font-size: 12px; font-weight: 700; letter-spacing: 0.06em; fill: #22527B; }
    .fn    { font-size: 12.5px; fill: #343A40; }
    .fnDim { font-size: 12.5px; fill: #8A939B; }
    .later { font-size: 11.5px; font-style: italic; fill: #8A939B; }
    .today { font-size: 11.5px; font-weight: 700; fill: #FFFFFF; }
  </style>

  <rect x="0" y="0" width="680" height="470" fill="#FFFFFF"/>

  <!-- ============================ ZOOM WEDGE ============================ -->
  <!-- drawn first so it sits behind both the sheet and the panel -->
  <path d="M 302 112 L 376 30 L 376 452 L 302 136 Z" fill="#FBE3E6" opacity="0.55"/>
  <g filter="url(#sketchSoft)" stroke="#D1182C" stroke-width="1.6" stroke-dasharray="5 4" fill="none">
    <path d="M 302 112 L 376 30"/>
    <path d="M 302 136 L 376 452"/>
  </g>

  <!-- ============================ THE FILE ============================== -->
  <!-- tab with the file name -->
  <g filter="url(#sketch)">
    <rect x="16" y="10" width="112" height="30" rx="6" fill="#142D50"/>
  </g>
  <text class="mono" x="72" y="30" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">robot.py</text>

  <!-- the sheet, with a folded corner -->
  <g filter="url(#sketch)">
    <path d="M 16 36 H 292 L 316 60 V 448 H 16 Z" fill="#FFFFFF" stroke="#343A40" stroke-width="2.2"/>
    <path d="M 292 36 V 60 H 316" fill="#E9ECEF" stroke="#343A40" stroke-width="2"/>
  </g>

  <!-- setup -->
  <g filter="url(#sketchSoft)">
    <rect x="28" y="48" width="262" height="28" rx="5" fill="#E9ECEF"/>
  </g>
  <text class="t desc" x="40" y="67">imports + sensor, drivetrain, board</text>

  <!-- Module 2 -->
  <g filter="url(#sketch)">
    <rect x="28" y="84" width="276" height="88" rx="7" fill="#FBE3E6" stroke="#D1182C" stroke-width="1.6"/>
  </g>
  <text class="t band" x="40" y="102">Module 2 · Line tracking</text>
  <g filter="url(#sketchSoft)">
    <rect x="38" y="112" width="264" height="24" rx="5" fill="#FFFFFF" stroke="#D1182C" stroke-width="2.4"/>
    <rect x="38" y="142" width="256" height="24" rx="5" fill="#FFFFFF" stroke="#E7A3AC" stroke-width="1.4"/>
  </g>
  <text class="mono chip" x="48" y="128">LINE SENSOR</text>
  <text class="t chipD" x="140" y="128">read the sensors</text>
  <text class="mono chip" x="48" y="158">LINE TRACKING</text>
  <text class="t chipD" x="156" y="158">follow the line</text>

  <!-- Module 3 -->
  <g filter="url(#sketch)">
    <rect x="28" y="180" width="262" height="46" rx="7" fill="#DCE8F3" stroke="#22527B" stroke-width="1.4"/>
  </g>
  <text class="t band" x="40" y="198">Module 3 · Grid driving</text>
  <text class="t desc" x="40" y="216">count intersections, turn corners</text>

  <!-- Module 4 -->
  <g filter="url(#sketch)">
    <rect x="28" y="234" width="262" height="46" rx="7" fill="#E1F0E3" stroke="#2E7D32" stroke-width="1.4"/>
  </g>
  <text class="t band" x="40" y="252">Module 4 · Manhattan</text>
  <text class="t desc" x="40" y="270">plan a route, then drive it</text>

  <!-- Module 5 -->
  <g filter="url(#sketch)">
    <rect x="28" y="288" width="262" height="46" rx="7" fill="#FCEFD6" stroke="#C77C02" stroke-width="1.4"/>
  </g>
  <text class="t band" x="40" y="306">Module 5 · Pathfinding</text>
  <text class="t desc" x="40" y="324">BFS around blocked streets</text>

  <!-- Module 6 (optional) -->
  <g filter="url(#sketch)">
    <rect x="28" y="342" width="262" height="46" rx="7" fill="#FFFFFF" stroke="#8A939B" stroke-width="1.6" stroke-dasharray="6 4"/>
  </g>
  <text class="t band" x="40" y="360" fill="#495057">Module 6 · Dijkstra <tspan font-weight="400" font-style="italic">(optional)</tspan></text>
  <text class="t desc" x="40" y="378">cheapest route on weighted streets</text>

  <!-- RUN -->
  <g filter="url(#sketch)">
    <rect x="28" y="398" width="262" height="38" rx="7" fill="#142D50"/>
  </g>
  <text class="mono" x="40" y="422" font-size="13.5" font-weight="700" fill="#FFFFFF">RUN</text>
  <text class="t" x="80" y="422" font-size="12" fill="#FFFFFF">one test call · always last</text>

  <!-- ============================ ZOOMED VIEW =========================== -->
  <g filter="url(#sketch)">
    <rect x="376" y="30" width="290" height="422" rx="10" fill="#FFFFFF" stroke="#D1182C" stroke-width="2.4"/>
  </g>

  <!-- section banner + comment -->
  <text class="mono" x="392" y="56" font-size="13" font-weight="700" fill="#142D50"># ===== LINE SENSOR =====</text>
  <text class="mono" x="392" y="76" font-size="11.5" fill="#6C757D"># reads the two sensors and answers</text>
  <text class="mono" x="392" y="92" font-size="11.5" fill="#6C757D"># questions about them</text>

  <!-- functions -->
  <text class="t head" x="392" y="122">FUNCTIONS · the tools</text>
  <g filter="url(#sketchSoft)">
    <rect x="388" y="130" width="266" height="148" rx="7" fill="#F4F7FA" stroke="#22527B" stroke-width="1.4"/>
    <!-- today stickers -->
    <rect x="590" y="140" width="54" height="20" rx="10" fill="#D1182C"/>
    <rect x="590" y="166" width="54" height="20" rx="10" fill="#D1182C"/>
  </g>
  <text class="mono fn" x="400" y="155"><tspan fill="#22527B">def</tspan> get_left()</text>
  <text class="mono fn" x="400" y="181"><tspan fill="#22527B">def</tspan> get_right()</text>
  <text class="t today" x="617" y="154" text-anchor="middle">today!</text>
  <text class="t today" x="617" y="180" text-anchor="middle">today!</text>
  <text class="mono fnDim" x="400" y="207">def get_error()</text>
  <text class="mono fnDim" x="400" y="233">def is_either_on_line()</text>
  <text class="mono fnDim" x="400" y="259">def is_at_cross()</text>
  <text class="t later" x="642" y="245" text-anchor="end">added later</text>
  <text class="t later" x="642" y="260" text-anchor="end">in Module 2</text>

  <!-- tests -->
  <text class="t head" x="392" y="306" fill="#2E7D32">TESTS · try the tools</text>
  <g filter="url(#sketchSoft)">
    <rect x="388" y="314" width="266" height="96" rx="7" fill="#F2F8F2" stroke="#2E7D32" stroke-width="1.4"/>
    <rect x="590" y="324" width="54" height="20" rx="10" fill="#D1182C"/>
  </g>
  <text class="mono fn" x="400" y="339"><tspan fill="#2E7D32">def</tspan> test_sensors()</text>
  <text class="t today" x="617" y="338" text-anchor="middle">today!</text>
  <text class="mono fnDim" x="400" y="365">def test_drive_to_line()</text>
  <text class="mono fnDim" x="400" y="391">def test_bounce()</text>
  <text class="t later" x="642" y="391" text-anchor="end">…one per lesson</text>

  <text class="t" x="521" y="436" text-anchor="middle" font-size="12" fill="#495057">every section: <tspan font-weight="700" fill="#22527B">tools first</tspan>, then <tspan font-weight="700" fill="#2E7D32">their tests</tspan></text>
</svg>
