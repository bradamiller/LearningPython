<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 330" width="680" height="330" role="img" aria-labelledby="fT fD">
  <title id="fT">A graph stored as a dictionary</title>
  <desc id="fD">Left: the 3 by 3 graph, (0, 0) at the bottom-left, with (1, 1) highlighted blue, its four neighbors light blue, and (0, 0) orange. Right: the dictionary as key and value rows. Key (0, 0) maps to [(1, 0), (0, 1)]; key (0, 1) maps to [(1, 1), (0, 0), (0, 2)]; key (1, 1) maps to [(0, 1), (2, 1), (1, 0), (1, 2)]. graph[(1, 1)] jumps straight to that list. Neighbors are listed left, right, down, up.</desc>
  <style>
    .h   { font-family: Montserrat, Helvetica, Arial, sans-serif; font-size: 14px; font-weight: 700; fill: #22527B; }
    .n   { font-family: Montserrat, Helvetica, Arial, sans-serif; font-size: 12.5px; fill: #343A40; }
    .nb  { font-family: Montserrat, Helvetica, Arial, sans-serif; font-size: 12.5px; font-weight: 700; fill: #142D50; }
    .sm  { font-family: Montserrat, Helvetica, Arial, sans-serif; font-size: 11.5px; fill: #6C757D; }
    .ax  { font-family: Montserrat, Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 700; fill: #6C757D; }
    .m   { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12.5px; font-weight: 700; fill: #142D50; }
    .ms  { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11.5px; font-weight: 600; fill: #343A40; }
  </style>
  <defs>
    <marker id="aB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#22527B"/></marker>
    <marker id="aW" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#FFFFFF"/></marker>
    <marker id="aG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6C757D"/></marker>
    <marker id="aR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D1182C"/></marker>
    <marker id="aGr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E7D32"/></marker>
    <marker id="pcArr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6C757D"/>
    </marker>
    <marker id="pcDim" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,1 L5,5 L0,9" fill="none" stroke="#142D50" stroke-width="1.6"/>
    </marker>

    <!-- The XRP from above, traced from SparkFun's top-view photo. Front is UP.
         Origin = center of rotation (the pen hole between the drive wheels).
         Units: 1 unit = 4 photo px; the sensors are 60 units (8.75 cm) ahead of the origin. -->
    <g id="pcXRP" stroke-linejoin="round">
      <!-- rails out to the front casters -->
      <rect x="-59" y="-80" width="8" height="40" fill="#C3C8CD" stroke="#5F666D" stroke-width="1.3"/>
      <rect x="51"  y="-80" width="8" height="40" fill="#C3C8CD" stroke="#5F666D" stroke-width="1.3"/>
      <!-- main chassis plate -->
      <rect x="-59" y="-46" width="118" height="75" rx="8" fill="#D3D7DB" fill-opacity="0.92" stroke="#5F666D" stroke-width="1.5"/>
      <rect x="-50" y="-38" width="100" height="58" rx="4" fill="#E9ECEF" fill-opacity="0.85" stroke="#9AA1A8" stroke-width="0.8"/>
      <!-- caster bosses at the front corners -->
      <circle cx="-49" cy="-79" r="10" fill="#C3C8CD" stroke="#5F666D" stroke-width="1.3"/>
      <circle cx="49"  cy="-79" r="10" fill="#C3C8CD" stroke="#5F666D" stroke-width="1.3"/>
      <circle cx="-49" cy="-79" r="4.5" fill="#F1EBDD" stroke="#8A7E62" stroke-width="0.8"/>
      <circle cx="49"  cy="-79" r="4.5" fill="#F1EBDD" stroke="#8A7E62" stroke-width="0.8"/>
      <!-- drive wheels -->
      <rect x="-56" y="-21" width="11" height="42" rx="3.5" fill="#2B2B2B"/>
      <rect x="45"  y="-21" width="11" height="42" rx="3.5" fill="#2B2B2B"/>
      <line x1="-50.5" y1="-17" x2="-50.5" y2="17" stroke="#6C757D" stroke-width="1"/>
      <line x1="50.5"  y1="-17" x2="50.5"  y2="17" stroke="#6C757D" stroke-width="1"/>
      <!-- battery latches -->
      <rect x="-40" y="-30" width="6" height="12" rx="2" fill="#F05A28"/>
      <rect x="34"  y="-30" width="6" height="12" rx="2" fill="#F05A28"/>
      <!-- controller board -->
      <rect x="-24" y="-42" width="48" height="37" rx="2" fill="#D1182C"/>
      <rect x="-6" y="-41" width="12" height="35" rx="1" fill="#2B2B2B"/>
      <!-- servo + arm at the back -->
      <rect x="-26" y="22" width="15" height="13" rx="1.5" fill="#2B2B2B"/>
      <rect x="-34" y="24" width="8" height="26" rx="2" fill="#AEB4BA" stroke="#5F666D" stroke-width="1"/>
      <!-- rangefinder bracket, board and the two cylinders -->
      <rect x="-16" y="-58" width="32" height="13" rx="2" fill="#AEB4BA" stroke="#5F666D" stroke-width="1"/>
      <rect x="-18" y="-65" width="36" height="8" rx="1.5" fill="#B5172A"/>
      <circle cx="-8" cy="-68" r="5.5" fill="#E4E7EA" stroke="#868E96" stroke-width="1"/>
      <circle cx="8"  cy="-68" r="5.5" fill="#E4E7EA" stroke="#868E96" stroke-width="1"/>
      <!-- the two line sensors, under the rangefinder (drawn as if seen through it) -->
      <circle cx="-6.5" cy="-60" r="4" fill="#FFD43B" stroke="#142D50" stroke-width="1.4"/>
      <circle cx="6.5"  cy="-60" r="4" fill="#FFD43B" stroke="#142D50" stroke-width="1.4"/>
      <!-- center of rotation: the pen hole -->
      <circle cx="0" cy="0" r="5" fill="#FFFFFF" stroke="#142D50" stroke-width="1.8"/>
      <circle cx="0" cy="0" r="1.8" fill="#142D50"/>
    </g>

    <!-- the same robot after a right turn, as a dashed ghost -->
    <g id="pcGhost" fill="none" stroke="#343A40" stroke-width="1.4" stroke-dasharray="4 3">
      <path d="M -51 -46 V -72 M 51 -46 V -72 M -59 -36 V -79 M 59 -36 V -79 M -59 -46 H 59"/>
      <circle cx="-49" cy="-79" r="10"/>
      <circle cx="49"  cy="-79" r="10"/>
      <rect x="-18" y="-65" width="36" height="8" rx="1.5"/>
      <circle cx="-6.5" cy="-60" r="4.5" fill="#FFFFFF" stroke="#D1182C" stroke-width="2.4" stroke-dasharray="none"/>
      <circle cx="6.5"  cy="-60" r="4.5" fill="#FFFFFF" stroke="#D1182C" stroke-width="2.4" stroke-dasharray="none"/>
    </g>
  </defs>
  <rect width="680" height="330" fill="#FFFFFF"/>
  <text class="h" x="20" y="26">graph = {node: [neighbors]}</text>
  <line x1="60" y1="260" x2="60" y2="170" stroke="#495057" stroke-width="4"/>
  <line x1="60" y1="260" x2="150" y2="260" stroke="#495057" stroke-width="4"/>
  <line x1="60" y1="170" x2="60" y2="80" stroke="#495057" stroke-width="4"/>
  <line x1="60" y1="170" x2="150" y2="170" stroke="#495057" stroke-width="4"/>
  <line x1="60" y1="80" x2="150" y2="80" stroke="#495057" stroke-width="4"/>
  <line x1="150" y1="260" x2="150" y2="170" stroke="#495057" stroke-width="4"/>
  <line x1="150" y1="260" x2="240" y2="260" stroke="#495057" stroke-width="4"/>
  <line x1="150" y1="170" x2="150" y2="80" stroke="#495057" stroke-width="4"/>
  <line x1="150" y1="170" x2="240" y2="170" stroke="#495057" stroke-width="4"/>
  <line x1="150" y1="80" x2="240" y2="80" stroke="#495057" stroke-width="4"/>
  <line x1="240" y1="260" x2="240" y2="170" stroke="#495057" stroke-width="4"/>
  <line x1="240" y1="170" x2="240" y2="80" stroke="#495057" stroke-width="4"/>
  <circle cx="60" cy="260" r="18" fill="#FFF0D1" stroke="#C77C02" stroke-width="2.4"/>
  <text class="ms" x="60" y="264" text-anchor="middle" style="font-size:10.5px">0,0</text>
  <circle cx="60" cy="170" r="18" fill="#DCE8F3" stroke="#22527B" stroke-width="2.4"/>
  <text class="ms" x="60" y="174" text-anchor="middle" style="font-size:10.5px">0,1</text>
  <circle cx="60" cy="80" r="18" fill="#FFFFFF" stroke="#22527B" stroke-width="2.4"/>
  <text class="ms" x="60" y="84" text-anchor="middle" style="font-size:10.5px">0,2</text>
  <circle cx="150" cy="260" r="18" fill="#DCE8F3" stroke="#22527B" stroke-width="2.4"/>
  <text class="ms" x="150" y="264" text-anchor="middle" style="font-size:10.5px">1,0</text>
  <circle cx="150" cy="170" r="18" fill="#4C8BF5" stroke="#22527B" stroke-width="2.4"/>
  <text class="ms" x="150" y="174" text-anchor="middle" style="font-size:10.5px">1,1</text>
  <circle cx="150" cy="80" r="18" fill="#DCE8F3" stroke="#22527B" stroke-width="2.4"/>
  <text class="ms" x="150" y="84" text-anchor="middle" style="font-size:10.5px">1,2</text>
  <circle cx="240" cy="260" r="18" fill="#FFFFFF" stroke="#22527B" stroke-width="2.4"/>
  <text class="ms" x="240" y="264" text-anchor="middle" style="font-size:10.5px">2,0</text>
  <circle cx="240" cy="170" r="18" fill="#DCE8F3" stroke="#22527B" stroke-width="2.4"/>
  <text class="ms" x="240" y="174" text-anchor="middle" style="font-size:10.5px">2,1</text>
  <circle cx="240" cy="80" r="18" fill="#FFFFFF" stroke="#22527B" stroke-width="2.4"/>
  <text class="ms" x="240" y="84" text-anchor="middle" style="font-size:10.5px">2,2</text>
  <text class="nb" x="300" y="64">key</text><text class="nb" x="396" y="64">value: a list of neighbors</text>
  <rect x="300" y="80" width="80" height="30" rx="6" fill="#FFF0D1" stroke="#C77C02" stroke-width="1.6"/><text class="m" x="340" y="100" text-anchor="middle">(0, 0)</text>
  <line x1="382" y1="95" x2="394" y2="95" stroke="#495057" stroke-width="2" marker-end="url(#aG)"/>
  <rect x="396" y="80" width="272" height="30" rx="6" fill="#FFFFFF" stroke="#C77C02" stroke-width="1.4"/><text class="ms" x="406" y="100">[(1, 0), (0, 1)]</text>
  <rect x="300" y="122" width="80" height="30" rx="6" fill="#F8F9FA" stroke="#ADB5BD" stroke-width="1.6"/><text class="m" x="340" y="142" text-anchor="middle">(0, 1)</text>
  <line x1="382" y1="137" x2="394" y2="137" stroke="#495057" stroke-width="2" marker-end="url(#aG)"/>
  <rect x="396" y="122" width="272" height="30" rx="6" fill="#FFFFFF" stroke="#ADB5BD" stroke-width="1.4"/><text class="ms" x="406" y="142">[(1, 1), (0, 0), (0, 2)]</text>
  <rect x="300" y="164" width="80" height="30" rx="6" fill="#DCE8F3" stroke="#22527B" stroke-width="1.6"/><text class="m" x="340" y="184" text-anchor="middle">(1, 1)</text>
  <line x1="382" y1="179" x2="394" y2="179" stroke="#495057" stroke-width="2" marker-end="url(#aG)"/>
  <rect x="396" y="164" width="272" height="30" rx="6" fill="#FFFFFF" stroke="#22527B" stroke-width="1.4"/><text class="ms" x="406" y="184">[(0, 1), (2, 1), (1, 0), (1, 2)]</text>
  <rect x="300" y="206" width="80" height="30" rx="6" fill="#F8F9FA" stroke="#ADB5BD" stroke-width="1.6"/><text class="m" x="340" y="226" text-anchor="middle">…</text>
  <line x1="382" y1="221" x2="394" y2="221" stroke="#495057" stroke-width="2" marker-end="url(#aG)"/>
  <rect x="396" y="206" width="272" height="30" rx="6" fill="#FFFFFF" stroke="#ADB5BD" stroke-width="1.4"/><text class="ms" x="406" y="226">…</text>
  <text class="n" x="300" y="270"><tspan class="m">graph[(1, 1)]</tspan> jumps straight to the blue list:</text>
  <text class="n" x="300" y="288">no searching, no counting positions.</text>
  <text class="sm" x="300" y="314">Neighbors are listed left, right, down, up.</text>
</svg>
