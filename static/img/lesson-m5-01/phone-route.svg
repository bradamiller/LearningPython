<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 440" width="680" height="440" role="img" aria-labelledby="t d"><title id="t">A maps app routing around trouble</title><desc id="d">A drawing of a smartphone running a generic maps app. The map shows a grid of city streets, a park, a river and a highway. A blue route runs from the blue dot of your location to a red pin at school. One street has a road-closed barrier, labeled as an obstacle, Module 5; another is colored red for heavy traffic, labeled as a slow street, Module 6. The blue route turns along the streets to go around both. A card at the bottom reads 14 min, fastest route, avoids a closed road, with a Start button.</desc><style>
