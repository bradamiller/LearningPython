<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 440" width="680" height="440" role="img" aria-labelledby="fT fD">
  <title id="fT">A slow segment, a step and a weight</title>
  <desc id="fD">Three columns, each the left edge of the grid, x = 0, from (0, 0) at the bottom to (0, 3) at the top. On the floor: the tape from (0, 0) to (0, 1) and from (0, 2) to (0, 3) is straight and takes about 4 seconds; the tape from (0, 1) to (0, 2) winds back and forth and takes about 20 seconds. To the Module 5 graph: every edge is 1 step, so it cannot tell them apart. With a weight on every edge: the edges are 1, 5 and 1, because 20 divided by 4 is about 5 blocks of time.</desc>
  <style>
    .h   { font-family: Montserrat, Helvetica, Arial, sans-serif; font-size: 14px; font-weight: 700; fill: #22527B; }
    .n   { font-family: Montserrat, Helvetica, Arial, sans-serif; font-size: 12.5px; fill: #343A40; }
    .nb  { font-family: Montserrat, Helvetica, Arial, sans-serif; font-size: 12.5px; font-weight: 700; fill: #142D50; }
    .sm  { font-family: Montserrat, Helvetica, Arial, sans-serif; font-size: 11.5px; fill: #6C757D; }
    .ax  { font-family: Montserrat, Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 700; fill: #6C757D; }
    .m   { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12.5px; font-weight: 700; fill: #142D50; }
    .ms  { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11.5px; font-weight: 600; fill: #343A40; }
  </style>
  <defs>
    <marker id="aB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#22527B"/></marker>
    <marker id="aW" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#FFFFFF"/></marker>
    <marker id="aG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6C757D"/></marker>
    <marker id="aR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D1182C"/></marker>
    <marker id="aGr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E7D32"/></marker>
    <marker id="pcArr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6C757D"/>
    </marker>
    <marker id="pcDim" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,1 L5,5 L0,9" fill="none" stroke="#142D50" stroke-width="1.6"/>
    </marker>

    <!-- The XRP from above, traced from SparkFun's top-view photo. Front is UP.
         Origin = center of rotation (the pen hole between the drive wheels).
         Units: 1 unit = 4 photo px; the sensors are 60 units (8.75 cm) ahead of the origin. -->
    <g id="pcXRP" stroke-linejoin="round">
      <!-- rails out to the front casters -->
      <rect x="-59" y="-80" width="8" height="40" fill="#C3C8CD" stroke="#5F666D" stroke-width="1.3"/>
      <rect x="51"  y="-80" width="8" height="40" fill="#C3C8CD" stroke="#5F666D" stroke-width="1.3"/>
      <!-- main chassis plate -->
      <rect x="-59" y="-46" width="118" height="75" rx="8" fill="#D3D7DB" fill-opacity="0.92" stroke="#5F666D" stroke-width="1.5"/>
      <rect x="-50" y="-38" width="100" height="58" rx="4" fill="#E9ECEF" fill-opacity="0.85" stroke="#9AA1A8" stroke-width="0.8"/>
      <!-- caster bosses at the front corners -->
      <circle cx="-49" cy="-79" r="10" fill="#C3C8CD" stroke="#5F666D" stroke-width="1.3"/>
      <circle cx="49"  cy="-79" r="10" fill="#C3C8CD" stroke="#5F666D" stroke-width="1.3"/>
      <circle cx="-49" cy="-79" r="4.5" fill="#F1EBDD" stroke="#8A7E62" stroke-width="0.8"/>
      <circle cx="49"  cy="-79" r="4.5" fill="#F1EBDD" stroke="#8A7E62" stroke-width="0.8"/>
      <!-- drive wheels -->
      <rect x="-56" y="-21" width="11" height="42" rx="3.5" fill="#2B2B2B"/>
      <rect x="45"  y="-21" width="11" height="42" rx="3.5" fill="#2B2B2B"/>
      <line x1="-50.5" y1="-17" x2="-50.5" y2="17" stroke="#6C757D" stroke-width="1"/>
      <line x1="50.5"  y1="-17" x2="50.5"  y2="17" stroke="#6C757D" stroke-width="1"/>
      <!-- battery latches -->
      <rect x="-40" y="-30" width="6" height="12" rx="2" fill="#F05A28"/>
      <rect x="34"  y="-30" width="6" height="12" rx="2" fill="#F05A28"/>
      <!-- controller board -->
      <rect x="-24" y="-42" width="48" height="37" rx="2" fill="#D1182C"/>
      <rect x="-6" y="-41" width="12" height="35" rx="1" fill="#2B2B2B"/>
      <!-- servo + arm at the back -->
      <rect x="-26" y="22" width="15" height="13" rx="1.5" fill="#2B2B2B"/>
      <rect x="-34" y="24" width="8" height="26" rx="2" fill="#AEB4BA" stroke="#5F666D" stroke-width="1"/>
      <!-- rangefinder bracket, board and the two cylinders -->
      <rect x="-16" y="-58" width="32" height="13" rx="2" fill="#AEB4BA" stroke="#5F666D" stroke-width="1"/>
      <rect x="-18" y="-65" width="36" height="8" rx="1.5" fill="#B5172A"/>
      <circle cx="-8" cy="-68" r="5.5" fill="#E4E7EA" stroke="#868E96" stroke-width="1"/>
      <circle cx="8"  cy="-68" r="5.5" fill="#E4E7EA" stroke="#868E96" stroke-width="1"/>
      <!-- the two line sensors, under the rangefinder (drawn as if seen through it) -->
      <circle cx="-6.5" cy="-60" r="4" fill="#FFD43B" stroke="#142D50" stroke-width="1.4"/>
      <circle cx="6.5"  cy="-60" r="4" fill="#FFD43B" stroke="#142D50" stroke-width="1.4"/>
      <!-- center of rotation: the pen hole -->
      <circle cx="0" cy="0" r="5" fill="#FFFFFF" stroke="#142D50" stroke-width="1.8"/>
      <circle cx="0" cy="0" r="1.8" fill="#142D50"/>
    </g>

    <!-- the same robot after a right turn, as a dashed ghost -->
    <g id="pcGhost" fill="none" stroke="#343A40" stroke-width="1.4" stroke-dasharray="4 3">
      <path d="M -51 -46 V -72 M 51 -46 V -72 M -59 -36 V -79 M 59 -36 V -79 M -59 -46 H 59"/>
      <circle cx="-49" cy="-79" r="10"/>
      <circle cx="49"  cy="-79" r="10"/>
      <rect x="-18" y="-65" width="36" height="8" rx="1.5"/>
      <circle cx="-6.5" cy="-60" r="4.5" fill="#FFFFFF" stroke="#D1182C" stroke-width="2.4" stroke-dasharray="none"/>
      <circle cx="6.5"  cy="-60" r="4.5" fill="#FFFFFF" stroke="#D1182C" stroke-width="2.4" stroke-dasharray="none"/>
    </g>
  </defs>
  <rect width="680" height="440" fill="#FFFFFF"/>
  <text class="h" x="110" y="26" text-anchor="middle">On the floor</text>
  <text class="sm" x="110" y="44" text-anchor="middle">the left edge, x = 0</text>
  <rect x="74" y="56" width="72" height="318" rx="8" fill="#F3F4F6" stroke="#DEE2E6"/>
  <rect x="105.5" y="260" width="9" height="114" fill="#2B2B2B"/>
  <path d="M 110.0 260.0 L 110.4 259.0 L 111.6 258.0 L 113.3 257.0 L 115.3 256.0 L 117.2 255.0 L 118.8 254.0 L 119.5 253.0 L 119.2 252.0 L 117.8 251.0 L 115.0 250.0 L 111.1 249.0 L 106.3 248.0 L 101.0 247.0 L 95.7 246.0 L 90.9 245.0 L 88.7 244.0 L 88.0 243.0 L 89.1 242.0 L 91.8 241.0 L 95.9 240.0 L 101.1 239.0 L 106.9 238.0 L 113.1 237.0 L 118.9 236.0 L 124.1 235.0 L 128.2 234.0 L 130.9 233.0 L 132.0 232.0 L 131.3 231.0 L 129.1 230.0 L 125.3 229.0 L 120.3 228.0 L 114.6 227.0 L 108.5 226.0 L 102.5 225.0 L 97.1 224.0 L 92.7 223.0 L 89.6 222.0 L 88.1 221.0 L 88.3 220.0 L 90.2 219.0 L 93.7 218.0 L 98.3 217.0 L 103.9 216.0 L 110.0 215.0 L 116.1 214.0 L 121.7 213.0 L 126.3 212.0 L 129.8 211.0 L 131.7 210.0 L 131.9 209.0 L 130.4 208.0 L 127.3 207.0 L 122.9 206.0 L 117.5 205.0 L 111.5 204.0 L 105.4 203.0 L 99.7 202.0 L 94.7 201.0 L 90.9 200.0 L 88.7 199.0 L 88.0 198.0 L 89.1 197.0 L 91.8 196.0 L 95.9 195.0 L 101.1 194.0 L 106.9 193.0 L 113.1 192.0 L 118.9 191.0 L 124.1 190.0 L 128.2 189.0 L 130.9 188.0 L 132.0 187.0 L 131.3 186.0 L 129.1 185.0 L 124.3 184.0 L 119.0 183.0 L 113.7 182.0 L 108.9 181.0 L 105.0 180.0 L 102.2 179.0 L 100.8 178.0 L 100.5 177.0 L 101.2 176.0 L 102.8 175.0 L 104.7 174.0 L 106.7 173.0 L 108.4 172.0 L 109.6 171.0 L 110.0 170.0" fill="none" stroke="#2B2B2B" stroke-width="9" stroke-linejoin="round"/>
  <rect x="105.5" y="56" width="9" height="114" fill="#2B2B2B"/>
  <rect x="74" y="345.5" width="72" height="9" fill="#2B2B2B"/>
  <text class="ax" x="66" y="354" text-anchor="end">(0, 0)</text>
  <rect x="74" y="255.5" width="72" height="9" fill="#2B2B2B"/>
  <text class="ax" x="66" y="264" text-anchor="end">(0, 1)</text>
  <rect x="74" y="165.5" width="72" height="9" fill="#2B2B2B"/>
  <text class="ax" x="66" y="174" text-anchor="end">(0, 2)</text>
  <rect x="74" y="75.5" width="72" height="9" fill="#2B2B2B"/>
  <text class="ax" x="66" y="84" text-anchor="end">(0, 3)</text>
  <text class="sm" x="154" y="309.0" style="fill:#6C757D">about 4 s</text>
  <text class="sm" x="154" y="219.0" style="fill:#D1182C;font-weight:700">about 20 s</text>
  <text class="sm" x="154" y="129.0" style="fill:#6C757D">about 4 s</text>
  <text class="h" x="350" y="26" text-anchor="middle">To the Module 5 graph</text>
  <text class="sm" x="350" y="44" text-anchor="middle">every edge counts 1</text>
  <line x1="350" y1="350" x2="350" y2="260" stroke="#495057" stroke-width="4"/>
  <rect x="369.0" y="294.0" width="54" height="20" rx="5" fill="#FFFFFF" stroke="#22527B" stroke-width="1.4"/><text class="ms" x="396" y="308.5" text-anchor="middle">1 step</text>
  <line x1="350" y1="260" x2="350" y2="170" stroke="#495057" stroke-width="4"/>
  <rect x="369.0" y="204.0" width="54" height="20" rx="5" fill="#FFFFFF" stroke="#22527B" stroke-width="1.4"/><text class="ms" x="396" y="218.5" text-anchor="middle">1 step</text>
  <line x1="350" y1="170" x2="350" y2="80" stroke="#495057" stroke-width="4"/>
  <rect x="369.0" y="114.0" width="54" height="20" rx="5" fill="#FFFFFF" stroke="#22527B" stroke-width="1.4"/><text class="ms" x="396" y="128.5" text-anchor="middle">1 step</text>
  <circle cx="350" cy="350" r="18" fill="#FFFFFF" stroke="#22527B" stroke-width="2.4"/><text class="ms" x="350" y="354" text-anchor="middle" style="font-size:10.5px">0,0</text>
  <circle cx="350" cy="260" r="18" fill="#FFFFFF" stroke="#22527B" stroke-width="2.4"/><text class="ms" x="350" y="264" text-anchor="middle" style="font-size:10.5px">0,1</text>
  <circle cx="350" cy="170" r="18" fill="#FFFFFF" stroke="#22527B" stroke-width="2.4"/><text class="ms" x="350" y="174" text-anchor="middle" style="font-size:10.5px">0,2</text>
  <circle cx="350" cy="80" r="18" fill="#FFFFFF" stroke="#22527B" stroke-width="2.4"/><text class="ms" x="350" y="84" text-anchor="middle" style="font-size:10.5px">0,3</text>
  <text class="n" x="350" y="398" text-anchor="middle">all the same</text>
  <text class="h" x="560" y="26" text-anchor="middle">With a weight</text>
  <text class="sm" x="560" y="44" text-anchor="middle">on every edge</text>
  <line x1="560" y1="350" x2="560" y2="260" stroke="#22527B" stroke-width="4"/>
  <rect x="596.5" y="294.0" width="19" height="20" rx="5" fill="#FFFFFF" stroke="#22527B" stroke-width="1.4"/><text class="ms" x="606" y="308.5" text-anchor="middle">1</text>
  <line x1="560" y1="260" x2="560" y2="170" stroke="#D1182C" stroke-width="7"/>
  <rect x="596.5" y="204.0" width="19" height="20" rx="5" fill="#FFFFFF" stroke="#D1182C" stroke-width="1.4"/><text class="ms" x="606" y="218.5" text-anchor="middle">5</text>
  <line x1="560" y1="170" x2="560" y2="80" stroke="#22527B" stroke-width="4"/>
  <rect x="596.5" y="114.0" width="19" height="20" rx="5" fill="#FFFFFF" stroke="#22527B" stroke-width="1.4"/><text class="ms" x="606" y="128.5" text-anchor="middle">1</text>
  <circle cx="560" cy="350" r="18" fill="#FFFFFF" stroke="#22527B" stroke-width="2.4"/><text class="ms" x="560" y="354" text-anchor="middle" style="font-size:10.5px">0,0</text>
  <circle cx="560" cy="260" r="18" fill="#FFFFFF" stroke="#22527B" stroke-width="2.4"/><text class="ms" x="560" y="264" text-anchor="middle" style="font-size:10.5px">0,1</text>
  <circle cx="560" cy="170" r="18" fill="#FFFFFF" stroke="#22527B" stroke-width="2.4"/><text class="ms" x="560" y="174" text-anchor="middle" style="font-size:10.5px">0,2</text>
  <circle cx="560" cy="80" r="18" fill="#FFFFFF" stroke="#22527B" stroke-width="2.4"/><text class="ms" x="560" y="84" text-anchor="middle" style="font-size:10.5px">0,3</text>
  <text class="n" x="560" y="398" text-anchor="middle">20 ÷ 4 ≈ 5:</text>
  <text class="n" x="560" y="415" text-anchor="middle">five blocks' time</text>
</svg>
