<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 350" width="680" height="350" role="img" aria-labelledby="fT fD">
  <title id="fT">A slow segment, a step and a weight</title>
  <desc id="fD">Top: row 0 of the floor grid. The tape from (0, 0) to (0, 1) and from (0, 2) to (0, 3) is straight and takes about 4 seconds; the tape from (0, 1) to (0, 2) winds back and forth and takes about 20 seconds. Middle: the Module 5 graph of the same row gives every edge 1 step, so it cannot tell them apart. Bottom: with weights, the edges are 1, 5 and 1, because 20 divided by 4 is about 5 blocks of time.</desc>
  <style>
    .h   { font-family: Montserrat, Helvetica, Arial, sans-serif; font-size: 14px; font-weight: 700; fill: #22527B; }
    .n   { font-family: Montserrat, Helvetica, Arial, sans-serif; font-size: 12.5px; fill: #343A40; }
    .nb  { font-family: Montserrat, Helvetica, Arial, sans-serif; font-size: 12.5px; font-weight: 700; fill: #142D50; }
    .sm  { font-family: Montserrat, Helvetica, Arial, sans-serif; font-size: 11.5px; fill: #6C757D; }
    .ax  { font-family: Montserrat, Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 700; fill: #6C757D; }
    .m   { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12.5px; font-weight: 700; fill: #142D50; }
    .ms  { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11.5px; font-weight: 600; fill: #343A40; }
  </style>
  <defs>
    <marker id="aB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#22527B"/></marker>
    <marker id="aW" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#FFFFFF"/></marker>
    <marker id="aG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6C757D"/></marker>
    <marker id="aR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D1182C"/></marker>
    <marker id="aGr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E7D32"/></marker>
    <marker id="pcArr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6C757D"/>
    </marker>
    <marker id="pcDim" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,1 L5,5 L0,9" fill="none" stroke="#142D50" stroke-width="1.6"/>
    </marker>

    <!-- The XRP from above, traced from SparkFun's top-view photo. Front is UP.
         Origin = center of rotation (the pen hole between the drive wheels).
         Units: 1 unit = 4 photo px; the sensors are 60 units (8.75 cm) ahead of the origin. -->
    <g id="pcXRP" stroke-linejoin="round">
      <!-- rails out to the front casters -->
      <rect x="-59" y="-80" width="8" height="40" fill="#C3C8CD" stroke="#5F666D" stroke-width="1.3"/>
      <rect x="51"  y="-80" width="8" height="40" fill="#C3C8CD" stroke="#5F666D" stroke-width="1.3"/>
      <!-- main chassis plate -->
      <rect x="-59" y="-46" width="118" height="75" rx="8" fill="#D3D7DB" fill-opacity="0.92" stroke="#5F666D" stroke-width="1.5"/>
      <rect x="-50" y="-38" width="100" height="58" rx="4" fill="#E9ECEF" fill-opacity="0.85" stroke="#9AA1A8" stroke-width="0.8"/>
      <!-- caster bosses at the front corners -->
      <circle cx="-49" cy="-79" r="10" fill="#C3C8CD" stroke="#5F666D" stroke-width="1.3"/>
      <circle cx="49"  cy="-79" r="10" fill="#C3C8CD" stroke="#5F666D" stroke-width="1.3"/>
      <circle cx="-49" cy="-79" r="4.5" fill="#F1EBDD" stroke="#8A7E62" stroke-width="0.8"/>
      <circle cx="49"  cy="-79" r="4.5" fill="#F1EBDD" stroke="#8A7E62" stroke-width="0.8"/>
      <!-- drive wheels -->
      <rect x="-56" y="-21" width="11" height="42" rx="3.5" fill="#2B2B2B"/>
      <rect x="45"  y="-21" width="11" height="42" rx="3.5" fill="#2B2B2B"/>
      <line x1="-50.5" y1="-17" x2="-50.5" y2="17" stroke="#6C757D" stroke-width="1"/>
      <line x1="50.5"  y1="-17" x2="50.5"  y2="17" stroke="#6C757D" stroke-width="1"/>
      <!-- battery latches -->
      <rect x="-40" y="-30" width="6" height="12" rx="2" fill="#F05A28"/>
      <rect x="34"  y="-30" width="6" height="12" rx="2" fill="#F05A28"/>
      <!-- controller board -->
      <rect x="-24" y="-42" width="48" height="37" rx="2" fill="#D1182C"/>
      <rect x="-6" y="-41" width="12" height="35" rx="1" fill="#2B2B2B"/>
      <!-- servo + arm at the back -->
      <rect x="-26" y="22" width="15" height="13" rx="1.5" fill="#2B2B2B"/>
      <rect x="-34" y="24" width="8" height="26" rx="2" fill="#AEB4BA" stroke="#5F666D" stroke-width="1"/>
      <!-- rangefinder bracket, board and the two cylinders -->
      <rect x="-16" y="-58" width="32" height="13" rx="2" fill="#AEB4BA" stroke="#5F666D" stroke-width="1"/>
      <rect x="-18" y="-65" width="36" height="8" rx="1.5" fill="#B5172A"/>
      <circle cx="-8" cy="-68" r="5.5" fill="#E4E7EA" stroke="#868E96" stroke-width="1"/>
      <circle cx="8"  cy="-68" r="5.5" fill="#E4E7EA" stroke="#868E96" stroke-width="1"/>
      <!-- the two line sensors, under the rangefinder (drawn as if seen through it) -->
      <circle cx="-6.5" cy="-60" r="4" fill="#FFD43B" stroke="#142D50" stroke-width="1.4"/>
      <circle cx="6.5"  cy="-60" r="4" fill="#FFD43B" stroke="#142D50" stroke-width="1.4"/>
      <!-- center of rotation: the pen hole -->
      <circle cx="0" cy="0" r="5" fill="#FFFFFF" stroke="#142D50" stroke-width="1.8"/>
      <circle cx="0" cy="0" r="1.8" fill="#142D50"/>
    </g>

    <!-- the same robot after a right turn, as a dashed ghost -->
    <g id="pcGhost" fill="none" stroke="#343A40" stroke-width="1.4" stroke-dasharray="4 3">
      <path d="M -51 -46 V -72 M 51 -46 V -72 M -59 -36 V -79 M 59 -36 V -79 M -59 -46 H 59"/>
      <circle cx="-49" cy="-79" r="10"/>
      <circle cx="49"  cy="-79" r="10"/>
      <rect x="-18" y="-65" width="36" height="8" rx="1.5"/>
      <circle cx="-6.5" cy="-60" r="4.5" fill="#FFFFFF" stroke="#D1182C" stroke-width="2.4" stroke-dasharray="none"/>
      <circle cx="6.5"  cy="-60" r="4.5" fill="#FFFFFF" stroke="#D1182C" stroke-width="2.4" stroke-dasharray="none"/>
    </g>
  </defs>
  <rect width="680" height="350" fill="#FFFFFF"/>
  <text class="h" x="20" y="26">On the floor</text>
  <rect x="40" y="44" width="480" height="68" rx="8" fill="#F3F4F6" stroke="#DEE2E6"/>
  <rect x="40" y="73.5" width="170" height="9" fill="#2B2B2B"/>
  <path d="M 210.0 78.0 L 211.6 78.4 L 213.1 79.7 L 214.7 81.6 L 216.2 83.8 L 217.8 85.9 L 219.3 87.5 L 220.9 88.4 L 222.4 88.1 L 224.0 86.5 L 225.6 83.5 L 227.1 79.2 L 228.7 74.0 L 230.2 68.2 L 231.8 62.4 L 233.3 57.2 L 234.9 54.7 L 236.4 54.0 L 238.0 55.2 L 239.6 58.1 L 241.1 62.6 L 242.7 68.2 L 244.2 74.7 L 245.8 81.3 L 247.3 87.8 L 248.9 93.4 L 250.4 97.9 L 252.0 100.8 L 253.6 102.0 L 255.1 101.3 L 256.7 98.8 L 258.2 94.7 L 259.8 89.3 L 261.3 83.0 L 262.9 76.3 L 264.4 69.8 L 266.0 63.9 L 267.6 59.1 L 269.1 55.7 L 270.7 54.1 L 272.2 54.4 L 273.8 56.4 L 275.3 60.2 L 276.9 65.3 L 278.4 71.4 L 280.0 78.0 L 281.6 84.6 L 283.1 90.7 L 284.7 95.8 L 286.2 99.6 L 287.8 101.6 L 289.3 101.9 L 290.9 100.3 L 292.4 96.9 L 294.0 92.1 L 295.6 86.2 L 297.1 79.7 L 298.7 73.0 L 300.2 66.7 L 301.8 61.3 L 303.3 57.2 L 304.9 54.7 L 306.4 54.0 L 308.0 55.2 L 309.6 58.1 L 311.1 62.6 L 312.7 68.2 L 314.2 74.7 L 315.8 81.3 L 317.3 87.8 L 318.9 93.4 L 320.4 97.9 L 322.0 100.8 L 323.6 102.0 L 325.1 101.3 L 326.7 98.8 L 328.2 93.6 L 329.8 87.8 L 331.3 82.0 L 332.9 76.8 L 334.4 72.5 L 336.0 69.5 L 337.6 67.9 L 339.1 67.6 L 340.7 68.5 L 342.2 70.1 L 343.8 72.2 L 345.3 74.4 L 346.9 76.3 L 348.4 77.6 L 350.0 78.0" fill="none" stroke="#2B2B2B" stroke-width="9" stroke-linejoin="round"/>
  <rect x="350" y="73.5" width="170" height="9" fill="#2B2B2B"/>
  <rect x="65.5" y="44" width="9" height="68" fill="#2B2B2B"/>
  <text class="ax" x="70" y="130" text-anchor="middle">(0, 0)</text>
  <rect x="205.5" y="44" width="9" height="68" fill="#2B2B2B"/>
  <text class="ax" x="210" y="130" text-anchor="middle">(0, 1)</text>
  <rect x="345.5" y="44" width="9" height="68" fill="#2B2B2B"/>
  <text class="ax" x="350" y="130" text-anchor="middle">(0, 2)</text>
  <rect x="485.5" y="44" width="9" height="68" fill="#2B2B2B"/>
  <text class="ax" x="490" y="130" text-anchor="middle">(0, 3)</text>
  <text class="sm" x="140.0" y="36" text-anchor="middle">about 4 s</text>
  <text class="sm" x="280.0" y="36" text-anchor="middle" style="fill:#D1182C;font-weight:700">about 20 s</text>
  <text class="sm" x="420.0" y="36" text-anchor="middle">about 4 s</text>
  <text class="h" x="20" y="184">To the Module 5 graph</text>
  <line x1="70" y1="230" x2="210" y2="230" stroke="#495057" stroke-width="4"/>
  <rect x="113.0" y="199" width="54" height="20" rx="5" fill="#FFFFFF" stroke="#22527B" stroke-width="1.4"/><text class="ms" x="140.0" y="213.5" text-anchor="middle">1 step</text>
  <line x1="210" y1="230" x2="350" y2="230" stroke="#495057" stroke-width="4"/>
  <rect x="253.0" y="199" width="54" height="20" rx="5" fill="#FFFFFF" stroke="#22527B" stroke-width="1.4"/><text class="ms" x="280.0" y="213.5" text-anchor="middle">1 step</text>
  <line x1="350" y1="230" x2="490" y2="230" stroke="#495057" stroke-width="4"/>
  <rect x="393.0" y="199" width="54" height="20" rx="5" fill="#FFFFFF" stroke="#22527B" stroke-width="1.4"/><text class="ms" x="420.0" y="213.5" text-anchor="middle">1 step</text>
  <circle cx="70" cy="230" r="18" fill="#FFFFFF" stroke="#22527B" stroke-width="2.4"/><text class="ms" x="70" y="234" text-anchor="middle" style="font-size:10.5px">0,0</text>
  <circle cx="210" cy="230" r="18" fill="#FFFFFF" stroke="#22527B" stroke-width="2.4"/><text class="ms" x="210" y="234" text-anchor="middle" style="font-size:10.5px">0,1</text>
  <circle cx="350" cy="230" r="18" fill="#FFFFFF" stroke="#22527B" stroke-width="2.4"/><text class="ms" x="350" y="234" text-anchor="middle" style="font-size:10.5px">0,2</text>
  <circle cx="490" cy="230" r="18" fill="#FFFFFF" stroke="#22527B" stroke-width="2.4"/><text class="ms" x="490" y="234" text-anchor="middle" style="font-size:10.5px">0,3</text>
  <text class="h" x="20" y="274">With a weight on every edge</text>
  <line x1="70" y1="314" x2="210" y2="314" stroke="#22527B" stroke-width="4"/>
  <rect x="130.5" y="285" width="19" height="20" rx="5" fill="#FFFFFF" stroke="#22527B" stroke-width="1.4"/><text class="ms" x="140.0" y="299.5" text-anchor="middle">1</text>
  <line x1="210" y1="314" x2="350" y2="314" stroke="#D1182C" stroke-width="7"/>
  <rect x="270.5" y="285" width="19" height="20" rx="5" fill="#FFFFFF" stroke="#D1182C" stroke-width="1.4"/><text class="ms" x="280.0" y="299.5" text-anchor="middle">5</text>
  <line x1="350" y1="314" x2="490" y2="314" stroke="#22527B" stroke-width="4"/>
  <rect x="410.5" y="285" width="19" height="20" rx="5" fill="#FFFFFF" stroke="#22527B" stroke-width="1.4"/><text class="ms" x="420.0" y="299.5" text-anchor="middle">1</text>
  <circle cx="70" cy="314" r="18" fill="#FFFFFF" stroke="#22527B" stroke-width="2.4"/><text class="ms" x="70" y="318" text-anchor="middle" style="font-size:10.5px">0,0</text>
  <circle cx="210" cy="314" r="18" fill="#FFFFFF" stroke="#22527B" stroke-width="2.4"/><text class="ms" x="210" y="318" text-anchor="middle" style="font-size:10.5px">0,1</text>
  <circle cx="350" cy="314" r="18" fill="#FFFFFF" stroke="#22527B" stroke-width="2.4"/><text class="ms" x="350" y="318" text-anchor="middle" style="font-size:10.5px">0,2</text>
  <circle cx="490" cy="314" r="18" fill="#FFFFFF" stroke="#22527B" stroke-width="2.4"/><text class="ms" x="490" y="318" text-anchor="middle" style="font-size:10.5px">0,3</text>
  <text class="n" x="545" y="234">all the same</text>
  <text class="n" x="545" y="310">20 ÷ 4 ≈ 5:</text>
  <text class="n" x="545" y="328">five blocks' time</text>
</svg>
