  <text class="m" x="292" y="85" text-anchor="middle" style="font-size:14px">6</text>
  <text class="h" x="380" y="64">Why (0, 2) is 4, not 2</text>
  <rect x="380" y="82" width="280" height="60" rx="10" fill="#FFFFFF" stroke="#D1182C" stroke-width="2"/>
  <text class="nb" x="394" y="106" style="fill:#D1182C">By the slow road</text>
  <text class="m" x="394" y="126">1 + 5 = 6</text>
  <rect x="380" y="160" width="280" height="60" rx="10" fill="#FFFFFF" stroke="#2E7D32" stroke-width="2"/>
  <text class="nb" x="394" y="184" style="fill:#2E7D32">Right, up, back left</text>
  <text class="m" x="394" y="204">1 + 1 + 1 + 1 = 4</text>
  <text class="n" x="380" y="250">4 is cheaper, so 4 is kept.</text>
  <text class="sm" x="380" y="276">Every other number is the step count:</text>
  <text class="sm" x="380" y="292">Module 5's BFS rings.</text>
