  <path d="M 518 99 L 542 99" stroke="#D1182C" stroke-width="2.4" marker-start="url(#aR)"/>
  <text class="nb" x="548" y="96" style="fill:#D1182C">pop(0): the oldest</text>
  <text class="sm" x="548" y="112">cost 6, by the slow road</text>
  <path d="M 518 141 L 542 141" stroke="#2E7D32" stroke-width="2.4" marker-start="url(#aGr)"/>
  <text class="nb" x="548" y="138" style="fill:#2E7D32">closest(): cheapest</text>
  <text class="sm" x="548" y="154">first of the cost-3 entries</text>
  <text class="n" x="362" y="276">(0, 2) waits. Before its turn comes,</text>
  <text class="n" x="362" y="295">(1, 2) reaches it for 3 + 1 = <tspan class="m">4</tspan>, and</text>
  <text class="n" x="362" y="314">change 2 replaces the 6.</text>
